function addVeiculoFeirao(feiraoId, veiculoId){
  const f = DB.feiroes.find(x=>x.id===feiraoId); if(!f||!veiculoId) return;
  f.veiculoIds = f.veiculoIds||[];
  if(!f.veiculoIds.includes(veiculoId)) f.veiculoIds.push(veiculoId);
  f.updatedAt=Date.now(); save(); abrirFeiraoDetalhe(feiraoId);
}
function removeVeiculoFeirao(feiraoId, veiculoId){
  const f = DB.feiroes.find(x=>x.id===feiraoId); if(!f) return;
  f.veiculoIds = (f.veiculoIds||[]).filter(id=>id!==veiculoId);
  f.updatedAt=Date.now(); save(); abrirFeiraoDetalhe(feiraoId);
}

    <div class="field"><label>Observações</label><textarea id="ldObs" maxlength="240" style="min-height:60px"></textarea></div>`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn green" onclick="salvarLeadFeirao('${feiraoId}')">Salvar</button>`);
}
function salvarLeadFeirao(feiraoId){

  if(!nome){ toast('Informe o nome do contato.'); return; }

function excluirLeadFeirao(feiraoId, leadId){

  f.leads = (f.leads||[]).filter(l=>l.id!==leadId); f.updatedAt=Date.now();

function salvarDespesaFeirao(feiraoId){
  const f = DB.feiroes.find(x=>x.id===feiraoId); if(!f) return;
  const valor = parseMoeda(document.getElementById('fdVal').value||'');
  if(valor<=0){ toast('Informe um valor.'); return; }
  DB.financeiro.despesas.push({
    id: uid(), categoria: document.getElementById('fdCat').value||'Estande/Feirão', valor,
    data: document.getElementById('fdData').value||todayISO(),
    descricao: document.getElementById('fdDesc').value||'',
    origem:'feirao', feiraoId: f.id, createdAt: Date.now()
  });
  save(); closeSheet(); toast('Despesa lançada.'); abrirFeiraoDetalhe(feiraoId);
}

let finExpCat = 'all';    // filtro de categoria
function iconeCat(c){ return c==='Estande/Feirão'?'🎪':c==='Transporte'?'🚗':c==='Refeição'?'🍽️':c==='Gasolina'?'⛽':c==='Repasse a consignante'?'🤝':c==='Documentação'?'📄':'📦'; }
function fmtMoedaSemRS(v){ return (parseFloat(v)||0).toFixed(2).replace('.',','); }

// barras por categoria (reaproveitado das duas visões) — padrão VetFlowCare
function cartaoCategorias(byCat, maxCat){
  const chaves = Object.keys(byCat);
  if(!chaves.length) return '';
  return `<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
      <div style="margin-top:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px"><span>${esc(c)}</span><b>${fmtBRL(v)}</b></div>
        <div style="height:7px;background:var(--bg);border-radius:4px;margin-top:3px">
          <div style="height:100%;width:${Math.round(v/maxCat*100)}%;background:var(--danger);border-radius:4px;opacity:.75"></div></div>
      </div>`).join('')}</div>`;
}
function fchip(on, label, onclick){
  return `<button onclick="${onclick}" style="padding:9px 14px;border-radius:100px;border:1.5px solid ${on?'var(--primary)':'var(--border)'};background:${on?'var(--primary)':'var(--surface)'};color:${on?'#fff':'var(--muted)'};font-size:12.5px;font-weight:700;white-space:nowrap;flex-shrink:0">${label}</button>`;
}
function renderFinanceiro(){
  document.getElementById('mainNav').classList.remove('hidden');
  appHdr().innerHTML = `<div class="eyebrow">Controle</div>
    <div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">${ic('wallet',20)} Financeiro</h2>
      <button class="btn sm green" style="width:auto" onclick="novaReceitaManual()">Receitas +</button>
      <button class="btn sm danger" style="width:auto" onclick="novaDespesaManual()">Despesa +</button></div>`;

  // Toggle de visão (ordem definida com o Celso): Por mês / Fluxo diário / Semana / Realizado / Todas
  let htop = `<div class="chiprow" style="margin-bottom:10px">
    ${fchip(finExpView==='mes',`${ic('calendar',14)} Por mês em aberto`,"fluxoDiaSel='';finExpView='mes';renderFinanceiro()")}
    ${fchip(finExpView==='semana',`${ic('semana',14)} Semana`,"fluxoDiaSel='';finExpView='semana';renderFinanceiro()")}
    ${fchip(finExpView==='fluxo',`${ic('chart',14)} Fluxo diário em aberto`,"fluxoDiaSel='';finExpView='fluxo';renderFinanceiro()")}
    ${fchip(finExpView==='realizado',`${ic('check',14)} Realizado`,"fluxoDiaSel='';finExpView='realizado';renderFinanceiro()")}
    ${fchip(finExpView==='all',`${ic('doc',14)} Todas`,"fluxoDiaSel='';finExpView='all';renderFinanceiro()")}
  </div>`;

  // Detalhe de um dia do fluxo diário (aberto ao tocar na linha da data)
  if((finExpView==='fluxo'||finExpView==='semana') && fluxoDiaSel){
    document.getElementById('mainContent').innerHTML = diaFluxoHTML(fluxoDiaSel); return;
  }

  if(finExpView==='fluxo'){ document.getElementById('mainContent').innerHTML = htop + fluxoDiarioHTML(); return; }
  if(finExpView==='semana'){ document.getElementById('mainContent').innerHTML = htop + fluxoDiarioHTML(true); return; }
  if(finExpView==='realizado'){ document.getElementById('mainContent').innerHTML = htop + realizadoHTML(); return; }

  const now = new Date();
  const md = new Date(now.getFullYear(), now.getMonth()+finExpM, 1);
  const ym = md.toISOString().slice(0,7);
  const todas = finExpView === 'all';

  // ── despesas e receitas do período ──
  // despesas com "data realizada" preenchida NÃO entram nos relatórios (vão para "Realizado")
  const despAtivas = DB.financeiro.despesas.filter(e=>!e.dataRealizada);
  const despBase = todas ? despAtivas.slice() : despAtivas.filter(e=>(e.data||'').startsWith(ym));
  const recAtivas = DB.financeiro.receitas.filter(e=>!e.dataRealizada);
  const recBase  = todas ? recAtivas.slice() : recAtivas.filter(e=>(e.data||'').startsWith(ym));
  const totDesp = despBase.reduce((s,e)=>s+(e.valor||0),0);
  const totRec  = recBase.reduce((s,e)=>s+(e.valor||0),0);
  const saldo   = totRec - totDesp;

  const byCat = {};
  despBase.forEach(e=>{ byCat[e.categoria||'Outros'] = (byCat[e.categoria||'Outros']||0) + (e.valor||0); });
  const maxCat = Math.max(1, ...Object.values(byCat));

  let h = htop;

  if(!todas){
    h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="btn sm gray" style="width:auto" onclick="finExpM--;renderFinanceiro()">‹</button>
      <b style="flex:1;text-align:center;font-size:15px">${MESES[md.getMonth()]} ${md.getFullYear()}</b>
      <button class="btn sm gray" style="width:auto" ${finExpM>=0?'disabled style="opacity:.4;width:auto"':''} onclick="finExpM++;renderFinanceiro()">›</button></div>`;
  }
  // Resumo Receitas / Despesas / Saldo
  h += `<div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;text-align:center">
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Receitas</div><b style="color:var(--success);font-size:15px">${fmtBRL(totRec)}</b></div>
      <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Despesas</div><b style="color:var(--danger);font-size:15px">${fmtBRL(totDesp)}</b></div>
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Saldo</div><b style="color:${saldo>=0?'var(--success)':'var(--danger)'};font-size:15px">${fmtBRL(saldo)}</b></div>
    </div>
    ${Object.keys(byCat).length?cartaoCategorias(byCat, maxCat):''}
  </div>`;

  // Lista combinada (receitas verdes + despesas vermelhas)
  let lista = [
    ...recBase.map(e=>({...e, _tipo:'rec'})),
    ...despBase.map(e=>({...e, _tipo:'desp'}))
  ].sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  if(!lista.length){
    h += `<div class="empty"><div class="big">${ic('receipt',40)}</div>Nenhum lançamento ${todas?'cadastrado':'neste mês'}<br><span style="font-size:12px">Use "Receitas +" ou "Despesa +" acima</span></div>`;
    document.getElementById('mainContent').innerHTML = h; return;
  }
  let mesAtual='';
  lista.forEach(e=>{
    if(todas){
      const emes=(e.data||'').slice(0,7);
      if(emes!==mesAtual){ mesAtual=emes; const [yy,mm]=emes.split('-');
        h += `<div style="margin:14px 2px 6px"><b style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">${mm?MESES[parseInt(mm)-1]+' '+yy:'Sem data'}</b></div>`; }
    }
    const rec = e._tipo==='rec';
    h += `<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;${estiloLinhaData(e.data)}" onclick="${rec?`editarReceita('${e.id}')`:`editarDespesa('${e.id}')`}">
      <div class="ptile-icon" style="width:38px;height:38px;flex-shrink:0;background:${rec?'var(--pgreen)':'var(--pblue)'}">${rec?'💚':iconeCat(e.categoria)}</div>
      <div style="flex:1;min-width:0">
        <b style="font-size:14px">${esc(e.categoria||(rec?'Receita':'Outros'))}</b>
        ${rec&&e.fontePagadora?`<div style="font-size:11px;color:var(--muted);margin-top:2px">Fonte pagadora: <b style="color:var(--text);font-weight:700">${esc(e.fontePagadora)}</b></div>`:''}
        ${e.descricao?`<div style="font-size:11px;color:var(--muted);margin-top:2px;white-space:pre-wrap">${ic('doc',12)} ${esc(e.descricao)}</div>`:''}
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtDataBR(e.data)}${e.origem==='agenda'?' · agenda':''} · toque para editar</div></div>
      <b style="color:${rec?'var(--success)':'var(--danger)'};white-space:nowrap">${rec?'+':'-'} ${fmtBRL(e.valor)}</b>
      <button style="background:none;color:var(--muted)" onclick="event.stopPropagation();${rec?`excluirReceita('${e.id}')`:`excluirDespesa('${e.id}')`}">${ic('trash',15)}</button></div>`;
  });
  document.getElementById('mainContent').innerHTML = h;
}

// ── Relatório de fluxo diário (Receitas / Despesas / Saldo acumulado) ──
let fluxoIni = '', fluxoFim = '', fluxoDiaSel = '';
function fluxoPeriodo(qual){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if(qual==='semana'){
    fluxoIni = isoDate(hoje);
    const fim = new Date(hoje); fim.setDate(fim.getDate()+7);   // hoje até +7 dias
    fluxoFim = isoDate(fim);
    finExpView = 'semana';
  } else if(qual==='mes'){
    fluxoIni = isoDate(new Date(hoje.getFullYear(), hoje.getMonth(), 1));
    fluxoFim = isoDate(new Date(hoje.getFullYear(), hoje.getMonth()+1, 0));
    finExpView = 'fluxo';
  } else if(qual==='hoje'){
    fluxoIni = isoDate(hoje); fluxoFim = isoDate(hoje);
    finExpView = 'fluxo';
  }
  renderFinanceiro();
}
function ehHoje(iso){ return iso===isoDate(new Date()); }
function estiloLinhaData(iso){
  const d = new Date(iso+'T00:00:00'); const dow = d.getDay();
  let s = '';
  if(dow===0||dow===6) s += ';background:#FFF7CC';                 // fim de semana amarelo claro
  if(ehHoje(iso)) s += ';border-top:3px solid var(--dark);border-bottom:3px solid var(--dark);font-weight:800';
  return s;
}
let realIni = '', realFim = '';
function realizadoHTML(){
  const despR = DB.financeiro.despesas.filter(e=>e.dataRealizada).map(e=>({...e,_t:'desp'}));
  const recR  = DB.financeiro.receitas.filter(e=>e.dataRealizada).map(e=>({...e,_t:'rec'}));
  const todasR = [...despR, ...recR];
  const hojeIso = isoDate(new Date());
  if(!realIni){ const datas = todasR.map(e=>e.dataRealizada).sort(); realIni = datas.length ? datas[0] : hojeIso.slice(0,8)+'01'; }
  if(!realFim) realFim = hojeIso;
  let lista = todasR.filter(e=> e.dataRealizada>=realIni && e.dataRealizada<=realFim)
                    .sort((a,b)=> (a.dataRealizada||'').localeCompare(b.dataRealizada||''));
  const totRec  = lista.filter(e=>e._t==='rec').reduce((s,e)=>s+(e.valor||0),0);
  const totDesp = lista.filter(e=>e._t==='desp').reduce((s,e)=>s+(e.valor||0),0);
  const saldo = totRec - totDesp;
  let h = `<div class="card" style="margin-bottom:10px">
    <div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px">✅ Realizados (com data realizada preenchida)</div>
    <div class="row2">
      <div class="field" style="margin:0"><label>De (data realizada)</label><input type="date" value="${realIni}" max="${realFim}" onchange="realIni=this.value;renderFinanceiro()"></div>
      <div class="field" style="margin:0"><label>Até</label><input type="date" value="${realFim}" min="${realIni}" onchange="realFim=this.value;renderFinanceiro()"></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;text-align:center">
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Receitas</div><b style="color:var(--success);font-size:15px">${fmtBRL(totRec)}</b></div>
      <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Despesas</div><b style="color:var(--danger);font-size:15px">${fmtBRL(totDesp)}</b></div>
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Saldo</div><b style="color:${saldo>=0?'var(--success)':'var(--danger)'};font-size:15px">${fmtBRL(saldo)}</b></div>
    </div>
  </div>`;
  if(!lista.length){
    return h + `<div class="empty"><div class="big">✅</div>Nenhum lançamento realizado neste período.<br><span style="font-size:12px">Preencha o campo "Data realizada" ao editar uma despesa ou receita.</span></div>`;
  }
  h += lista.map(e=>{ const rec = e._t==='rec';
    return `<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="${rec?`editarReceita('${e.id}')`:`editarDespesa('${e.id}')`}">
      <div class="ptile-icon" style="width:38px;height:38px;flex-shrink:0;background:${rec?'var(--pgreen)':'var(--pblue)'}">${rec?'💚':iconeCat(e.categoria)}</div>
      <div style="flex:1;min-width:0">
        <b style="font-size:14px">${esc(e.categoria||(rec?'Receita':'Despesa'))}</b>
        ${rec&&e.fontePagadora?`<div style="font-size:11px;color:var(--muted);margin-top:2px">Fonte pagadora: <b style="color:var(--text);font-weight:700">${esc(e.fontePagadora)}</b></div>`:''}
        ${e.descricao?`<div style="font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ic('doc',12)} ${esc(e.descricao)}</div>`:''}
        <div style="font-size:11px;color:var(--muted);margin-top:2px">realizada em <b style="color:var(--text)">${fmtDataBR(e.dataRealizada)}</b> · lançada ${fmtDataBR(e.data)}</div></div>
      <b style="color:${rec?'var(--success)':'var(--danger)'};white-space:nowrap">${rec?'+':'-'} ${fmtBRL(e.valor)}</b></div>`;
  }).join('');
  return h;
}
// A data final nunca fica antes da inicial: ao mover a inicial para frente,
// a final acompanha; e uma final anterior é recusada com aviso.
function setFluxoIni(v){
  if(!v) return;
  fluxoIni = v;
  if(fluxoFim < fluxoIni) fluxoFim = fluxoIni;
  fluxoDiaSel=''; finExpView='fluxo'; renderFinanceiro();
}
function setFluxoFim(v){
  if(!v) return;
  if(v < fluxoIni){ toast('A data final não pode ser anterior à data inicial.'); renderFinanceiro(); return; }
  fluxoFim = v;
  fluxoDiaSel=''; finExpView='fluxo'; renderFinanceiro();
}
function fluxoDiarioHTML(modoSemana){
  const todas = [...DB.financeiro.receitas, ...DB.financeiro.despesas].map(e=>e.data).filter(Boolean).sort();
  const hojeIso = isoDate(new Date());
  if(modoSemana){
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    fluxoIni = isoDate(hoje);
    const fim=new Date(hoje); fim.setDate(fim.getDate()+7); fluxoFim = isoDate(fim);
  } else {
    // Padrão: começa em ontem (hoje − 1 dia) e vai até hoje. O vendedor pode
    // trocar as duas datas à vontade — a final é que nunca pode ficar antes da inicial.
    if(!fluxoIni) fluxoIni = addDays(hojeIso,-1);
    if(!fluxoFim) fluxoFim = hojeIso;
    if(fluxoFim < fluxoIni) fluxoFim = fluxoIni;
  }
  // despesas com "data realizada" preenchida NÃO entram nos relatórios
  const despAtivas = DB.financeiro.despesas.filter(e=>!e.dataRealizada);
  // saldo anterior (antes da data inicial)
  const recAtivas = DB.financeiro.receitas.filter(e=>!e.dataRealizada);
  const saldoAnt = recAtivas.filter(e=>(e.data||'')<fluxoIni).reduce((s,e)=>s+(e.valor||0),0)
                 - despAtivas.filter(e=>(e.data||'')<fluxoIni).reduce((s,e)=>s+(e.valor||0),0);

  let h = `<div class="card" style="margin-bottom:10px">
    ${modoSemana?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px">🗓️ Semana — de hoje até +7 dias</div>`:`
    <div class="chiprow" style="margin-bottom:10px">
      ${fchip(false,'🗓️ Este mês',"fluxoPeriodo('mes')")}
      ${fchip(false,'📆 Hoje',"fluxoPeriodo('hoje')")}
    </div>`}
    <div class="row2">
      <div class="field" style="margin:0"><label>Data inicial</label><input type="date" value="${fluxoIni}" onchange="setFluxoIni(this.value)"></div>
      <div class="field" style="margin:0"><label>Data final</label><input type="date" value="${fluxoFim}" min="${fluxoIni}" onchange="setFluxoFim(this.value)"></div>
    </div>
  </div>`;

  // itera dia a dia
  const di = new Date(fluxoIni+'T00:00:00'), df = new Date(fluxoFim+'T00:00:00');
  if(isNaN(di)||isNaN(df)||di>df){ return h + `<div class="empty"><div class="big">${ic('chart',40)}</div>Selecione um período válido.</div>`; }

  let acc = saldoAnt;
  let totR=0, totD=0;
  let linhas = '';
  for(let d=new Date(di); d<=df; d.setDate(d.getDate()+1)){
    const iso = isoDate(d);
    const r = recAtivas.filter(e=>e.data===iso).reduce((s,e)=>s+(e.valor||0),0);
    const p = despAtivas.filter(e=>e.data===iso).reduce((s,e)=>s+(e.valor||0),0);
    acc += r - p; totR+=r; totD+=p;
    const temMov = (r>0||p>0);
    linhas += `<div ${temMov?`onclick="abrirDiaFluxo('${iso}')" style="cursor:pointer;`:'style="opacity:.5;'}display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);${estiloLinhaData(iso)}">
      <div style="width:74px;flex-shrink:0;font-size:11.5px;font-weight:${ehHoje(iso)?'800':'600'}" class="mono">${fmtDataBR(iso)}</div>
      <div style="flex:1;text-align:right;color:var(--success);font-size:12px;font-weight:700">${r>0?fmtBRL(r):'—'}</div>
      <div style="flex:1;text-align:right;color:var(--danger);font-size:12px;font-weight:700">${p>0?fmtBRL(p):'—'}</div>
      <div style="flex:1;text-align:right;color:${acc>=0?'var(--success)':'var(--danger)'};font-size:12px;font-weight:800">${fmtBRL(acc)}</div>
    </div>`;
  }
  const saldoFinal = acc;
  h += `<div class="card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;padding:9px 10px;background:var(--pblue);font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--dark)">
      <div style="width:74px;flex-shrink:0">Data</div>
      <div style="flex:1;text-align:right">Receitas</div>
      <div style="flex:1;text-align:right">Despesas</div>
      <div style="flex:1;text-align:right">Saldo</div>
    </div>
    <div style="display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg);font-size:11px">
      <div style="width:74px;flex-shrink:0;color:var(--muted);font-weight:600">Saldo ant.</div>
      <div style="flex:1"></div><div style="flex:1"></div>
      <div style="flex:1;text-align:right;font-weight:800;color:${saldoAnt>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoAnt)}</div>
    </div>
    ${linhas}
    <div style="display:flex;align-items:center;padding:10px;background:var(--pblue);font-size:12px;font-weight:800">
      <div style="width:74px;flex-shrink:0">TOTAL</div>
      <div style="flex:1;text-align:right;color:var(--success)">${fmtBRL(totR)}</div>
      <div style="flex:1;text-align:right;color:var(--danger)">${fmtBRL(totD)}</div>
      <div style="flex:1;text-align:right;color:${saldoFinal>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoFinal)}</div>
    </div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">O saldo é acumulado: cada dia soma as receitas e subtrai as despesas do saldo do dia anterior, até a data final. Verde = positivo, vermelho = negativo. <b>Toque num dia com movimento para ver os lançamentos daquele dia.</b></div>`;
  return h;
}

// ── Detalhe de um dia do fluxo diário ──
// Mostra todos os lançamentos em aberto da data escolhida, com as mesmas cores
// da lista do Financeiro (receita em verde com "+", despesa em vermelho com "-").
function abrirDiaFluxo(iso){ fluxoDiaSel = iso; renderFinanceiro(); window.scrollTo(0,0); }
function fecharDiaFluxo(){ fluxoDiaSel = ''; renderFinanceiro(); window.scrollTo(0,0); }
function diaFluxoHTML(iso){
  const recs  = DB.financeiro.receitas.filter(e=>!e.dataRealizada && e.data===iso);
  const desps = DB.financeiro.despesas.filter(e=>!e.dataRealizada && e.data===iso);
  const totRec  = recs.reduce((s,e)=>s+(e.valor||0),0);
  const totDesp = desps.reduce((s,e)=>s+(e.valor||0),0);
  const saldo = totRec - totDesp;

  let h = `<button class="btn gray" style="width:auto;padding:8px 16px;margin-bottom:10px" onclick="fluxoDiaSel='';renderFinanceiro()">‹ Voltar</button><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <b style="flex:1;font-size:15px">${ic('calendar',16)} Lançamentos de ${fmtDataBR(iso)}</b></div>
  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;text-align:center">
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Receitas</div><b style="color:var(--success);font-size:15px">${fmtBRL(totRec)}</b></div>
      <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Despesas</div><b style="color:var(--danger);font-size:15px">${fmtBRL(totDesp)}</b></div>

function syncMinReal(dataId, realId){ var d=document.getElementById(dataId), r=document.getElementById(realId); if(d&&r){ r.min=d.value||''; if(r.value && d.value && r.value < d.value){ r.value=''; } } }

function editarDespesa(id){

  showSheet('✏️ Editar despesa', despForm(ex),

function salvarDespesaManual(editId){
  if(bloqueioTrial('salvar a despesa')) return;
  const valor = parseMoeda(document.getElementById('ndVal').value);
  if(valor<=0){ toast('Informe um valor.'); return; }
  let categoria = document.getElementById('ndCat').value;
  if(categoria==='__nova__'){
    categoria = (document.getElementById('ndCatNova').value||'').trim();
    if(!categoria){ toast('Digite a nova categoria.'); return; }
  }
  if(!categoria){ toast('Selecione ou digite uma categoria.'); return; }
  const veiculoId = document.getElementById('ndVeiculo')?.value || '';
  const veiculoCodigo = veiculoId ? (DB.veiculos.find(im=>im.id===veiculoId)?.codigo||'').toUpperCase() : '';
  const dados = { categoria, valor,
    data:document.getElementById('ndData').value||isoDate(new Date()),
    dataRealizada:document.getElementById('ndDataReal')?.value||'',
    veiculoId, veiculoCodigo,
    descricao:document.getElementById('ndDesc').value||'' };
  if(dados.dataRealizada && dados.dataRealizada < dados.data){ toast('A data realizada não pode ser anterior à data.'); return; }
  const commit = ()=>{
    if(editId){ const ex = DB.financeiro.despesas.find(d=>d.id===editId); if(ex) Object.assign(ex, dados); }
    else { DB.financeiro.despesas.push({ id:uid(), origem:'manual', createdAt:Date.now(), ...dados }); }
    save(); closeSheet(); toast(editId?'✏️ Despesa regravada!':'🧾 Despesa registrada!'); atualizarAposLancamento();
  };
  if(editId){ _pendingCommit = commit; confirmar({icon:'✏️', title:'Regravar o lançamento?', msg:`Confirmar as alterações da despesa de <b>${fmtBRL(valor)}</b>?`, noLabel:'Voltar', yesLabel:'Regravar', yes:'_runPendingCommit()'}); }
  else { commit(); }
}
let _pendingCommit = null;
function _runPendingCommit(){ const f=_pendingCommit; _pendingCommit=null; if(f) f(); }
function excluirDespesa(id){
  if(bloqueioTrial('excluir a despesa')) return;
  const e = DB.financeiro.despesas.find(d=>d.id===id);
  confirmar({icon:'🧾', title:'Excluir despesa?', msg:`Deseja excluir a despesa de <b>${fmtBRL(e?.valor)}</b>${e?.categoria?` (${esc(e.categoria)})`:''}?`,

function doExcluirDespesa(id){

  DB.financeiro.despesas = DB.financeiro.despesas.filter(d=>d.id!==id);
  save(); toast('🗑️ Despesa excluída'); atualizarAposLancamento();
}

let _proCountdownTimer = null;
function startProCountdownTicker(){
  stopProCountdownTicker();

    if(currentTab!=='config'){ stopProCountdownTicker(); return; }
    const num = document.getElementById('proCountdownNum');
    if(!num){ stopProCountdownTicker(); return; }
    const d = diasRestantesPro();

    <div class="pwwrap" style="margin-top:10px"><input id="ajPass2" type="password" placeholder="Digite a senha de novo" maxlength="64" oninput="conferirSenhasAj()"><button type="button" class="eye" onclick="togglePw('ajPass2',this)">👁</button></div>

function conferirSenhasAj(){
  const p1=val('ajPass'), p2=val('ajPass2'); const ok=validatePassword(p1).ok;

  if(!p2){ if(el)el.textContent=''; if(btn)btn.disabled=true; return; }
  const ig=p1===p2; if(el){ el.textContent=ig?'✓ As senhas conferem':'✕ As senhas não conferem'; el.style.color=ig?'var(--success)':'var(--danger)'; }
  if(btn) btn.disabled=!(ig&&ok);
}
async function doCriarSenhaAjustes(){
  const p1=val('ajPass'), p2=val('ajPass2');
  if(p1!==p2 || !validatePassword(p1).ok) return;
  const msg=await criarSenhaParaDBAtual(p1);
  if(msg){ closeSheet(); showSheet('⚠️ Não foi possível ativar a senha', `<div style="font-size:13px;color:var(--text);line-height:1.6">${esc(msg)}</div>`, `<button class="btn" onclick="closeSheet()">Entendi</button>`); return; }

function removerSenha(){

}
function pedirSenhaParaRemover(){
  showSheet('Remover senha', `
    <label>Senha atual</label><div class="pwwrap"><input id="rmOld" type="password"><button type="button" class="eye" onclick="togglePw('rmOld',this)">👁</button></div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">Depois de remover, o app abrirá <b>sem pedir senha</b>.</div>`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn danger" onclick="doRemoverSenha()">Remover senha</button>`);
}
async function doRemoverSenha(){
  const auth=getAuth(); if(!auth){ closeSheet(); return; }
  const key=await deriveKey(val('rmOld'), b64d(auth.salt));
  if(!(await verifyKey(key, auth.check))){ toast('Senha atual incorreta'); return; }
  _cryptoKey=null;
  localStorage.removeItem(LS_AUTH);
  if(!DB.settings) DB.settings={};
  DB.settings.senhaDispensada=true;
  await persistDB();
  sessionStorage.removeItem('unlocked');
  closeSheet(); if(currentTab==='config') renderConfig(); toast('Senha removida. O app abrirá sem senha.');
}
function openChangePass(){
  showSheet('Alterar senha', `
    <label>Senha atual</label><div class="pwwrap"><input id="cpOld" type="password"><button type="button" class="eye" onclick="togglePw('cpOld',this)">👁</button></div>

    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="doChangePass()">Salvar</button>`);
}
var _senhaTmp='', _senhaDone=null;
function enviarSenhaWhats(senha, onDone){
  _senhaTmp = senha||''; _senhaDone = onDone||null;
  var _raw=(DB.vendedor&&DB.vendedor.whatsapp)||''; var _num=_raw.replace(/\D/g,'');
  if(_num.length>=10){ doEnviarSenhaWhats(_num.length<=11?('55'+_num):_num); return; }
  showSheet('🔐 Guardar sua senha', `
    <div style="font-size:13px;color:var(--text);margin-bottom:10px">Envie sua senha para o <b>seu próprio WhatsApp</b>. Se um dia esquecer, você não perde o acesso aos seus dados (eles ficam criptografados e não há como recuperar sem a senha).</div>
    <div class="field"><label>Seu WhatsApp (com DDD)</label><input id="pwWhats" inputmode="numeric" maxlength="20" placeholder="(15) 99999-9999" value="${esc((DB.vendedor&&DB.vendedor.whatsapp)||'')}"></div>
    <div style="font-size:11px;color:var(--muted);line-height:1.6">A senha vai abrir no WhatsApp para você enviar a si mesmo. <b>Guarde a mensagem em local seguro</b> e evite compartilhá-la.</div>`,
    `<button class="btn gray" onclick="pularEnvioSenha()">Agora não</button><button class="btn green" onclick="doEnviarSenhaWhats()">Enviar ao meu WhatsApp</button>`);
}
function _fimEnvioSenha(){ _senhaTmp=''; closeSheet(); var f=_senhaDone; _senhaDone=null; if(typeof f==='function') f(); }
function pularEnvioSenha(){ _fimEnvioSenha(); }
function doEnviarSenhaWhats(numDireto){
  var num=numDireto;
  if(!num){ var raw=(val('pwWhats')||''); num=raw.replace(/\D/g,''); if(num.length<10){ toast('Informe um WhatsApp válido com DDD.'); return; } if(num.length<=11) num='55'+num; if(DB.vendedor){ DB.vendedor.whatsapp=raw; save(); } }
  var msg='🔐 AttimoDrive — GUARDE COM SEGURANÇA.\nSua senha de acesso é: '+_senhaTmp+'\n\nSem ela seus dados neste aparelho não podem ser recuperados.';
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
  toast('📲 Cópia da senha encaminhada ao seu WhatsApp.');
  _fimEnvioSenha();
}
async function doChangePass(){
  const auth = getAuth();
  try{
    const oldKey = await deriveKey(val('cpOld'), b64d(auth.salt));
    if(!(await verifyKey(oldKey, auth.check))){ toast('Senha atual incorreta.'); return; }
    const novo = val('cpNew');
    if(!validatePassword(novo).ok){ toast('Digite a nova senha.'); return; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(novo, salt);
    const check = await makeCheck(key);
    localStorage.setItem(LS_AUTH, JSON.stringify({salt:b64e(salt), check, createdAt:auth.createdAt}));
    _cryptoKey = key;
    await persistDB();
    closeSheet(); toast('Senha alterada com sucesso.');
    enviarSenhaWhats(novo);
  }catch(e){ closeSheet(); showSheet('⚠️ Erro ao alterar a senha', `<div style="font-size:13px;color:var(--text);line-height:1.6">${esc(''+(e&&e.message||e))}</div>`, `<button class="btn" onclick="closeSheet()">Entendi</button>`); }
}
function doLogout(){
  sessionStorage.removeItem('unlocked');
  _cryptoKey = null;
  location.reload();
}
function confirmarReset(){
  confirmar({icon:'⚠️', title:'Apagar tudo?', msg:'Todos os veículos, fotos e a senha serão apagados permanentemente deste aparelho.',
    noLabel:'Cancelar', yesLabel:'Apagar tudo', yes:'doResetTudo()'});

async function doResetTudo(){
  localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_AUTH);
  sessionStorage.removeItem('unlocked');
  try{ indexedDB.deleteDatabase('attimodrive_midia'); }catch(e){}
  location.reload();
}

let FC = null;
function fcMoeda(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fcData(v){ return (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? fmtDataBR(v) : (v||''); }

// ── Contexto de preenchimento automático ─────────────────────────────────────
function fcPessoas(){
  const out = [];
  (DB.consignantes||[]).forEach(p=>out.push({id:p.id, origem:'consignante', nome:p.nome||'(sem nome)',
    sub:'Proprietário/consignante'+(p.codigo?' · Nº '+p.codigo:'')}));
  (DB.interessados||[]).forEach(p=>out.push({id:p.id, origem:'interessado', nome:p.nome||'(sem nome)',
    sub:'Interessado'+(p.estagio?' · '+p.estagio:'')}));
  return out.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function fcAchaPessoa(id, origem){
  const lista = origem==='consignante' ? (DB.consignantes||[]) : (DB.interessados||[]);
  return lista.find(x=>x.id===id) || null;
}
function fcCtx(){
  const veic = FC.veiculoId ? (DB.veiculos||[]).find(v=>v.id===FC.veiculoId) : null;
  const pes  = FC.pessoaId ? fcAchaPessoa(FC.pessoaId, FC.pessoaTipo) : null;
  const pf   = (pes && pes.dadosFicha) || {};
  const ano  = veic ? ((veic.anoFab||'')+(veic.anoModelo?'/'+veic.anoModelo:'')) : '';
  return {
    veic: veic ? {
      marca:veic.marca||'', modelo:veic.modelo||'', versao:veic.versao||'',
      marcaModelo:((veic.marca||'')+' '+(veic.modelo||'')).trim(),
      modeloVersao:((veic.modelo||'')+(veic.versao?' '+veic.versao:'')).trim(),
      cor:veic.cor||'', ano:ano, km:veic.km?Number(veic.km).toLocaleString('pt-BR'):'',
      combustivel:veic.combustivel||'', placa:veic.placa||'', chassi:veic.chassi||'',
      renavam:veic.renavam||'', portas:veic.portas||'',
      valorVenda: veic.valorVenda?fcMoeda(veic.valorVenda):''
    } : {},
    pessoa: pes ? {
      nome:pes.nome||'', cpf:pes.cpf||'', telefone:pes.whatsapp||pes.telefone||'',
      rg:pf.rg||'', endereco:pf.endereco||'', nascimento:pf.nascimento||'', mae:pf.mae||'',
      estadoCivil:pf.estadoCivil||'', nacionalidade:pf.nacionalidade||'', cep:pf.cep||'',
      email:pf.email||'', imovel:pf.imovel||'', tempoResid:pf.tempoResid||'',
      cargo:pf.cargo||'', empresaTrab:pf.empresaTrab||'', renda:pf.renda||'', admissao:pf.admissao||''
    } : {},
    vendedor: { nome:(DB.vendedor&&DB.vendedor.nome)||'', empresa:(DB.vendedor&&DB.vendedor.empresa)||'',
                cidade:(DB.vendedor&&DB.vendedor.cidade)||'' }
  };
}
// Preenche o que está vazio com o que já está cadastrado (não sobrescreve o que foi digitado).
function fcPreencher(){
  const ctx = fcCtx();
  const def = FICHAS[FC.tipo];
  def.secoes.forEach(s=>(s.c||[]).forEach(f=>{
    if(FC.d[f.k]) return;
    if(f.padrao){ FC.d[f.k] = f.padrao; return; }
    if(f.hoje){ FC.d[f.k] = isoDate(new Date()); return; }
    if(!f.src) return;
    const [grupo, chave] = f.src.split('.');
    const v = (ctx[grupo]||{})[chave];
    if(v) FC.d[f.k] = v;
  }));
  fcRecalc();
}
function fcRecalc(){
  if(FC.tipo!=='financiamento') return;
  const tot = parseMoeda(FC.d.valorTotal||''), ent = parseMoeda(FC.d.entrada||'');
  if(tot){ const fin = Math.max(0, tot - ent); FC.d.valorFinanciar = fcMoeda(fin); }
}

function novaFicha(tipo, vid){

function fcOpcDoVeiculo(){
  const v = FC.veiculoId ? (DB.veiculos||[]).find(x=>x.id===FC.veiculoId) : null;
  if(!v || (FC.opcionais||[]).length) return;
  const set = new Set(v.opcionais||[]);
  if(v.direcao==='Hidráulica') set.add('Direção hidráulica');
  if(/Autom/.test(v.cambio||'')) set.add('Câmbio automático');
  if(set.has('Bancos de couro')) set.add('Bancos de couro');
  FC.opcionais = FC_OPCIONAIS.filter(o=>set.has(o));
}

// ── Formulário ───────────────────────────────────────────────────────────────
function renderFicha(){
  const def = FICHAS[FC.tipo];
  appHdr().innerHTML = `<h2>${def.titulo}</h2>
    <div style="font-size:12px;color:var(--muted);margin-top:2px">${def.sub}</div>`;
  const veic = FC.veiculoId ? (DB.veiculos||[]).find(v=>v.id===FC.veiculoId) : null;
  const pes  = FC.pessoaId ? fcAchaPessoa(FC.pessoaId, FC.pessoaTipo) : null;
  const campo = (f)=>{
    const v = FC.d[f.k]||'';
    const cls = f.w ? 'fc-f w1' : 'fc-f';
    let inner;
    if(f.tipo==='textarea'){
      inner = `<textarea rows="${f.alto?4:2}" placeholder="${esc(f.ph||'')}" oninput="fcSet('${f.k}',this.value)">${esc(v)}</textarea>`;
    } else if(f.tipo==='select'){
      inner = `<select onchange="fcSet('${f.k}',this.value)">${f.op.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o||'—')}</option>`).join('')}</select>`;
    } else if(f.tipo==='money'){
      inner = `<input id="fc_${f.k}" inputmode="numeric" placeholder="0,00" value="${esc(v)}" ${f.calc?'readonly style="background:var(--bg)"':''}
        oninput="maskMoedaG(this);fcSet('${f.k}',this.value)">`;
    } else if(f.tipo==='date'){
      inner = `<input type="date" value="${esc(v)}" onchange="fcSet('${f.k}',this.value)">`;
    } else if(f.tipo==='cpf'){
      inner = `<input inputmode="numeric" maxlength="14" placeholder="000.000.000-00" value="${esc(v)}" oninput="fcSet('${f.k}',this.value)">`;
    } else if(f.tipo==='tel'){
      inner = `<input inputmode="tel" maxlength="20" placeholder="(00) 00000-0000" value="${esc(v)}" oninput="fcSet('${f.k}',this.value)">`;
    } else if(f.tipo==='num'){
      inner = `<input inputmode="numeric" placeholder="${esc(f.ph||'')}" value="${esc(v)}" oninput="fcSet('${f.k}',this.value)">`;
    } else {
      inner = `<input placeholder="${esc(f.ph||'')}" value="${esc(v)}" oninput="fcSet('${f.k}',this.value)">`;
    }
    return `<div class="${cls}"><label>${esc(f.l)}</label>${inner}</div>`;
  };
  const escalaLinha = (f, opts)=>`
    <div class="fc-scale-row"><div class="fc-scale-l">${esc(f.l)}</div>
      <div class="fc-scale">${opts.map(o=>`<button type="button" class="${FC.d[f.k]===o?'on':''}"
        onclick="fcSet('${f.k}','${esc(o)}',1)">${esc(o)}</button>`).join('')}</div></div>`;
  const secaoHTML = (s)=>{
    let corpo;
    if(s.tipoSecao==='escala'){
      corpo = s.c.map(f=>escalaLinha(f, s.escala)).join('');
    } else if(s.tipoSecao==='opcionais'){
      corpo = `<div class="fc-opts">${FC_OPCIONAIS.map(o=>`
        <button type="button" class="fc-opt ${(FC.opcionais||[]).includes(o)?'on':''}" onclick="fcOpc('${esc(o)}')">
          <span class="bx">${(FC.opcionais||[]).includes(o)?'✓':''}</span>${esc(o)}</button>`).join('')}</div>
        <div class="fc-grid" style="margin-top:8px">${s.c.map(campo).join('')}</div>`;
    } else {
      corpo = `<div class="fc-grid">${s.c.map(campo).join('')}</div>`;
    }
    return `<div class="card fc-sec"><div class="fc-sec-t">${esc(s.t)}</div>${corpo}</div>`;
  };
  document.getElementById('mainContent').innerHTML = `
    <div class="card fc-sec">
      <div class="fc-sec-t">Preenchimento automático</div>
      <button class="dtile" style="margin-bottom:8px" onclick="fcEscolherVeiculo()">
        <div class="dtile-ic" style="background:var(--gradient-action)">${ic('car',17)}</div>

        <div class="dtile-ic" style="background:var(--gradient-blue)">${ic('user',17)}</div>
        <span style="flex:1">${pes?esc(pes.nome||'Pessoa')+'<br><span style="font-weight:600;color:var(--muted);font-size:10.5px">'+esc(FICHAS[FC.tipo].pessoaLabel)+' · toque para trocar</span>':esc(FICHAS[FC.tipo].pessoaLabel)}</span></button>
    </div>
    ${def.secoes.map(secaoHTML).join('')}

        <button class="dtile" onclick="fichaWhats()"><div class="dtile-ic" style="background:var(--gradient-whatsapp)">${ic('chat',18)}</div><span>Enviar no WhatsApp</span></button>
      </div>
      <button class="btn green" style="margin-top:12px" onclick="salvarFicha()">${ic('save',16)} Salvar ficha</button>
    </div>
    <div class="btnrow" style="margin-bottom:18px">
      <button class="btn gray" onclick="abrirFichas('${FC.veiculoId||''}')">${ic('back',16)} Voltar</button>
      ${(DB.fichas||[]).some(x=>x.id===FC.id)?`<button class="btn outline-danger" onclick="excluirFicha('${FC.id}')">${ic('trash',15)} Excluir</button>`:''}
    </div>`;
}
function fcSet(k, v, rerender){
  FC.d[k] = v;
  if(FC.tipo==='financiamento' && ['valorTotal','entrada','prazo','taxa'].includes(k)){
    fcRecalc();
    const el = document.querySelector('.fc-f input[readonly]');
    if(el) el.value = FC.d.valorFinanciar||'';
    const pv = parseMoeda(FC.d.valorFinanciar||''), n = parseInt(FC.d.prazo)||0, i = (parseFloat(String(FC.d.taxa||'').replace(',','.'))||0)/100;
    if(pv>0 && n>0 && typeof calcPrice==='function'){
      FC.d.parcela = fcMoeda(calcPrice(pv,n,i));
      const ep = document.getElementById('fc_parcela'); if(ep) ep.value = FC.d.parcela;
    }
  }
  if(rerender) renderFicha();
}
function fcOpc(o){
  FC.opcionais = FC.opcionais||[];
  const i = FC.opcionais.indexOf(o);
  if(i>=0) FC.opcionais.splice(i,1); else FC.opcionais.push(o);
  renderFicha();
}

// ── Salvar (guarda a ficha e devolve os dados para o cliente/veículo) ────────
function salvarFicha(){
  if(typeof bloqueioTrial==='function' && bloqueioTrial('salvar fichas')) return;
  DB.fichas = DB.fichas || [];
  FC.updatedAt = Date.now();
  const i = DB.fichas.findIndex(x=>x.id===FC.id);
  if(i>=0) DB.fichas[i] = JSON.parse(JSON.stringify(FC)); else DB.fichas.push(JSON.parse(JSON.stringify(FC)));

  // devolve o que foi digitado para o cadastro da pessoa (auto preenchimento futuro)
  const pes = FC.pessoaId ? fcAchaPessoa(FC.pessoaId, FC.pessoaTipo) : null;
  if(pes){
    pes.dadosFicha = pes.dadosFicha || {};
    const mapa = {rg:'rg', endereco:'endereco', nascimento:'nascimento', mae:'mae', estadoCivil:'estadoCivil',
      nacionalidade:'nacionalidade', cep:'cep', email:'email', imovel:'imovel', tempoResid:'tempoResid',
      cargo:'cargo', empresa:'empresaTrab', rendaMensal:'renda', admissao:'admissao'};
    Object.keys(mapa).forEach(k=>{ if(FC.d[k]) pes.dadosFicha[mapa[k]] = FC.d[k]; });
    if(FC.d.cpf && !pes.cpf) pes.cpf = FC.d.cpf;
    if(FC.d.telefone && !pes.whatsapp && !pes.telefone) pes.whatsapp = FC.d.telefone;
    pes.updatedAt = Date.now();
  }
  // devolve renavam/portas para o veículo
  const veic = FC.veiculoId ? (DB.veiculos||[]).find(v=>v.id===FC.veiculoId) : null;
  if(veic){
    if(FC.d.renavam) veic.renavam = FC.d.renavam;
    if(FC.d.portas) veic.portas = FC.d.portas;
  }
  save();
  toast('✓ Ficha salva. Os dados ficaram guardados para a próxima.');
  renderFicha();
}

// ── WhatsApp (resumo em texto; o PDF vai anexado pelo próprio WhatsApp) ──────
function fichaTexto(){
  const def = FICHAS[FC.tipo], cor = DB.vendedor||{};
  let t = '*'+def.titulo.toUpperCase()+'*\n';
  if(cor.empresa||cor.nome) t += (cor.empresa||cor.nome)+'\n';
  t += '\n';
  def.secoes.forEach(s=>{
    const linhas = [];
    (s.c||[]).forEach(f=>{ if(FC.d[f.k]) linhas.push('• '+f.l+': '+fcData(FC.d[f.k])); });
    if(s.tipoSecao==='opcionais' && (FC.opcionais||[]).length) linhas.unshift('• '+FC.opcionais.join(', '));
    if(linhas.length) t += '*'+s.t+'*\n'+linhas.join('\n')+'\n\n';
  });
  return t.trim();
}
function fichaWhats(){

function soDig(s){ return String(s||'').replace(/\D/g,''); }
function waLink(tel, texto){
  const t = soDig(tel);
  const num = t.length>=10 ? (t.length<=11 ? '55'+t : t) : '';
  window.open('https://wa.me/'+num+(texto?'?text='+encodeURIComponent(texto):''),'_blank');
}

function montarMsg(chave, vars){
  vars = vars||{};

  const nome = (vars.nome||'').trim().split(' ')[0];
  const mapa = { nome: nome||'tudo bem', nome_virgula: nome?', '+nome:'', veiculo: vars.veiculo||'veículo',
    data: vars.data||'', hora: vars.hora||'', vendedor: vend };

    <button class="btn gray" style="margin:14px 0 18px" onclick="goTab('inicio')">${ic('back',16)} Voltar</button>`;
}
// Procura o telefone de um cliente pelo nome em consignantes, test-drives, retornos e leads de feirão.
function telDoNome(nome){
  const n=(nome||'').trim().toLowerCase(); if(!n) return '';
  const p=(DB.consignantes||[]).find(x=>(x.nome||'').toLowerCase()===n && x.whatsapp); if(p) return p.whatsapp;
  const a=(DB.agendamentos||[]).find(x=>(x.compradorNome||'').toLowerCase()===n && x.compradorTel); if(a) return a.compradorTel;
  const r=(DB.retornos||[]).find(x=>(x.nome||'').toLowerCase()===n && x.tel); if(r) return r.tel;
  for(const f of (DB.feiroes||[])){ const l=(f.leads||[]).find(x=>(x.nome||'').toLowerCase()===n && x.telefone); if(l) return l.telefone; }
  return '';
}
function rtAutoTel(){
  if(RT.tel) return;
  const tel = telDoNome(RT.nome);
  if(tel){ RT.tel = tel; const el=document.getElementById('rtTel'); if(el) el.value = tel; }
}
function salvarRetorno(){
  if(typeof bloqueioTrial==='function' && bloqueioTrial('agendar retornos')) return;
  if(!(RT.nome||'').trim()){ toast('Informe o nome do cliente.'); return; }
  if(!RT.data){ toast('Escolha quando retornar.'); return; }
  DB.retornos = DB.retornos || [];
  DB.retornos.push({ id:uid(), nome:RT.nome.trim(), tel:RT.tel||'', veiculoId:RT.veiculoId||'', data:RT.data, hora:RT.hora||'',
    tipo:RT.tipo||'', obs:(RT.obs||'').trim(), feito:false, createdAt:Date.now() });
  save(); toast('✓ Retorno agendado para '+fmtDataBR(RT.data)+'.');
  abrirRetornos();
}
function feitoRetorno(id){ const r=(DB.retornos||[]).find(x=>x.id===id); if(!r) return; r.feito=true; r.feitoEm=Date.now(); save(); toast('Retorno concluído.'); renderRetornos(); }
function adiarRetorno(id){ const r=(DB.retornos||[]).find(x=>x.id===id); if(!r) return; const b=new Date(((r.data<isoDate(new Date()))?isoDate(new Date()):r.data)+'T00:00:00'); b.setDate(b.getDate()+1); r.data=isoDate(b); save(); toast('Adiado para '+fmtDataBR(r.data)+'.'); renderRetornos(); }
function excluirRetorno(id){ DB.retornos=(DB.retornos||[]).filter(x=>x.id!==id); save(); renderRetornos(); }
function waRetorno(id){
  const r=(DB.retornos||[]).find(x=>x.id===id); if(!r) return;
  const v = r.veiculoId ? DB.veiculos.find(x=>x.id===r.veiculoId) : null;
  waLink(r.tel, montarMsg('retorno',{nome:r.nome, veiculo:nomeVeic(v)}));
}
function abrirRetornosInteressado(id){ const c=(DB.interessados||[]).find(x=>x.id===id); abrirRetornos({nome:c?(c.nome||''):''}); }
function checarRetornos(){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    let fired=[]; try{ fired=JSON.parse(localStorage.getItem('ad_rt_fired')||'[]'); }catch(e){}
    const hoje=isoDate(new Date()); let ch=false;
    retornosVencidos().forEach(r=>{ const k=r.id+'@'+hoje; if(fired.indexOf(k)<0){ notify('📞 Retorno de cliente', r.nome+(r.obs?' — '+r.obs:'')); fired.push(k); ch=true; } });
    if(ch) localStorage.setItem('ad_rt_fired', JSON.stringify(fired.slice(-300)));
  }catch(e){}
}

/* ─────────── 2) SIMULADOR DE FINANCIAMENTO ─────────── */
let SM = null;
function abrirSimulador(vid){
  currentTab = 'inicio';
  document.getElementById('mainNav').classList.remove('hidden');
  const v = vid ? DB.veiculos.find(x=>x.id===vid) : null;
  const ult = (DB.settings&&DB.settings.simUltimo)||{};
  SM = { veiculoId: v?v.id:'', cliente:'', valor: v&&v.valorVenda ? fcMoeda(v.valorVenda) : '', entrada:'', prazo: ult.prazo||48, taxa: ult.taxa||'1,99', sist:'price' };
  renderSimulador();
}
function smNum(){
  const valor = parseMoeda(SM.valor||''), entrada = parseMoeda(SM.entrada||'');
  const n = parseInt(SM.prazo)||0, i = (parseFloat(String(SM.taxa||'').replace(',','.'))||0)/100;
  return {valor, entrada, pv: valor-entrada, n, i};
}
function calcPrice(pv,n,i){ return i>0 ? pv*i/(1-Math.pow(1+i,-n)) : pv/n; }
function calcSac(pv,n,i){ const am=pv/n; let tot=0,s=pv,ult=0; for(let k=0;k<n;k++){ const p=am+s*i; tot+=p; if(k===n-1) ult=p; s-=am; } return {primeira: am+pv*i, ultima: ult, total: tot, amort: am}; }
function renderSimulador(){
  appHdr().innerHTML = `<h2>Simulador de financiamento</h2><div style="font-size:12px;color:var(--muted);margin-top:2px">Estimativa para conversar com o cliente</div>`;
  const pct = [0,10,20,30,40,50];
  const prazos = [12,24,36,48,60,72];
  const {valor} = smNum();
  document.getElementById('mainContent').innerHTML = `
    <div class="card fc-sec">
      <div class="fc-sec-t">Veículo e cliente</div>
      <div class="field" style="margin-top:0"><label>Veículo do estoque (opcional)</label>
        <select onchange="smVeiculo(this.value)"><option value="">— digitar o valor —</option>
        ${(DB.veiculos||[]).filter(v=>v.status!=='Vendido'&&v.status!=='Repassado').map(v=>`<option value="${v.id}" ${SM.veiculoId===v.id?'selected':''}>${esc(nomeVeic(v))} · ${v.valorVenda?fmtBRL(v.valorVenda):'sem preço'}</option>`).join('')}
        </select></div>
      <div class="field"><label>Cliente (opcional)</label><input value="${esc(SM.cliente)}" list="rtPessoasSm" placeholder="Nome de quem vai financiar" oninput="SM.cliente=this.value">
        <datalist id="rtPessoasSm">${(fcPessoas?fcPessoas():[]).map(p=>`<option value="${esc(p.nome)}">`).join('')}</datalist></div>
    </div>
    <div class="card fc-sec">
      <div class="fc-sec-t">Condições</div>
      <div class="field" style="margin-top:0"><label>Valor do veículo (R$)</label><input inputmode="numeric" value="${esc(SM.valor)}" placeholder="0,00" oninput="SM.valor=maskMoedaG(this);smCalc()"></div>
      <div class="field"><label>Entrada (R$)</label><input id="smEnt" inputmode="numeric" value="${esc(SM.entrada)}" placeholder="0,00" oninput="SM.entrada=maskMoedaG(this);smCalc()"></div>
      <div class="chip-group" style="margin-top:-2px">${pct.map(p=>`<div class="chip" onclick="smPct(${p})">${p?p+'%':'Sem entrada'}</div>`).join('')}</div>
      <fieldset style="margin-top:12px"><legend>Prazo</legend><div class="chip-group">${prazos.map(p=>`<div class="chip ${+SM.prazo===p?'selected':''}" onclick="SM.prazo=${p};renderSimulador()">${p}x</div>`).join('')}</div>
        <input type="number" min="1" max="120" style="margin-top:8px" value="${esc(SM.prazo)}" placeholder="Outro prazo (meses)" oninput="SM.prazo=this.value;smCalc()"></fieldset>
      <div class="field"><label>Taxa de juros (% ao mês)</label><input inputmode="decimal" value="${esc(SM.taxa)}" placeholder="1,99" oninput="SM.taxa=this.value;smCalc()"></div>
      <fieldset><legend>Tabela</legend><div class="chip-group">
        <div class="chip ${SM.sist==='price'?'selected':''}" onclick="SM.sist='price';renderSimulador()">PRICE — parcela fixa</div>
        <div class="chip ${SM.sist==='sac'?'selected':''}" onclick="SM.sist='sac';renderSimulador()">SAC — parcela que cai</div></div></fieldset>
    </div>
    <div id="smRes"></div>
    <div class="hint" style="margin:6px 2px 14px">Simulação estimada, sem IOF, tarifas e seguro — o valor final depende da aprovação e das condições do banco.</div>
    <button class="btn gray" style="margin-bottom:18px" onclick="goTab('inicio')">${ic('back',16)} Voltar</button>`;
  smCalc();
}
function smVeiculo(id){ SM.veiculoId=id; const v=DB.veiculos.find(x=>x.id===id); if(v&&v.valorVenda) SM.valor=fcMoeda(v.valorVenda); renderSimulador(); }
function smPct(p){ const {valor}=smNum(); if(!valor){ toast('Informe primeiro o valor do veículo.'); return; } SM.entrada = p ? fcMoeda(valor*p/100) : ''; const el=document.getElementById('smEnt'); if(el) el.value=SM.entrada; smCalc(); }
function smLinha(k,v,dest){ return `<div style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted);font-size:13px">${k}</span><span style="font-weight:${dest?800:700};font-size:${dest?'20px':'13.5px'};color:${dest?'var(--success)':'var(--text)'}">${v}</span></div>`; }
function smCalc(){
  const el = document.getElementById('smRes'); if(!el) return;
  const {valor, entrada, pv, n, i} = smNum();
  if(!valor || pv<=0 || n<=0){ el.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);font-size:13px">Preencha o valor do veículo, uma entrada menor que o valor e o prazo para ver a parcela.</div>`; return; }
  let corpo;
  if(SM.sist==='price'){
    const p = calcPrice(pv,n,i), tot=p*n;
    corpo = smLinha('Valor financiado', fmtBRL(pv)) + smLinha(`Parcela fixa (${n}x)`, fmtBRL(p), true) + smLinha('Total pago no financiamento', fmtBRL(tot)) + smLinha('Total de juros', fmtBRL(tot-pv)) + smLinha('Custo total (entrada + parcelas)', fmtBRL(entrada+tot));
  } else {
    const s = calcSac(pv,n,i);
    corpo = smLinha('Valor financiado', fmtBRL(pv)) + smLinha('1ª parcela', fmtBRL(s.primeira), true) + smLinha(`Última parcela (${n}ª)`, fmtBRL(s.ultima)) + smLinha('Amortização mensal', fmtBRL(s.amort)) + smLinha('Total pago no financiamento', fmtBRL(s.total)) + smLinha('Total de juros', fmtBRL(s.total-pv));
  }
  const comp = [12,24,36,48,60,72].map(m=>`<tr${m===n?' style="font-weight:800;color:var(--primary)"':''}><td style="padding:6px 4px">${m}x</td><td style="padding:6px 4px;text-align:right">${fmtBRL(calcPrice(pv,m,i))}</td><td style="padding:6px 4px;text-align:right;color:var(--muted)">${fmtBRL(calcPrice(pv,m,i)*m)}</td></tr>`).join('');
  el.innerHTML = `
    <div class="card fc-sec"><div class="fc-sec-t">Resultado · ${SM.sist==='price'?'PRICE':'SAC'}</div>${corpo}</div>
    <div class="card fc-sec"><div class="fc-sec-t">Comparar prazos (PRICE)</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:var(--muted);font-size:11px;text-transform:uppercase"><td style="padding:4px">Prazo</td><td style="padding:4px;text-align:right">Parcela</td><td style="padding:4px;text-align:right">Total</td></tr>${comp}</table></div>
    <div class="dtiles" style="margin:0 0 4px">
      <button class="dtile" onclick="smEnviar()"><div class="dtile-ic" style="background:var(--gradient-whatsapp)">${ic('chat',18)}</div><span>Enviar ao cliente</span></button>
      <button class="dtile" onclick="smParaFicha()"><div class="dtile-ic" style="background:var(--gradient-success)">${ic('doc',18)}</div><span>Levar para a ficha de financiamento</span></button>
    </div>`;
  DB.settings.simUltimo = {prazo:SM.prazo, taxa:SM.taxa};
}
function smTexto(){
  const {valor, entrada, pv, n, i} = smNum();
  const v = SM.veiculoId ? DB.veiculos.find(x=>x.id===SM.veiculoId) : null;
  let t = montarMsg('simulacao',{nome:SM.cliente, veiculo:nomeVeic(v)||'veículo'}) + '\n\n';
  t += `🚗 Valor: ${fmtBRL(valor)}\n💵 Entrada: ${fmtBRL(entrada)}\n🏦 Financiado: ${fmtBRL(pv)}\n`;
  if(SM.sist==='price') t += `📆 ${n}x de ${fmtBRL(calcPrice(pv,n,i))} (parcela fixa)\n`;
  else { const s=calcSac(pv,n,i); t += `📆 ${n}x — 1ª de ${fmtBRL(s.primeira)}, caindo até ${fmtBRL(s.ultima)}\n`; }
  t += `Taxa usada: ${String(SM.taxa).replace('.',',')}% ao mês\n\nOutros prazos:\n`;
  [24,36,48,60].filter(m=>m!==n).forEach(m=>{ t += `• ${m}x de ${fmtBRL(calcPrice(pv,m,i))}\n`; });
  const vd = DB.vendedor||{}; if(vd.nome) t += `\n${vd.nome}${vd.empresa?' · '+vd.empresa:''}`;
  return t.trim();
}
function smEnviar(){
  const {pv,n} = smNum(); if(pv<=0||n<=0){ toast('Complete a simulação primeiro.'); return; }
  save();
  waLink(telDoNome(SM.cliente), smTexto());
}
function smParaFicha(){
  const {valor, entrada, pv, n, i} = smNum(); if(pv<=0||n<=0){ toast('Complete a simulação primeiro.'); return; }
  save();
  novaFicha('financiamento', SM.veiculoId||'');
  if(!FC) return;
  const pessoa = fcPessoas().find(p=>p.nome.toLowerCase()===(SM.cliente||'').trim().toLowerCase());
  if(pessoa){ FC.pessoaId=pessoa.id; FC.pessoaTipo=pessoa.origem; }
  FC.d.valorTotal = fcMoeda(valor); FC.d.entrada = entrada?fcMoeda(entrada):'';
  FC.d.prazo = String(n); FC.d.taxa = String(SM.taxa);
  FC.d.parcela = fcMoeda(SM.sist==='price' ? calcPrice(pv,n,i) : calcSac(pv,n,i).primeira);
  fcPreencher(); fcRecalc(); renderFicha();
  toast('Simulação levada para a ficha — confira e complete.');
}

/* ─────────── 6) DOCUMENTOS DO VEÍCULO ─────────── */
const DOC_SLOTS = [['crlv','CRLV / documento do veículo'],['laudo','Laudo cautelar / vistoria'],['contrato','Contrato de consignação'],
  ['compra','Nota ou recibo de compra'],['outro1','Outro documento'],['outro2','Outro documento']];
function keyDoc(vid, slot){ return `doc_${vid}_${slot}`; }
function contarDocs(v){ return Object.keys((v&&v.docs)||{}).length; }
function abrirDocumentos(vid){
  const v = DB.veiculos.find(x=>x.id===vid); if(!v) return;
  v.docs = v.docs || {};
  appHdr().innerHTML = `<h2>Documentos do veículo</h2><div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(nomeVeic(v))} · ${esc((v.codigo||'').toUpperCase())}</div>`;
  const slots = DOC_SLOTS.filter(([s])=> s!=='contrato' || v.origem==='Consignado' || v.docs.contrato);
  document.getElementById('mainContent').innerHTML = `
    <div class="public-note">Os documentos ficam guardados só neste aparelho (e entram no becape). Nunca aparecem no anúncio nem no compartilhamento do veículo.</div>
    ${slots.map(([s,l])=>{ const d=v.docs[s]; return `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:11px">
          <div style="background:${d?'var(--gradient-success)':'var(--gradient-gray)'};width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none">${ic(d?'check':'doc',18)}</div>
          <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13.5px">${l}</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d?esc(d.nome||'arquivo')+' · '+docTam(d.tamanho)+' · '+fmtDataBR(isoDate(new Date(d.em||Date.now()))):'Nenhum arquivo'}</div></div>
        </div>
        <div class="btnrow" style="margin-top:10px">
          ${d?`<button class="btn sm gray" onclick="verDoc('${v.id}','${s}')">${ic('eye',14)} Ver</button>
               <button class="btn sm" onclick="compartilharDoc('${v.id}','${s}')">${ic('share',14)} Enviar</button>
               <button class="btn sm outline-danger" onclick="removerDoc('${v.id}','${s}')">${ic('trash',14)}</button>`
             :`<button class="btn sm gray" onclick="anexarDoc('${v.id}','${s}','environment')">${ic('camera',14)} Fotografar</button>
               <button class="btn sm" onclick="anexarDoc('${v.id}','${s}')">${ic('plus',14)} Arquivo / PDF</button>`}
        </div></div>`; }).join('')}
    <button class="btn gray" style="margin:6px 0 18px" onclick="abrirDetalhe('${v.id}')">${ic('back',16)} Voltar ao veículo</button>`;
}
function docTam(b){ b=b||0; return b>1048576 ? (b/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
function anexarDoc(vid, slot, capture){
  if(typeof bloqueioTrial==='function' && bloqueioTrial('anexar documentos')) return;
  pegarArquivo(capture ? 'image/*' : 'image/*,application/pdf', capture||null, function(f){
    if(f.size > 12*1048576){ toast('Arquivo muito grande (máx. 12 MB).'); return; }
    const r = new FileReader();
    r.onload = ev => {
      const guardar = async (dataUrl, tam) => {
        try{
          await idbPut(keyDoc(vid,slot), dataUrl);
          const v = DB.veiculos.find(x=>x.id===vid); if(!v) return;
          v.docs = v.docs||{}; v.docs[slot] = {nome:f.name||'documento', tipo:f.type||'', tamanho:tam, em:Date.now()};
          save(); toast('✓ Documento anexado.'); abrirDocumentos(vid);
        }catch(e){ toast('Não foi possível guardar o arquivo neste aparelho.'); }
      };
      if((f.type||'').startsWith('image/')) downscaleImage(ev.target.result, 1800, 0.85, d=>guardar(d, Math.round(d.length*0.75)));
      else guardar(ev.target.result, f.size);
    };
    r.readAsDataURL(f);
  });
}
async function docFile(vid, slot){
  const v = DB.veiculos.find(x=>x.id===vid); const meta = v&&v.docs&&v.docs[slot]; if(!meta) return null;
  const d = await idbGet(keyDoc(vid,slot)); if(!d) return null;
  const ext = (meta.tipo==='application/pdf') ? '.pdf' : '.jpg';
  const nome = ((v.codigo||'veiculo')+'_'+slot+ext).toLowerCase();
  return {d, meta, file: await dataURLtoFile(d, nome)};
}
async function verDoc(vid, slot){
  const x = await docFile(vid, slot); if(!x){ toast('Arquivo não encontrado neste aparelho.'); return; }
  if((x.meta.tipo||'').startsWith('image/') || x.d.startsWith('data:image')){
    showSheet(x.meta.nome||'Documento', `<img src="${x.d}" style="width:100%;border-radius:12px;border:1px solid var(--border)">`, `<button class="btn gray" onclick="closeSheet()">Fechar</button>`);
  } else {
    const url = URL.createObjectURL(x.file); const w = window.open(url,'_blank');
    if(!w) toast('Permita pop-ups/nova aba para abrir o PDF.');
  }
}
async function compartilharDoc(vid, slot){
  const x = await docFile(vid, slot); if(!x){ toast('Arquivo não encontrado neste aparelho.'); return; }
  try{
    if(navigator.canShare && navigator.canShare({files:[x.file]})){ await navigator.share({files:[x.file], title:x.meta.nome}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(x.file); a.download = x.file.name; document.body.appendChild(a); a.click(); a.remove();
  toast('Arquivo baixado — anexe no WhatsApp pelo clipe 📎.');
}
function removerDoc(vid, slot){
  confirmar({icon:'🗑️', title:'Remover este documento?', msg:'O arquivo será apagado deste aparelho.', noLabel:'Cancelar', yesLabel:'Remover', yes:`doRemoverDoc('${vid}','${slot}')`});
}
function doRemoverDoc(vid, slot){
  idbDel(keyDoc(vid,slot)).catch(()=>{});
  const v = DB.veiculos.find(x=>x.id===vid); if(v&&v.docs){ delete v.docs[slot]; save(); }
  toast('Documento removido.'); abrirDocumentos(vid);
}
