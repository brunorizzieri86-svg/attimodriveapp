<script>
'use strict';
/* ============================================================
   MEU MECÂNICO — núcleo: utilitários, ícones, banco local, estado
   (arquitetura herdada do MEU TERREIRO: 100% offline, IndexedDB,
    pontos de restauração, trilha de auditoria, backup criptografado)

const APP={name:'MEU MECÂNICO',version:'1.7.9.0',schema:1,db:'meumecanico_db',sub:'Gestão completa de oficina'};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const iso=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>localISO();
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money=v=>(Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(v,d=0)=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const brDate=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const brDT=s=>{if(!s)return '—';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})};
const monthKey=d=>String(d||todayISO()).slice(0,7);
const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WDAYS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const monthLabel=k=>{const [y,m]=k.split('-');return MONTHS[+m-1]+' de '+y};
const parseISO=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parseISO(s||todayISO());d.setDate(d.getDate()+n);return localISO(d)};
const addMonths=(s,n)=>{const d=parseISO(s||todayISO()),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return localISO(d)};
const diffDays=(a,b)=>Math.round((parseISO(a)-parseISO(b))/864e5);
const weekday=s=>WDAYS[parseISO(s).getDay()];
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(parseISO(s));
const startOfMonth=(s)=>(s||todayISO()).slice(0,7)+'-01';
const endOfMonth=(s)=>{const d=parseISO(s||todayISO());return localISO(new Date(d.getFullYear(),d.getMonth()+1,0,12))};
const clone=v=>JSON.parse(JSON.stringify(v));
const sum=(a,f=x=>x)=>a.reduce((n,x)=>n+(Number(f(x))||0),0);
const byId=(arr,id)=>(arr||[]).find(x=>x.id===id);
const cents=v=>{if(v===null||v===undefined||v==='')return 0;let s=String(v).trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}const n=Number(s);return isFinite(n)?Math.round(n*100):0};
const moneyIn=c=>(Number(c||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?Math.round(a/b*100):0;
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?';
const firstName=n=>String(n||'').trim().split(/\s+/)[0]||'';
const cap=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
const debounce=(f,ms=200)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const uuid=()=>(crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});

const safeSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}};
function fmtPhone(v){const d=digits(v).replace(/^55(?=\d{10,11}$)/,'');if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return v||''}
function waNumber(v){const d=digits(v);if(!d)return '';if(d.length===10||d.length===11)return '55'+d;return d}
function fmtDoc(v){const d=digits(v);if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return v||''}
function validCPF(v){const c=digits(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);const d=((s*10)%11)%10;if(d!=c[t])return false}return true}
function validCNPJ(v){const c=digits(v);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)==c[12]&&calc(13)==c[13]}
const validDoc=v=>{const d=digits(v);return d.length===11?validCPF(d):d.length===14?validCNPJ(d):false};
const normPlate=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);
const validPlate=s=>/^[A-Z]{3}\d[A-Z0-9]\d{2}$/.test(normPlate(s));
const fmtPlate=s=>{const p=normPlate(s);return /^[A-Z]{3}\d{4}$/.test(p)?p.slice(0,3)+'-'+p.slice(3):p};
const validEmail=s=>!s||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
function bytesToB64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64ToBytes(s){const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
function checksum(obj){const s=JSON.stringify(obj);let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h.toString(16)}
async function sha256(text){if(!hasCrypto())return '';const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}

/* ---------- banco local (IndexedDB) ---------- */
let db=null,state=null,loadedRev=0,memoryMode=false,persistQ=Promise.resolve();
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB indisponível'));const r=indexedDB.open(APP.db,1);r.onupgradeneeded=()=>{const d=r.result;for(const s of ['kv','snapshots','blobs','handles'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('Banco bloqueado por outra janela'))})}
const idbReq=(store,mode,fn)=>new Promise((res,rej)=>{const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Transação cancelada'))});
const idbGet=(s,k)=>idbReq(s,'readonly',o=>o.get(k)), idbSet=(s,k,v)=>idbReq(s,'readwrite',o=>o.put(v,k)), idbDel=(s,k)=>idbReq(s,'readwrite',o=>o.delete(k));
const idbAll=s=>idbReq(s,'readonly',o=>o.getAll()), idbKeys=s=>idbReq(s,'readonly',o=>o.getAllKeys());
const putBlob=(id,data)=>db?idbSet('blobs',id,data):Promise.resolve();
const getBlob=id=>db?idbGet('blobs',id):Promise.resolve(null);
const delBlob=id=>db?idbDel('blobs',id):Promise.resolve();

const AUDIT_MAX=600;
function audit(module,action,record=''){if(!state)return;state.audit.unshift({id:uid('aud'),at:iso(),module,action,record,by:window.__ROLE==='staff'?'Funcionário':'Proprietário'});if(state.audit.length>AUDIT_MAX)state.audit.length=AUDIT_MAX}

async function loadState(){
 try{db=await openDB()}catch(e){console.error(e);db=null;memoryMode=true}
 let s=null;
 if(db){try{s=await idbGet('kv','state');const meta=await idbGet('kv','meta');loadedRev=(meta&&meta.rev)||(s&&s.rev)||0}catch(e){console.error(e)}}
 state=migrate(s||seedState());
 if(!s&&db){await idbSet('kv','state',state);await idbSet('kv','meta',{rev:0,at:iso()})}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
}
function persist(opts={}){
 persistQ=persistQ.then(async()=>{
  if(window.__DEMO)return;
  if(window.__LOCKDOWN)throw new Error('Operação bloqueada.');
  state.updatedAt=iso();
  if(!db){if(memoryMode)return;throw new Error('Banco local indisponível.')}
  const meta=await idbGet('kv','meta');
  if(meta&&meta.rev!==loadedRev){showConflict();throw new Error('Os dados foram alterados em outra janela. Recarregue a página.')}
  state.rev=loadedRev+1;
  await idbSet('kv','state',state);await idbSet('kv','meta',{rev:state.rev,at:state.updatedAt});
  loadedRev=state.rev;state.settings.backupChangeCount=(state.settings.backupChangeCount||0)+1;
  if(opts.snapshot!==false)maybeSnapshot().catch(console.error);
  if(typeof autoFolderTick==='function')autoFolderTick().catch(()=>{});
 }).catch(e=>{persistQ=Promise.resolve();throw e});
 return persistQ;
}
function showConflict(){if($('#conflictBar'))return;document.body.insertAdjacentHTML('afterbegin','<div id="conflictBar" style="position:fixed;z-index:900;top:0;left:0;right:0;background:#a8362b;color:#fff;padding:12px 16px;font-weight:700;text-align:center">⚠ Seus dados foram alterados em outra janela do app. Feche as outras janelas e <button class="btn sm" onclick="location.reload()" style="margin-left:8px">Recarregar agora</button></div>')}

/* pontos de restauração automáticos: 7 diários, 4 semanais, 6 mensais, 5 de segurança */
function weekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+pad(Math.ceil(((t-y0)/864e5+1)/7))}
async function maybeSnapshot(force=''){
 if(!db||window.__DEMO)return;const now=new Date(),per={daily:todayISO(),weekly:weekKey(now),monthly:todayISO().slice(0,7)};
 const keep={daily:7,weekly:4,monthly:6,safety:5,manual:5};
 const all=await idbAll('snapshots');const types=force?[force]:Object.keys(per).filter(t=>!all.some(s=>s.type===t&&s.period===per[t]));
 for(const t of types){const id=t+'_'+(per[t]||Date.now());const snap={id:t==='safety'||t==='manual'?t+'_'+Date.now():id,type:t,period:per[t]||'',at:iso(),label:force&&state.__snapLabel||'',checksum:checksum(state),data:clone(state)};await idbSet('snapshots',snap.id,snap)}
 const left=(await idbAll('snapshots')).sort((a,b)=>b.at.localeCompare(a.at));
 for(const t of Object.keys(keep)){for(const s of left.filter(x=>x.type===t).slice(keep[t]))await idbDel('snapshots',s.id)}
}
async function safetySnapshot(label){state.__snapLabel=label;try{await maybeSnapshot('safety')}finally{delete state.__snapLabel}}

function showModal(title,body,foot='',size=''){

 return id;
}

/* ---------- download / exportação ---------- */
function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1500)}
function exportCSV(name,headers,rows){
 const q=v=>{v=String(v??'');return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const csv='﻿'+[headers,...rows].map(r=>r.map(q).join(';')).join('\r\n');
 download(name+'_'+todayISO()+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));toast('Planilha CSV gerada. Abra no Excel.','ok');
}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
async function compressImage(file,max=1280,q=.74){
 const url=await fileToDataURL(file);if(!/^data:image\//.test(url))throw new Error('Arquivo não é uma imagem.');
 return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>rej(new Error('Imagem inválida.'));im.src=url});
}

function parseHash(){const p=(location.hash||'').replace(/^#\/?/,'').split('?')[0].split('/').map(decodeURIComponent);return {name:p[0]||'home',sub:p[1]||'',id:p[2]||''}}
function hashOf(name,sub='',id=''){return '#/'+[name,sub,id].filter((x,i)=>x||i===0&&0).map(encodeURIComponent).join('/')}
function go(name,sub='',id=''){
 const doGo=()=>{DIRTY=false;const h='#/'+[name,sub,id].map(x=>encodeURIComponent(x||'')).join('/').replace(/\/+$/,'');if(location.hash===h){R={name,sub,id};render()}else location.hash=h};
 if(DIRTY)return confirmBox('Sair sem salvar?','Você tem alterações que ainda não foram salvas. Se sair agora, elas serão perdidas.',doGo,{yes:'Sair sem salvar',no:'Continuar editando',danger:true});
 doGo();
}
window.addEventListener('hashchange',()=>{R=parseHash();closeAllModals();render()});
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
function modOf(n){return MODS.find(m=>m.key===n)}

 let m=modOf(R.name);if(m&&typeof modAllowed==='function'&&!modAllowed(m.key)){m=null;toast('Esta área é exclusiva do proprietário.','err')}
 if(!m){R={name:'home',sub:'',id:''};m=modOf('home');if(location.hash!=='#/home')history.replaceState(null,'','#/home')}
 const v=$('#view');let html;
 try{html=m.render(R)}catch(err){console.error(err);html=`<div class="card"><h2>Não foi possível abrir esta tela</h2><p class="muted">${esc(err.message)}</p><p><button class="btn primary" data-route="home">Voltar ao início</button></p></div>`}
 v.innerHTML=(typeof demoBanner==='function'?demoBanner():'')+html;
 $$('#sideNav [data-route],#mobileNav [data-route]').forEach(b=>b.classList.toggle('on',b.dataset.route===R.name||(R.name!=='home'&&b.dataset.route==='more'&&!['orders','customers','agenda','home'].includes(R.name))));

 document.title=`${m.label} · ${state.shop.name||APP.name}`;

function migrate(s){
 if(!s||typeof s!=='object'||Array.isArray(s))return seedState();
 const base=seedState();
 s.shop={...base.shop,...(s.shop||{})};
 s.settings={...base.settings,...(s.settings||{})};s.settings.cardFees={...base.settings.cardFees,...(s.settings.cardFees||{})};s.settings.autoFolder={...base.settings.autoFolder,...(s.settings.autoFolder||{})};
 s.accounts=s.accounts||[];ensureFixedAccounts(s.accounts);s.lists={...clone(DEFAULT_LISTS),...(s.lists||{})};
 for(const k of COLLECTIONS)if(!Array.isArray(s[k]))s[k]=k==='templates'?defaultTemplates():[];
 for(const t of defaultTemplates())if(!s.templates.some(x=>x.key===t.key))s.templates.push(t);
 if(!s.shopId)s.shopId=uuid();
 s.schemaVersion=APP.schema;s.appVersion=APP.version;s.rev=s.rev||0;
 return s;
}

function orderPay(o){
 const total=docTotals(o).total,tx=state.transactions.filter(t=>t.orderId===o.id&&t.type==='Receita'&&t.status!=='Cancelado');
 const paid=sum(tx.filter(t=>t.status==='Recebido'),t=>t.value),planned=sum(tx,t=>t.value);
 const late=tx.some(t=>t.status==='Pendente'&&(t.dueDate||t.date)<todayISO());
 let st='none';if(total>0){if(paid>=total)st='paid';else if(paid>0)st=late?'late':'part';else if(tx.length)st=late?'late':'open'}
 return {total,paid,planned,balance:Math.max(0,total-paid),unplanned:Math.max(0,total-planned),st,tx,late};
}

function cardFeePct(method,n){const f=state.settings.cardFees;if(method==='Débito')return Number(f.debit)||0;if(method==='Crédito')return Number(f.credit[n]??f.credit[1])||0;return 0}
function calcPlan(total,p){
 // p: {entry:{on,value,method,date,paid,account}, n, first, every(dias), method, interestPct, perInstallment? }
 const entry=p.entry&&p.entry.on?Math.min(total,Math.max(0,p.entry.value||0)):0;
 const rest=Math.max(0,total-entry),n=Math.max(1,Number(p.n)||1);
 const interest=Math.round(rest*(Number(p.interestPct)||0)/100),base=rest+interest;
 const each=Math.floor(base/n),rows=[];let acc=0;
 for(let i=0;i<n;i++){const v=i===n-1?base-acc:each;acc+=v;rows.push({n:i+1,value:v,due:addDays(p.first||todayISO(),i*(Number(p.every)||30))})}
 if(p.every===0||p.monthly)rows.forEach((r,i)=>r.due=addMonths(p.first||todayISO(),i));
 return {entry,rest,interest,base,rows,total:entry+base};
}

function parseContacts(text){
 const out=[];text=String(text||'');
 if(/BEGIN:VCARD/i.test(text)){text.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{const fn=(b.match(/^FN[^:]*:(.*)$/mi)||[])[1]||'';const tel=(b.match(/^TEL[^:]*:(.*)$/mi)||[])[1]||'';const em=(b.match(/^EMAIL[^:]*:(.*)$/mi)||[])[1]||'';if(fn.trim()||tel.trim())out.push({name:fn.trim(),phone:tel.trim(),email:em.trim()})});return out}
 text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const p=l.split(/[;\t]|,(?=\s*[\d(+])/).map(x=>x.replace(/^"|"$/g,'').trim());if(i===0&&/nome|name/i.test(p[0])&&!digits(p.join('')).length>6)return;let name='',phone='',email='';p.forEach(x=>{if(/@/.test(x))email=x;else if(digits(x).length>=8&&!phone&&!/[a-z]{3,}/i.test(x))phone=x;else if(!name)name=x});if(name||phone)out.push({name,phone,email})});
 return out;
}

function readVeh(old){
 const plate=normPlate(V('v_plate'));
 if(!V('v_cust'))return bad('v_cust_t','Escolha o proprietário do veículo (ou cadastre um novo cliente).');
 if(!plate)return bad('v_plate','Informe a placa.');
 const pt=(document.getElementById('v_ptype')||{}).value||'auto';
 if(pt==='old'&&!/^[A-Z]{3}\d{4}$/.test(plate))return bad('v_plate','Placa antiga: 3 letras e 4 números, como CMP-2250.');
 if(pt==='mercosul'&&!/^[A-Z]{3}\d[A-Z]\d{2}$/.test(plate))return bad('v_plate','Placa Mercosul: 3 letras, 1 número, 1 letra e 2 números, como ABC1D23.');
 if(!validPlate(plate))return bad('v_plate','Placa inválida. Use CMP-2250 (antiga) ou ABC1D23 (Mercosul).');
 if(state.vehicles.some(x=>x.id!==old?.id&&x.plate===plate))return bad('v_plate','Já existe um veículo cadastrado com esta placa.');
 if(!V('v_model'))return bad('v_model','Informe o modelo do veículo.');
 const y=V('v_year'),my=V('v_myear');if(y&&(+y<1950||+y>new Date().getFullYear()+1))return bad('v_year','Ano de fabricação inválido.');
 return {customerId:V('v_cust'),plate,kind:V('v_kind'),brand:V('v_brand'),model:V('v_model'),version:V('v_version'),year:y,modelYear:my,color:V('v_color'),fuel:V('v_fuel'),transmission:V('v_trans'),km:kmNum(V('v_km')),kmDate:old&&old.km===kmNum(V('v_km'))?old.kmDate:todayISO(),chassis:V('v_chassis'),renavam:V('v_renavam'),nextRevDate:V('v_nextdate'),nextRevKm:kmNum(V('v_nextkm')),notes:V('v_notes'),active:VB('v_active')};
}

/* ---------- lembretes de revisão ---------- */
function vehicleReminders(v){
 const out=[],today=todayISO(),horizon=state.settings.reminderDays||30,map={};
 const done=vehOrders(v.id).filter(o=>['Pronta','Entregue'].includes(o.status)).sort((a,b)=>String(a.finishedAt||a.openedAt).localeCompare(String(b.finishedAt||b.openedAt)));
 for(const o of done){const d=String(o.deliveredAt||o.finishedAt||o.openedAt).slice(0,10),km=o.kmOut||o.kmIn||0;
  for(const it of o.items||[]){if(it.type!=='service'||it.approved===false)continue;const kmI=Number(it.kmInt)||0,moI=Number(it.moInt)||0;if(!kmI&&!moI)continue;map[it.refId||norm(it.name)]={name:it.name,date:d,km,kmI,moI,orderCode:o.code}}}
 for(const [key,x] of Object.entries(map)){
  const dueDate=x.moI?addMonths(x.date,x.moI):'',dueKm=x.kmI&&x.km?x.km+x.kmI:0;
  let status='ok',reason=[];
  if(dueDate){const dd=diffDays(dueDate,today);if(dd<0){status='late';reason.push('venceu em '+brDate(dueDate))}else if(dd<=horizon){status='soon';reason.push('vence em '+brDate(dueDate))}else reason.push('próximo em '+brDate(dueDate))}
  if(dueKm&&v.km){const rest=dueKm-v.km;if(rest<=0){status='late';reason.push('passou de '+num(dueKm)+' km')}else if(rest<=1000&&status!=='late'){status='soon';reason.push('faltam ~'+num(rest)+' km')}else if(!dueDate)reason.push('próximo aos '+num(dueKm)+' km')}
  out.push({key:v.id+':'+key,vehicleId:v.id,customerId:v.customerId,service:x.name,dueDate,dueKm,lastDate:x.date,lastKm:x.km,status,reason:reason.join(' · '),orderCode:x.orderCode});
 }
 if(v.nextRevDate||v.nextRevKm){let status='ok',reason=[];if(v.nextRevDate){const dd=diffDays(v.nextRevDate,today);status=dd<0?'late':dd<=horizon?'soon':'ok';reason.push((dd<0?'venceu em ':'previsto para ')+brDate(v.nextRevDate))}if(v.nextRevKm&&v.km){const rest=v.nextRevKm-v.km;if(rest<=0)status='late';else if(rest<=1000&&status==='ok')status='soon';reason.push(num(v.nextRevKm)+' km')}out.push({key:v.id+':manual',vehicleId:v.id,customerId:v.customerId,service:'Revisão programada',dueDate:v.nextRevDate,dueKm:v.nextRevKm,lastDate:'',lastKm:0,status,reason:reason.join(' · ')})}
 const ord={late:0,soon:1,ok:2};return out.sort((a,b)=>ord[a.status]-ord[b.status]);
}
function allReminders(){
 const arr=[];for(const v of state.vehicles){if(v.active===false)continue;const c=getCustomer(v.customerId);if(!c||c.status==='Inativo')continue;for(const r of vehicleReminders(v)){const log=state.contactLog.filter(x=>x.refKey===r.key).sort((a,b)=>b.at.localeCompare(a.at))[0];r.contacted=log?log.at.slice(0,10):'';r.snoozed=(v.snooze||{})[r.key.split(':').slice(1).join(':')]||'';arr.push(r)}}
 return arr;
}

function docTotals(d){
 const items=(d.items||[]).filter(i=>i.approved!==false);
 const svc=sum(items.filter(i=>i.type==='service'),lineTotal),prt=sum(items.filter(i=>i.type==='part'),lineTotal),oth=sum(items.filter(i=>i.type==='other'),lineTotal);
 const sub=svc+prt+oth,dv=d.discount&&Number(d.discount.v)?Number(d.discount.v):0;
 const disc=dv?(d.discount.type==='percent'?Math.round(sub*Math.min(100,dv)/100):Math.min(sub,Math.round(dv))):0;
 const total=Math.max(0,sub-disc),cost=sum(items.filter(i=>i.type==='part'),i=>Math.round((Number(i.qty)||0)*(Number(i.cost)||0)));
 return {svc,prt,oth,sub,disc,total,cost,margin:total-cost,count:items.length};
}

 const todo=[];
 if(!V('q_cust'))todo.push(['Escolher o cliente','q-focus','q_cust_t']);
 if(!V('q_veh'))todo.push(['Escolher o veículo','q-focus','q_veh_t']);
 if(!items.length)todo.push(['Adicionar serviços ou peças','q-add','']);
 box.innerHTML=todo.length?`<div class="alert warn">${ICON.alert}<div><b>Falta:</b></div></div><div class="q-todo">${todo.map(t=>`<button type="button" class="btn sm" data-action="${t[1]}" data-for="${t[2]}">${t[0]} →</button>`).join('')}</div>`:`<div class="alert ok">${ICON.check}<div><b>Tudo certo.</b> Pode enviar ao cliente.</div></div>`;

 QOBS=new MutationObserver(()=>{if(!document.getElementById('q_check')){QOBS.disconnect();QOBS=null;return}clearTimeout(QOBS.t);QOBS.t=setTimeout(qCheckRender,80)});
 QOBS.observe(root,{childList:true,subtree:true,characterData:true});

function newOrderDraft(pre={}){
 return {id:uid('os'),code:'',customerId:pre.customerId||'',vehicleId:pre.vehicleId||'',openedAt:iso(),status:'Aguardando',quoteId:'',items:[],discount:{type:'value',v:0},mechId:pre.mechId||'',bayId:'',
  kmIn:0,kmOut:0,fuel:'',complaint:'',diagnosis:'',checklist:{},damages:[],photos:[],signature:'',notes:'',promisedAt:'',finishedAt:'',deliveredAt:'',warrantyUntil:'',history:[],stockOut:{},authorized:false,createdAt:iso()};
}
const orderActive=o=>!['Entregue','Cancelada'].includes(o.status);

/* ---------- estoque, comissão e status ---------- */
function stockApply(o){
 let n=0;
 for(const it of o.items){
  if(it.type!=='part'||!it.refId||it.approved===false)continue;const p=getPart(it.refId);if(!p)continue;
  const want=Number(it.qty)||0,done=Number(o.stockOut[it.id])||0,diff=want-done;
  if(diff!==0){p.qty=Math.round((p.qty-diff)*1000)/1000;state.stockMoves.push({id:uid('mv'),partId:p.id,type:diff>0?'Saída':'Entrada',qty:Math.abs(diff),date:todayISO(),orderId:o.id,note:(diff>0?'Uso na ':'Ajuste na ')+o.code,cost:p.cost||0});o.stockOut[it.id]=want;n++}
 }
 return n;
}
function stockRevert(o){
 for(const [iid,q] of Object.entries(o.stockOut||{})){const it=o.items.find(i=>i.id===iid);const p=it&&getPart(it.refId);if(p&&q){p.qty=Math.round((p.qty+q)*1000)/1000;state.stockMoves.push({id:uid('mv'),partId:p.id,type:'Entrada',qty:q,date:todayISO(),orderId:o.id,note:'Estorno '+o.code,cost:p.cost||0})}}
 o.stockOut={};
}
function commissionFor(o){
 const m=getMech(o.mechId);if(!m||!m.commissionPct)return 0;
 const t=docTotals({items:o.items.filter(i=>i.type==='service'&&(getService(i.refId)?.commissionable!==false))});
 return Math.round(t.total*m.commissionPct/100);
}
async function setOrderStatus(o,st,silent){
 const prev=o.status;if(prev===st)return;
 if(['Pronta','Entregue'].includes(st)&&!o.items.some(i=>i.approved!==false))return toast('Adicione pelo menos um item aprovado antes de concluir a OS.','err'),false;
 if(st==='Em execução'&&!o.items.length)return toast('Adicione os serviços a executar antes de iniciar.','err'),false;
 o.status=st;o.history.push({at:iso(),t:'Situação: '+prev+' → '+st});
 const when=state.shop.stockDeductOn||'run';
 if(st==='Em execução'||(st==='Pronta'&&when!=='run')||(st==='Entregue'))stockApply(o);
 if(st==='Pronta')o.finishedAt=iso();
 if(st==='Entregue'){
  o.deliveredAt=iso();if(!o.finishedAt)o.finishedAt=iso();
  const days=Math.max(0,...o.items.filter(i=>i.type==='service'&&i.approved!==false).map(i=>Number(i.warrantyDays)||0));
  if(days)o.warrantyUntil=addDays(todayISO(),days);
  const cm=commissionFor(o);state.commissions=state.commissions.filter(c=>c.orderId!==o.id);
  if(cm>0)state.commissions.push({id:uid('cm'),orderId:o.id,mechId:o.mechId,value:cm,date:todayISO(),status:'Pendente'});
  const v=getVehicle(o.vehicleId);if(v){const k=o.kmOut||o.kmIn||0;if(k>(v.km||0)){v.km=k;v.kmDate=todayISO()}}
 }
 if(st==='Cancelada'){stockRevert(o);state.commissions=state.commissions.filter(c=>c.orderId!==o.id);for(const t of state.transactions)if(t.orderId===o.id&&t.status==='Pendente')t.status='Cancelado'}
 if(prev==='Cancelada'&&st!=='Cancelada'){}
 audit('Ordens de serviço','Situação '+st,o.code);await persist();if(!silent)toast('Situação: '+st,'ok');return true;
}

 ${Chk('pe_p','Entrada já recebida',d.entry.paid,'data-ch="pay-field" data-f="entry.paid"')}</div>`:''}</div>

A['os-receive-go']=async el=>{
 const o=getOrder(el.dataset.id),p=orderPay(o);
 const pend=p.tx.filter(t=>t.status==='Pendente');let val=p.unplanned;
 if(!V('rc_d'))return bad('rc_d','Informe a data.');
 if(pend.length&&val===0){ // quita as pendentes
  const cc=cardPick();for(const t of pend){t.value=cardAdj(cc,t.value);if(cc.m==='Crédito'&&cc.n>1)t.installments=cc.n;t.status='Recebido';t.paidAt=V('rc_d');t.date=V('rc_d');t.method=V('rc_m');t.accountId=V('rc_a');postCardFee(t)}
 }else if(val>0){const cc=cardPick();const t={id:uid('tx'),type:'Receita',status:'Recebido',date:V('rc_d'),dueDate:V('rc_d'),paidAt:V('rc_d'),value:cardAdj(cc,val),installments:cc.m==='Crédito'&&cc.n>1?cc.n:0,desc:'Pagamento · '+o.code+(cc.m==='Crédito'&&cc.n>1?` (Crédito ${cc.n}x)`:''),category:'Serviço (mão de obra)',accountId:V('rc_a'),method:V('rc_m'),orderId:o.id,customerId:o.customerId,vehicleId:o.vehicleId,createdAt:iso()};state.transactions.push(t);postCardFee(t)}
 o.history.push({at:iso(),t:'Pagamento recebido'});await persist();closeModal();toast('Pagamento registrado.','ok');render();
};
function postCardFee(t){
 if(!['Débito','Crédito'].includes(t.method))return;const pct=cardFeePct(t.method,t.installments||1);if(!pct)return;
 const fee=Math.round(t.value*pct/100);if(fee<=0)return;
 state.transactions.push({id:uid('tx'),type:'Despesa',status:'Pago',date:t.paidAt||todayISO(),dueDate:t.paidAt||todayISO(),paidAt:t.paidAt||todayISO(),value:fee,desc:'Taxa de cartão · '+(t.desc||''),category:'Taxa de cartão',accountId:t.accountId,method:t.method,feeOf:t.id,createdAt:iso()});
}

function readyWA(o,small){
 if(o.status!=='Pronta')return '';
 const sent=(o.history||[]).some(h=>String(h.t).includes('os_pronto'));
 return `<button type="button" class="btn wa sm ready-wa" data-action="os-wa" data-id="${o.id}" data-key="os_pronto" title="Avisar o cliente que o veículo está pronto">${ICON.wa}${sent?'Avisar de novo':'Avisar cliente'}</button>${sent?'<div class="tiny ok-txt">✓ cliente avisado</div>':''}`;
}
function nextStepHTML(o){
 const pay=orderPay(o);let n,t,d,acts='';
 const st=(s,l,c='primary')=>`<button class="btn ${c}" data-action="os-status" data-id="${o.id}" data-st="${s}">${l}</button>`;
 switch(o.status){
  case 'Aguardando':n='Passo 1';t='Comece o diagnóstico';d='Registre a vistoria (aba “Vistoria e fotos”), anote o relato do cliente e avance.';acts=st('Diagnóstico','Iniciar diagnóstico');break;
  case 'Diagnóstico':n='Passo 2';t='Monte os serviços e peças e peça a aprovação';d='Clique em “Adicionar”, coloque o que será feito e envie o valor ao cliente pelo botão verde “Mensagem ao cliente”.';acts=st('Aguardando aprovação','Pedir aprovação do cliente');break;
  case 'Aguardando aprovação':n='Passo 3';t='Espere o cliente aprovar';d='Quando ele responder que aprova, avance para executar. Se faltar peça, marque “Aguardando peça”.';acts=st('Em execução','Cliente aprovou: executar')+st('Aguardando peça','Falta peça','');break;
  case 'Aguardando peça':n='Passo 3';t='Esperando a peça chegar';d='Quando a peça chegar, volte para execução.';acts=st('Em execução','Peça chegou: executar');break;
  case 'Em execução':n='Passo 4';t='Faça o serviço e conclua';d='Ao terminar, marque como pronta. As peças usadas saem do estoque automaticamente.';acts=st('Pronta','Serviço pronto');break;
  case 'Pronta':n='Passo 5 e 6';t=pay.balance>0?'Avise o cliente e receba o pagamento':'Avise o cliente e entregue';d=pay.balance>0?'Falta receber '+money(pay.balance)+'. Use a aba “Pagamento” para lançar entrada/parcelas e receber.':'Tudo pago. Entregue o veículo para encerrar a OS.';acts=`<button class="btn wa" data-action="os-wa" data-id="${o.id}" data-key="os_pronto">${ICON.wa}Avisar cliente</button>`+(pay.balance>0?`<button class="btn gold" data-action="os-open-pay" data-id="${o.id}">Receber o pagamento</button>`:'')+st('Entregue','Entregar o veículo','deliver');break;
  case 'Entregue':n='Concluída';t=pay.balance>0?'Entregue, mas ainda há saldo a receber':'OS encerrada';d=pay.balance>0?'Falta receber '+money(pay.balance)+'.':'Garantia, histórico do veículo e comissão já foram registrados.';acts=pay.balance>0?`<button class="btn gold" data-action="os-open-pay" data-id="${o.id}">Receber o pagamento</button>`:'';break;
  default:return '';
 }
 return `<div class="next-step"><span class="ns-n">${n}</span><div class="ns-t"><b>${t}</b><span>${d}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${acts}</div></div>`;

 let action='';

}

function txRows(filter){
 const q=UI.q.finance||'';
 return state.transactions.filter(t=>t.type!=='Transf'&&t.status!=='Cancelado'&&filter(t)&&matchQ(q,t.desc,custName(t.customerId),getSupplier(t.supplierId)?.name,t.category));
}
function txTable(rows,opt={}){
 rows.sort((a,b)=>(a.dueDate||a.date).localeCompare(b.dueDate||b.date)*(opt.desc?-1:1));const pg=paginate('fin-'+(opt.key||'x'),rows,40);
 if(!rows.length)return empty('wallet','Nada por aqui','');
 return table([{h:'Vencimento',f:t=>brDate(t.dueDate||t.date)},{h:'Descrição',f:t=>`<b>${esc(t.desc)}</b><div class="tiny muted">${esc(t.category||'')}${t.customerId?' · '+esc(custName(t.customerId)):''}${t.supplierId?' · '+esc(getSupplier(t.supplierId)?.name||''):''}</div>`},{h:'Conta',f:t=>esc(getAccount(t.accountId)?.name||'')},{h:'Valor',cls:'num',f:t=>`<b style="color:${t.type==='Receita'?'var(--green)':'var(--red)'}">${t.type==='Receita'?'':'− '}${money(t.value)}</b>`},{h:'Situação',f:t=>txChip(t)},{h:'',cls:'num',f:t=>`${t.status==='Pendente'?`<button class="btn xs gold" data-action="tx-receive" data-id="${t.id}">${t.type==='Receita'?'Receber':'Pagar'}</button> ${t.type==='Receita'&&t.customerId?`<button class="btn xs wa" data-action="tx-wa" data-id="${t.id}">${ICON.wa}</button> `:''}`:''}${t.type==='Receita'&&isDone(t)?`<button class="btn xs" data-action="tx-receipt" data-id="${t.id}" title="Recibo">${ICON.print}</button> `:''}${isDone(t)?`<button class="btn xs" data-action="tx-reopen" data-id="${t.id}" title="Desfazer o recebimento">Reabrir</button> `:''}<button class="btn xs" data-action="edit-tx" data-id="${t.id}">${ICON.edit}</button>`}],pg.rows)+pg.html;
}
function monthSeries(n=6){
 const out=[];let m=monthKey(todayISO());
 for(let i=n-1;i>=0;i--){const k=monthKey(addMonths(m+'-01',-i));const tx=state.transactions.filter(t=>t.type!=='Transf'&&isDone(t)&&monthKey(t.date)===k);out.push({k,label:monthLabel(k).slice(0,3),rec:sum(tx.filter(t=>t.type==='Receita'),t=>t.value),des:sum(tx.filter(t=>t.type==='Despesa'),t=>t.value)})}
 return out;
}
function dreHTML(k){
 const tx=state.transactions.filter(t=>t.type!=='Transf'&&isDone(t)&&monthKey(t.date)===k);
 const rec=tx.filter(t=>t.type==='Receita'),des=tx.filter(t=>t.type==='Despesa');
 const byCat=(arr)=>Object.entries(arr.reduce((m,t)=>{m[t.category||'Sem categoria']=(m[t.category||'Sem categoria']||0)+t.value;return m},{})).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
 const R=sum(rec,t=>t.value),D=sum(des,t=>t.value);
 const orders=state.orders.filter(o=>o.status==='Entregue'&&monthKey(String(o.deliveredAt).slice(0,10))===k);
 const cost=sum(orders,o=>docTotals(o).cost);
 return `<div class="grid g3" style="margin-bottom:14px">${kpi('Entradas',money(R),monthLabel(k),{k:'k-green',icon:'wallet'})}${kpi('Saídas',money(D),'',{k:'k-red',icon:'wallet'})}${kpi('Resultado',money(R-D),R?num((R-D)/R*100,0)+'% de margem':'',{k:R-D>=0?'k-green':'k-red',icon:'chart'})}</div>
 <div class="grid g2"><div class="card"><h2>Receitas por categoria</h2>${hbars(byCat(rec),{color:'#2e9d5b'})||'<div class="muted small">Sem dados</div>'}</div><div class="card"><h2>Despesas por categoria</h2>${hbars(byCat(des),{color:'#d9534f'})||'<div class="muted small">Sem dados</div>'}</div></div>
 <div class="card"><h2>Ordens entregues no mês</h2><p class="muted small">${orders.length} OS · faturamento ${money(sum(orders,o=>docTotals(o).total))} · custo de peças ${money(cost)} · lucro bruto ${money(sum(orders,o=>docTotals(o).total)-cost)}</p></div>`;
}
H['dre-month']=el=>{UI.f.dre=el.value;render()};
function renderFinance(){
 const f=tabOf('finance','sum'),today=todayISO();
 const pend=state.transactions.filter(t=>t.status==='Pendente'&&t.type!=='Transf');
 const rec=pend.filter(t=>t.type==='Receita'),pay=pend.filter(t=>t.type==='Despesa');
 const late=sum(rec.filter(t=>(t.dueDate||t.date)<today),t=>t.value),cash=sum(state.accounts.filter(a=>a.active!==false),accBalance);
 const tabs=[{k:'sum',l:'Resumo'},{k:'rec',l:'A receber',n:rec.length},{k:'pay',l:'A pagar',n:pay.length},{k:'all',l:'Lançamentos'},{k:'acc',l:'Contas'},{k:'dre',l:'Resultado do mês'}];
 let body='';
 if(f==='sum'){
  const ms=monthSeries(6);
  body=`<div class="grid g4" style="margin-bottom:14px">${kpi('Saldo em caixa',money(cash),'todas as contas',{k:'k-green',icon:'wallet'})}${kpi('A receber',money(sum(rec,t=>t.value)),late?money(late)+' em atraso':'em dia',{k:late?'k-red':'k-blue',icon:'clock'})}${kpi('A pagar',money(sum(pay,t=>t.value)),pay.filter(t=>(t.dueDate||t.date)<today).length+' vencida(s)',{k:'k-warn',icon:'alert'})}${kpi('Este mês',money(ms[ms.length-1].rec-ms[ms.length-1].des),'entradas − saídas',{icon:'chart'})}</div>
  <div class="card"><h2>Últimos 6 meses</h2>${barChart(ms.map(m=>m.label),[{name:'Entradas',color:'#2e9d5b',values:ms.map(m=>m.rec)},{name:'Saídas',color:'#e0645f',values:ms.map(m=>m.des)}],{label:'Entradas e saídas por mês'})}</div>
  <div class="card"><h2>Próximos vencimentos</h2>${txTable([...pend].sort((a,b)=>(a.dueDate||a.date).localeCompare(b.dueDate||b.date)).slice(0,8),{key:'next'})}</div>`;
 }else if(f==='rec')body=`<p>${reportBtn('receivable','Relatório: contas a receber')}</p>`+searchBar('finance','Buscar cobrança ou cliente')+`<div class="card">${txTable(txRows(t=>t.type==='Receita'&&t.status==='Pendente'),{key:'rec'})}</div>`;
 else if(f==='pay')body=`<p>${reportBtn('payable','Relatório: contas a pagar')}</p>`+searchBar('finance','Buscar despesa')+`<div class="card">${txTable(txRows(t=>t.type==='Despesa'&&t.status==='Pendente'),{key:'pay'})}</div>`;
 else if(f==='all')body=searchBar('finance','Buscar lançamento')+`<div class="card">${txTable(txRows(()=>true),{key:'all',desc:true})}</div>`;
 else if(f==='acc')body=`<div class="grid g3">${state.accounts.map(a=>`<div class="card"><div class="card-head"><h3>${esc(a.name)}</h3><button class="btn xs" data-action="edit-acc" data-id="${a.id}">${ICON.edit}</button></div><div class="muted small">${esc(a.type)}${a.active===false?' · inativa':''}</div><div style="font-size:24px;font-weight:800;margin-top:6px">${money(accBalance(a))}</div></div>`).join('')}</div><div class="mt12">${btn('Nova conta','new-acc',{icon:'plus'})}${btn('Transferir entre contas','transfer',{icon:'refresh'})}</div>`;
 else{const k=UI.f.dre||monthKey(today);const opts=[...Array(12)].map((_,i)=>{const mk=monthKey(addMonths(monthKey(today)+'-01',-i));return {v:mk,l:monthLabel(mk)}});body=`<div class="toolbar"><label style="max-width:240px">Mês<select data-ch="dre-month">${optHTML(opts,k)}</select></label></div>`+dreHTML(k)}
 return head('Financeiro','Contas a receber e a pagar, caixa e resultado da oficina.',reportBtn('result','Relatórios')+btn('Exportar','export-tx',{icon:'download'})+btn('Novo lançamento','new-tx',{cls:'accent',icon:'plus'}))+tabsHTML('finance',tabs,f)+body;
}

/* ---------- cartão: parcelas 1–12x, com/sem juros e atalho para as taxas da maquininha ---------- */
let RCBASE=()=>0;
const grossOf=(base,p)=>p>0&&p<100?Math.round(base/(1-p/100)):base;
function cardPick(){const m=V('rc_m');if(m!=='Crédito')return {m,n:1,j:'no'};return {m,n:Number(V('rc_n'))||1,j:V('rc_j')||'no'}}
function cardAdj(cc,x){return cc.m==='Crédito'&&cc.j==='yes'?grossOf(x,cardFeePct('Crédito',cc.n)):x}
const feesGoBtn=()=>isStaff()?'':`<button type="button" class="btn xs ${state.settings.cardFeesOk?'':'gold'}" data-action="go-fees">${state.settings.cardFeesOk?'Conferir taxas da maquininha':'Preencher taxas da maquininha'}</button>`;
function cardHintHTML(m){
 if(m!=='Crédito'&&m!=='Débito')return '';
 return `<div class="alert ${state.settings.cardFeesOk?'info':'warn'}">${ICON.alert}<div>${state.settings.cardFeesOk?'A taxa da maquininha é lançada automaticamente como despesa ao receber.':'<b>As taxas da maquininha ainda são valores de exemplo.</b> Preencha as da sua maquininha para o cálculo ficar certo.'}</div>${feesGoBtn()}</div>`;
}
function rcCardRefresh(){
 const box=$('#rc_card');if(!box)return;const cur=cardPick(),m=cur.m,base=RCBASE();
 if(!base||(m!=='Crédito'&&m!=='Débito')){box.innerHTML='';return}
 const p=cardFeePct(m,cur.n),gross=cur.j==='yes'?grossOf(base,p):base,fee=Math.round(gross*p/100);
 const sel=m==='Crédito'?`<div class="form-grid mt12"><label>Parcelas no cartão<select id="rc_n" data-ch="rc-card">${optHTML(Array.from({length:12},(_,i)=>({v:String(i+1),l:(i+1)+'x'+(i?'':' (à vista no crédito)')+' — taxa '+num(cardFeePct('Crédito',i+1),2)+'%'})),String(cur.n))}</select></label>
 <label>Juros<select id="rc_j" data-ch="rc-card">${optHTML([{v:'no',l:'Sem juros (a oficina paga a taxa)'},{v:'yes',l:'Com juros (cliente paga a taxa)'}],cur.j)}</select></label></div>`:'';
 const info=m==='Crédito'
  ?(cur.j==='yes'?`Cliente paga <b>${money(gross)}</b>${cur.n>1?` em ${cur.n}x de <b>${money(Math.round(gross/cur.n))}</b>`:''}. Taxa da maquininha ${num(p,2)}% (≈ ${money(fee)}) repassada ao cliente: a oficina recebe líquido <b>${money(base)}</b>.`
   :`Cliente paga <b>${money(base)}</b>${cur.n>1?` em ${cur.n}x de <b>${money(Math.round(base/cur.n))}</b>`:''}. Taxa da maquininha ${num(p,2)}% (≈ ${money(fee)}) sai da oficina: líquido <b>${money(base-fee)}</b>.`)
  :`Taxa do débito ${num(p,2)}% (≈ ${money(fee)}): líquido <b>${money(base-fee)}</b>.`;
 box.innerHTML=`${cardHintHTML(m).includes('warn')?cardHintHTML(m):''}${sel}<div class="muted small mt12">${info} ${state.settings.cardFeesOk?feesGoBtn():''}</div>`;
}
H['rc-card']=()=>rcCardRefresh();

/* ============================================================
   CENTRAL DE COMUNICAÇÃO: revisões, orçamentos, cobranças,
   aniversários e modelos de mensagem
   ============================================================ */
function remList(){return allReminders().filter(r=>r.status!=='ok'&&!(r.snoozed&&r.snoozed>todayISO())).sort((a,b)=>(a.status==='late'?0:1)-(b.status==='late'?0:1))}
function commQueues(){
 const today=todayISO(),fd=state.settings.quoteFollowDays||3;
 return {
  rem:remList(),
  quotes:state.quotes.filter(q=>q.status==='Enviado'&&q.sentAt&&diffDays(q.sentAt.slice(0,10),today)>=fd),
  charge:state.transactions.filter(t=>t.type==='Receita'&&t.status==='Pendente'&&(t.dueDate||t.date)<today&&t.customerId),
  soon:state.transactions.filter(t=>t.type==='Receita'&&t.status==='Pendente'&&t.customerId&&diffDays(today,(t.dueDate||t.date))>=0&&diffDays(today,(t.dueDate||t.date))<=3),
  bday:state.customers.filter(c=>c.status!=='Inativo'&&c.birth&&c.birth.slice(5)===today.slice(5)),
  after:state.orders.filter(o=>o.status==='Entregue'&&o.deliveredAt&&diffDays(String(o.deliveredAt).slice(0,10),today)>=2&&diffDays(String(o.deliveredAt).slice(0,10),today)<=10&&!state.contactLog.some(x=>x.refKey==='after:'+o.id))
 };
}
function commRow(left,sub,right){return `<div class="row"><div class="grow"><b>${left}</b><div class="small muted">${sub}</div></div><div>${right}</div></div>`}
A['rem-wa']=el=>{

 const text=applyTemplate('revisao',{cliente:c,veiculo:getVehicle(r.vehicleId),servico:r.service,motivo:r.reason});

function renderComm(){
 const f=tabOf('comm','rem'),Q=commQueues();
 const tabs=[{k:'rem',l:'Revisões',n:Q.rem.length},{k:'quotes',l:'Orçamentos sem resposta',n:Q.quotes.length},{k:'charge',l:'Cobranças',n:Q.charge.length+Q.soon.length},{k:'after',l:'Pós-venda',n:Q.after.length},{k:'bday',l:'Aniversários',n:Q.bday.length},{k:'tpl',l:'Modelos de mensagem'}];

 else if(f==='quotes')body=Q.quotes.length?`<div class="card">${Q.quotes.map(q=>commRow(esc(q.code)+' · '+esc(custName(q.customerId)),`${money(docTotals(q).total)} · enviado em ${brDate(q.sentAt.slice(0,10))}`,`<button class="btn wa xs" data-action="q-follow" data-id="${q.id}">${ICON.wa}Cobrar resposta</button> <button class="btn xs" data-route="quotes" data-sub="view" data-id="${q.id}">Abrir</button>`)).join('')}</div>`:`<div class="card">${E('Nenhum orçamento esperando retorno','Orçamentos enviados há mais de '+(state.settings.quoteFollowDays||3)+' dias sem resposta aparecem aqui.')}</div>`;
 else if(f==='charge'){const all=[...Q.charge,...Q.soon];body=all.length?`<div class="card">${all.map(t=>commRow(esc(custName(t.customerId))+' · '+money(t.value),`${esc(t.desc)} — vence ${brDate(t.dueDate||t.date)} ${txChip(t)}`,`<button class="btn wa xs" data-action="tx-wa" data-id="${t.id}">${ICON.wa}Cobrar</button> <button class="btn xs accent" data-action="tx-receive" data-id="${t.id}">Receber</button>`)).join('')}</div>`:`<div class="card">${E('Sem cobranças pendentes','Contas vencidas e a vencer em 3 dias aparecem aqui.')}</div>`}
 else if(f==='after')body=Q.after.length?`<div class="card">${Q.after.map(o=>commRow(esc(o.code)+' · '+esc(custName(o.customerId)),'Entregue em '+brDate(String(o.deliveredAt).slice(0,10)),`<button class="btn wa xs" data-action="after-wa" data-id="${o.id}">${ICON.wa}Perguntar satisfação</button>`)).join('')}</div>`:`<div class="card">${E('Nada por aqui','Depois da entrega, lembre-se de perguntar se o cliente ficou satisfeito.')}</div>`;
 else if(f==='bday')body=Q.bday.length?`<div class="card">${Q.bday.map(c=>commRow(esc(c.name),'Aniversário hoje',`<button class="btn wa xs" data-action="bday-wa" data-id="${c.id}">${ICON.wa}Parabenizar</button>`)).join('')}</div>`:`<div class="card">${E('Nenhum aniversariante hoje','')}</div>`;
 else body=`<div class="card">${table([{h:'Modelo',f:t=>`<b>${esc(t.title)}</b>`},{h:'Texto',f:t=>`<span class="small muted">${esc(t.text.slice(0,110))}…</span>`},{h:'',cls:'num',f:t=>`<button class="btn xs" data-action="edit-tpl" data-id="${t.id}">${ICON.edit}Editar</button>`}],state.templates)}</div>`;
 return head('Comunicação','Fila de mensagens do dia: lembretes de revisão, orçamentos parados, cobranças e pós-venda. Tudo pelo WhatsApp, com texto pronto.')+tabsHTML('comm',tabs,f)+body;
}

/* ============================================================
   RELATÓRIOS: cada um abre em tela, com PDF/imprimir, WhatsApp e planilha
   ============================================================ */
const REP={key:'',preset:'month',from:'',to:''};
function repRange(preset){
 const t=todayISO(),k=monthKey(t);
 if(preset==='month')return [k+'-01',addDays(addMonths(k+'-01',1),-1)];
 if(preset==='last')return [addMonths(k+'-01',-1),addDays(k+'-01',-1)];
 if(preset==='30')return [addDays(t,-29),t];
 if(preset==='90')return [addDays(t,-89),t];
 if(preset==='year')return [t.slice(0,4)+'-01-01',t.slice(0,4)+'-12-31'];
 return ['2000-01-01','2099-12-31'];
}
const inR=(d,r)=>{d=String(d||'').slice(0,10);return d&&d>=r[0]&&d<=r[1]};

async function hashPw(pw,salt){
 try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 catch{return sha256(salt+pw)}
}
const newRecoveryCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));return [...r].map(x=>a[x%a.length]).join('').replace(/(.{4})(?=.)/g,'$1-')};

async function deriveKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
A['bk-enc-go']=async()=>{
 const p=V('bk_p1');if(p.length<10)return bad('bk_p1','A senha precisa ter pelo menos 10 caracteres.');if(p!==V('bk_p2'))return bad('bk_p2','As senhas não conferem.');
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(p,salt);
 const plain=new TextEncoder().encode(JSON.stringify({checksum:checksum(state),data:state}));const enc=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
 download(`backup_meu_mecanico_${todayISO()}.mecanico`,new Blob([JSON.stringify({app:APP.name,enc:true,salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(enc)})],{type:'application/json'}));
 state.settings.lastBackup=iso();await persist({snapshot:false});closeModal();toast('Backup criptografado baixado.','ok');render();
};

 reviewRestore(j.data||j)};i.click()};
A['bk-dec-go']=async()=>{const j=window.__bkj;try{const key=await deriveKey(V('bk_pw'),b64ToBytes(j.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(j.iv)},key,b64ToBytes(j.data));const o=JSON.parse(new TextDecoder().decode(plain));closeModal();reviewRestore(o.data)}catch{bad('bk_pw','Senha incorreta ou arquivo danificado.')}};

function activateDemo(){
 if(window.__DEMO)return;
 window.__REAL=state;window.__DEMO=true;
 try{state=buildDemoState(window.__REAL)}catch(e){console.error(e);state=window.__REAL;window.__REAL=null;window.__DEMO=false;toast('Não foi possível abrir a demonstração. Avise o suporte.','err');return}
 closeAllModals&&closeAllModals();buildNav();go('home');toast('Modo Demonstração ativado — seus dados reais estão preservados.','ok');
}
function deactivateDemo(){
 if(!window.__DEMO)return;
 state=window.__REAL;window.__REAL=null;window.__DEMO=false;closeAllModals&&closeAllModals();buildNav();go('home');toast('Você saiu da demonstração. Seus dados reais voltaram.','ok');
}

/* ============================================================
   PLANO PRO · ativação por código assinado (funciona offline)
   O código é assinado com uma chave privada que fica só com o dono do
   sistema (gerador-de-codigos.html). Aqui só existe a chave PÚBLICA.
   ============================================================ */
const planPriceOn=()=>/\d/.test(PLAN_CFG.price);
const PLAN_CFG={
 k:'pSvgZExFgfB69qUIBC4ulxqjMrgaYZyw7yxvC/LG78o=',
 whats:'',                       // WhatsApp de vendas (somente números, com 55). Ex.: '5511999998888'
 trialDays:15,                   // dias de teste PRO na primeira vez que o sistema é usado
 freeCustomers:30, freeOrders:30,// limites do plano Grátis
 freeReports:['quotes','orders'],// relatórios liberados no Grátis
 price:'EM BREVE', // quando definir o preço, troque por 'R$ 150,00'
};
const PLAN_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const PLAN_BASE=Date.UTC(2026,0,1)/864e5; // dia 0 dos códigos = 01/01/2026
let _planKey=null,_planFails=0,_planLock=0;
// Código no formato 57815-ABKJU (5 números + 5 letras): 14 bits de validade + 3 de série + 23 de assinatura (HMAC).
const PLAN_L=26n**5n,PLAN_M=(1n<<40n)-1n,PLAN_A=0x9E3779B97Fn,PLAN_B=0x5A3C96E1B7n;
const PLAN_AI=(()=>{let x=PLAN_A;for(let i=0;i<6;i++)x=(x*(2n-PLAN_A*x))&PLAN_M;return x})(); // embaralha os números para o código parecer aleatório
async function planMac(d){
 if(!_planKey)_planKey=await crypto.subtle.importKey('raw',Uint8Array.from(atob(PLAN_CFG.k),c=>c.charCodeAt(0)),{name:'HMAC',hash:'SHA-256'},false,['sign']);
 const m=new Uint8Array(await crypto.subtle.sign('HMAC',_planKey,new Uint8Array([d>>16&1,d>>8&255,d&255])));
 return ((m[0]<<15)|(m[1]<<7)|(m[2]>>1))&0x7fffff;
}
async function planVerify(code){
 if(Date.now()<_planLock)throw new Error('Muitas tentativas. Aguarde '+Math.ceil((_planLock-Date.now())/1000)+' segundos.');
 const raw=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(raw.length!==10)throw new Error('O código tem 5 números e 5 letras, como 57815-ABKJU. Confira se digitou tudo.');
 if(!/^\d{5}[A-Z]{5}$/.test(raw))throw new Error('Formato inválido. O código é 5 números, traço e 5 letras, como 57815-ABKJU.');
 let lt=0n;for(const ch of raw.slice(5))lt=lt*26n+BigInt(ch.charCodeAt(0)-65);
 const w=BigInt(raw.slice(0,5))*PLAN_L+lt;
 if(w>>40n)throw new Error('Código inválido. Confira com quem te enviou.');
 const v=((w-PLAN_B)*PLAN_AI)&PLAN_M;
 if(!crypto||!crypto.subtle)throw new Error('Este navegador não consegue validar o código. Abra o sistema pelo endereço seguro (https).');
 const d=Number(v>>23n),mac=Number(v&0x7fffffn);
 if(v>>40n||mac!==await planMac(d)){if(++_planFails>=5){_planLock=Date.now()+60000;_planFails=0}throw new Error('Código inválido. Confira com quem te enviou.')}
 _planFails=0;const days=d>>3;
 const e=days===0?'0':new Date((PLAN_BASE+days)*864e5).toISOString().slice(0,10);
 return{p:'pro',e,n:'',i:String(d&7)};
}
function planState(){const st=state.settings;if(!st.plan)st.plan={};if(!st.plan.trialStart){st.plan.trialStart=todayISO();if(!window.__DEMO)setTimeout(()=>persist().catch(()=>{}),0)}return st.plan}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function planInfo(){
 if(window.__DEMO)return{pro:true,kind:'demo',label:'Demonstração'};

  var expired=e;
 }

}
