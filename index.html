<script>
'use strict';
/* ============================================================
   MEU MECÂNICO — núcleo: utilitários, ícones, banco local, estado
   (arquitetura herdada do MEU TERREIRO: 100% offline, IndexedDB,
    pontos de restauração, trilha de auditoria, backup criptografado)
   ============================================================ */
const APP={name:'MEU MECÂNICO',version:'1.0.0.0',schema:1,db:'meumecanico_db',sub:'Gestão completa de oficina'};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const iso=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>localISO();
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money=v=>(Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(v,d=0)=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});

const monthKey=d=>String(d||todayISO()).slice(0,7);
const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const parseISO=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parseISO(s||todayISO());d.setDate(d.getDate()+n);return localISO(d)};
const addMonths=(s,n)=>{const d=parseISO(s||todayISO()),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return localISO(d)};

const sum=(a,f=x=>x)=>a.reduce((n,x)=>n+(Number(f(x))||0),0);
const byId=(arr,id)=>(arr||[]).find(x=>x.id===id);
const cents=v=>{if(v===null||v===undefined||v==='')return 0;let s=String(v).trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}const n=Number(s);return isFinite(n)?Math.round(n*100):0};
const moneyIn=c=>(Number(c||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?Math.round(a/b*100):0;
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?';

/* ---------- banco local (IndexedDB) ---------- */
let db=null,state=null,loadedRev=0,memoryMode=false,persistQ=Promise.resolve();
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB indisponível'));const r=indexedDB.open(APP.db,1);r.onupgradeneeded=()=>{const d=r.result;for(const s of ['kv','snapshots','blobs','handles'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('Banco bloqueado por outra janela'))})}
const idbReq=(store,mode,fn)=>new Promise((res,rej)=>{const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Transação cancelada'))});
const idbGet=(s,k)=>idbReq(s,'readonly',o=>o.get(k)), idbSet=(s,k,v)=>idbReq(s,'readwrite',o=>o.put(v,k)), idbDel=(s,k)=>idbReq(s,'readwrite',o=>o.delete(k));
const idbAll=s=>idbReq(s,'readonly',o=>o.getAll()), idbKeys=s=>idbReq(s,'readonly',o=>o.getAllKeys());
const putBlob=(id,data)=>db?idbSet('blobs',id,data):Promise.resolve();
const getBlob=id=>db?idbGet('blobs',id):Promise.resolve(null);
const delBlob=id=>db?idbDel('blobs',id):Promise.resolve();

const AUDIT_MAX=600;
function audit(module,action,record=''){if(!state)return;state.audit.unshift({id:uid('aud'),at:iso(),module,action,record});if(state.audit.length>AUDIT_MAX)state.audit.length=AUDIT_MAX}

async function loadState(){
 try{db=await openDB()}catch(e){console.error(e);db=null;memoryMode=true}
 let s=null;
 if(db){try{s=await idbGet('kv','state');const meta=await idbGet('kv','meta');loadedRev=(meta&&meta.rev)||(s&&s.rev)||0}catch(e){console.error(e)}}
 state=migrate(s||seedState());
 if(!s&&db){await idbSet('kv','state',state);await idbSet('kv','meta',{rev:0,at:iso()})}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
}
function persist(opts={}){
 persistQ=persistQ.then(async()=>{
  if(window.__LOCKDOWN)throw new Error('Operação bloqueada.');
  state.updatedAt=iso();
  if(!db){if(memoryMode)return;throw new Error('Banco local indisponível.')}
  const meta=await idbGet('kv','meta');
  if(meta&&meta.rev!==loadedRev){showConflict();throw new Error('Os dados foram alterados em outra janela. Recarregue a página.')}
  state.rev=loadedRev+1;
  await idbSet('kv','state',state);await idbSet('kv','meta',{rev:state.rev,at:state.updatedAt});
  loadedRev=state.rev;state.settings.backupChangeCount=(state.settings.backupChangeCount||0)+1;
  if(opts.snapshot!==false)maybeSnapshot().catch(console.error);
  if(typeof autoFolderTick==='function')autoFolderTick().catch(()=>{});
 }).catch(e=>{persistQ=Promise.resolve();throw e});
 return persistQ;
}
function showConflict(){if($('#conflictBar'))return;document.body.insertAdjacentHTML('afterbegin','<div id="conflictBar" style="position:fixed;z-index:900;top:0;left:0;right:0;background:#a8362b;color:#fff;padding:12px 16px;font-weight:700;text-align:center">⚠ Seus dados foram alterados em outra janela do app. Feche as outras janelas e <button class="btn sm" onclick="location.reload()" style="margin-left:8px">Recarregar agora</button></div>')}

/* pontos de restauração automáticos: 7 diários, 4 semanais, 6 mensais, 5 de segurança */
function weekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+pad(Math.ceil(((t-y0)/864e5+1)/7))}
async function maybeSnapshot(force=''){
 if(!db)return;const now=new Date(),per={daily:todayISO(),weekly:weekKey(now),monthly:todayISO().slice(0,7)};
 const keep={daily:7,weekly:4,monthly:6,safety:5,manual:5};
 const all=await idbAll('snapshots');const types=force?[force]:Object.keys(per).filter(t=>!all.some(s=>s.type===t&&s.period===per[t]));
 for(const t of types){const id=t+'_'+(per[t]||Date.now());const snap={id:t==='safety'||t==='manual'?t+'_'+Date.now():id,type:t,period:per[t]||'',at:iso(),label:force&&state.__snapLabel||'',checksum:checksum(state),data:clone(state)};await idbSet('snapshots',snap.id,snap)}
 const left=(await idbAll('snapshots')).sort((a,b)=>b.at.localeCompare(a.at));
 for(const t of Object.keys(keep)){for(const s of left.filter(x=>x.type===t).slice(keep[t]))await idbDel('snapshots',s.id)}
}
async function safetySnapshot(label){state.__snapLabel=label;try{await maybeSnapshot('safety')}finally{delete state.__snapLabel}}

function showModal(title,body,foot='',size=''){
 const root=$('#modalRoot'),id='m'+(++mseq);

 return id;
}

 $$('.err,.err-field').forEach(x=>x.classList.remove('err','err-field'));
 if(el){el.classList.add('err');el.closest('label')?.classList.add('err-field')}

function applyMask(el){
 const m=el.dataset.mask;if(!m)return;let v=el.value;
 if(m==='phone'){const d=digits(v).slice(0,11);v=d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
 else if(m==='doc'){const d=digits(v).slice(0,14);v=d.length>11?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/,'$1.$2.$3/$4-$5'):d.length>9?d.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/,'$1.$2.$3-$4'):d.length>6?d.replace(/(\d{3})(\d{3})(\d{0,3})/,'$1.$2.$3'):d.length>3?d.replace(/(\d{3})(\d{0,3})/,'$1.$2'):d}

/* ---------- gráficos SVG ---------- */
function barChart(labels,series,o={}){
 const W=640,H=o.h||210,pl=46,pb=26,pt=10,pr=8,iw=W-pl-pr,ih=H-pt-pb;const all=series.flatMap(s=>s.values);const max=Math.max(1,...all)*1.12;
 const n=labels.length,gw=iw/n,bw=Math.min(34,(gw-10)/series.length);let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico')}">`;
 for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4,v=max*i/4;out+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e6e9ee"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${o.money===false?num(v):(v>=100000?'R$ '+num(v/100000,0)+'k':'R$ '+num(v/100,0))}</text>`}
 labels.forEach((l,i)=>{const cx=pl+gw*i+gw/2;series.forEach((s,j)=>{const v=s.values[i]||0,h=ih*v/max,x=cx-bw*series.length/2+bw*j;out+=`<rect x="${x}" y="${pt+ih-h}" width="${bw-2}" height="${Math.max(h,0)}" rx="4" fill="${s.color}"><title>${esc(s.name)}: ${o.money===false?v:money(v)}</title></rect>`});out+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
 return out+`</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function donutChart(parts,o={}){
 const total=sum(parts,p=>p.value)||1;let a0=-Math.PI/2,out=`<svg viewBox="0 0 120 120" width="${o.size||130}" height="${o.size||130}" role="img" aria-label="${esc(o.label||'Distribuição')}">`;
 if(!sum(parts,p=>p.value))out+='<circle cx="60" cy="60" r="44" fill="none" stroke="#e8ebf0" stroke-width="18"/>';
 else parts.filter(p=>p.value>0).forEach(p=>{const a1=a0+Math.PI*2*p.value/total,large=a1-a0>Math.PI?1:0,x0=60+44*Math.cos(a0),y0=60+44*Math.sin(a0),x1=60+44*Math.cos(a1-.0001),y1=60+44*Math.sin(a1-.0001);out+=parts.filter(q=>q.value>0).length===1?`<circle cx="60" cy="60" r="44" fill="none" stroke="${p.color}" stroke-width="18"/>`:`<path d="M${x0} ${y0} A44 44 0 ${large} 1 ${x1} ${y1}" fill="none" stroke="${p.color}" stroke-width="18"><title>${esc(p.label)}: ${o.money?money(p.value):p.value}</title></path>`;a0=a1});
 return out+`<text x="60" y="64" text-anchor="middle" style="font:800 15px Inter,system-ui;fill:#1a1f27">${o.center??''}</text></svg>`;
}
function hbars(rows,o={}){const max=Math.max(1,...rows.map(r=>r.value));return rows.length?rows.map(r=>`<div class="bar-row"><span title="${esc(r.label)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span><div class="bar"><i style="width:${Math.max(2,r.value/max*100)}%;${r.color?`background:${r.color}`:''}"></i></div><b class="right">${o.fmt?o.fmt(r.value):money(r.value)}</b></div>`).join(''):'<div class="muted small">Sem dados no período.</div>'}

async function compressImage(file,max=1280,q=.74){
 const url=await fileToDataURL(file);if(!/^data:image\//.test(url))throw new Error('Arquivo não é uma imagem.');
 return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>rej(new Error('Imagem inválida.'));im.src=url});

function migrate(s){
 if(!s||typeof s!=='object'||Array.isArray(s))return seedState();
 const base=seedState();
 s.shop={...base.shop,...(s.shop||{})};
 s.settings={...base.settings,...(s.settings||{})};s.settings.cardFees={...base.settings.cardFees,...(s.settings.cardFees||{})};s.settings.autoFolder={...base.settings.autoFolder,...(s.settings.autoFolder||{})};
 s.lists={...clone(DEFAULT_LISTS),...(s.lists||{})};
 for(const k of COLLECTIONS)if(!Array.isArray(s[k]))s[k]=k==='templates'?defaultTemplates():[];
 for(const t of defaultTemplates())if(!s.templates.some(x=>x.key===t.key))s.templates.push(t);
 if(!s.shopId)s.shopId=uuid();
 s.schemaVersion=APP.schema;s.appVersion=APP.version;s.rev=s.rev||0;
 return s;
}

const COMBO={};
function combo(id,label,src,value,o={}){
 const item=value&&COMBO[src]?.get?.(value);
 return `<label class="${o.full?'full':''}">${esc(label)}${o.req?' <span style="color:var(--red)">*</span>':''}<div class="combo"><input type="hidden" id="${id}" value="${esc(value||'')}"><input class="combo-in" id="${id}_t" data-in="combo" data-src="${src}" data-for="${id}" ${o.dep?`data-dep="${o.dep}"`:''} ${o.after?`data-after="${o.after}"`:''} value="${esc(item?item.label:'')}" placeholder="${esc(o.ph||'Digite para buscar…')}" autocomplete="off" ${o.attrs||''}><div class="combo-list hidden" id="${id}_l"></div></div></label>`;
}
function comboList(inp){
 const src=COMBO[inp.dataset.src];if(!src)return;const q=inp.value,dep=inp.dataset.dep?V(inp.dataset.dep):'';
 const res=src.search(q,dep).slice(0,9);const l=document.getElementById(inp.dataset.for+'_l');
 l.innerHTML=res.map(r=>`<button type="button" class="combo-opt" data-action="combo-pick" data-for="${inp.dataset.for}" data-id="${esc(r.id)}">${esc(r.label)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</button>`).join('')+(src.create?`<button type="button" class="combo-opt new" data-action="combo-new" data-for="${inp.dataset.for}" data-src="${inp.dataset.src}" data-q="${esc(q)}">+ ${esc(src.create)}</button>`:'')||'<div class="combo-opt muted">Nada encontrado</div>';
 l.classList.remove('hidden');
}
H.combo=(el)=>{const h=document.getElementById(el.dataset.for);if(h&&h.value){h.value='';h.dispatchEvent(new Event('change',{bubbles:true}));}comboList(el)};
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('combo-in'))comboList(t)});
document.addEventListener('click',e=>{if(!e.target.closest('.combo'))$$('.combo-list').forEach(l=>l.classList.add('hidden'))});
function comboSet(id,val){
 const h=document.getElementById(id),t=document.getElementById(id+'_t');if(!h||!t)return;h.value=val||'';
 const src=COMBO[t.dataset.src],it=val&&src.get(val);t.value=it?it.label:'';
 document.getElementById(id+'_l')?.classList.add('hidden');h.dispatchEvent(new Event('change',{bubbles:true}));
 const af=t.dataset.after;if(af&&H[af])H[af](h,val);
}

/* situação de pagamento de uma OS */
function orderPay(o){
 const total=docTotals(o).total,tx=state.transactions.filter(t=>t.orderId===o.id&&t.type==='Receita'&&t.status!=='Cancelado');
 const paid=sum(tx.filter(t=>t.status==='Recebido'),t=>t.value),planned=sum(tx,t=>t.value);
 const late=tx.some(t=>t.status==='Pendente'&&(t.dueDate||t.date)<todayISO());
 let st='none';if(total>0){if(paid>=total)st='paid';else if(paid>0)st=late?'late':'part';else if(tx.length)st=late?'late':'open'}
 return {total,paid,planned,balance:Math.max(0,total-paid),unplanned:Math.max(0,total-planned),st,tx,late};
}
const PAY_CHIP={none:['draft','Sem cobrança'],open:['sent','A receber'],part:['warn','Parcial'],late:['bad','Em atraso'],paid:['ok','Pago']};
const payChip=o=>{const p=orderPay(o);return `<span class="chip-st" data-k="${PAY_CHIP[p.st][0]}">${PAY_CHIP[p.st][1]}</span>`};

/* ---------- plano de pagamento (entrada + parcelas) ---------- */
function cardFeePct(method,n){const f=state.settings.cardFees;if(method==='Débito')return Number(f.debit)||0;if(method==='Crédito')return Number(f.credit[n]??f.credit[1])||0;return 0}
function calcPlan(total,p){
 // p: {entry:{on,value,method,date,paid,account}, n, first, every(dias), method, interestPct, perInstallment? }
 const entry=p.entry&&p.entry.on?Math.min(total,Math.max(0,p.entry.value||0)):0;
 const rest=Math.max(0,total-entry),n=Math.max(1,Number(p.n)||1);
 const interest=Math.round(rest*(Number(p.interestPct)||0)/100),base=rest+interest;
 const each=Math.floor(base/n),rows=[];let acc=0;
 for(let i=0;i<n;i++){const v=i===n-1?base-acc:each;acc+=v;rows.push({n:i+1,value:v,due:addDays(p.first||todayISO(),i*(Number(p.every)||30))})}
 if(p.every===0||p.monthly)rows.forEach((r,i)=>r.due=addMonths(p.first||todayISO(),i));
 return {entry,rest,interest,base,rows,total:entry+base};
}

function custStats(id){
 const orders=custOrders(id).filter(o=>o.status!=='Cancelada'),tx=custTx(id);
 const spent=sum(tx.filter(t=>t.status==='Recebido'),t=>t.value);
 const open=sum(tx.filter(t=>t.status==='Pendente'),t=>t.value);
 const overdue=sum(tx.filter(t=>t.status==='Pendente'&&(t.dueDate||t.date)<todayISO()),t=>t.value);
 const last=[...orders].sort((a,b)=>String(b.openedAt).localeCompare(String(a.openedAt)))[0];
 return {orders:orders.length,spent,open,overdue,last:last?String(last.openedAt).slice(0,10):'',ticket:orders.length?Math.round(sum(orders,o=>docTotals(o).total)/orders.length):0};
}

function parseContacts(text){
 const out=[];text=String(text||'');
 if(/BEGIN:VCARD/i.test(text)){text.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{const fn=(b.match(/^FN[^:]*:(.*)$/mi)||[])[1]||'';const tel=(b.match(/^TEL[^:]*:(.*)$/mi)||[])[1]||'';const em=(b.match(/^EMAIL[^:]*:(.*)$/mi)||[])[1]||'';if(fn.trim()||tel.trim())out.push({name:fn.trim(),phone:tel.trim(),email:em.trim()})});return out}
 text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const p=l.split(/[;\t]|,(?=\s*[\d(+])/).map(x=>x.replace(/^"|"$/g,'').trim());if(i===0&&/nome|name/i.test(p[0])&&!digits(p.join('')).length>6)return;let name='',phone='',email='';p.forEach(x=>{if(/@/.test(x))email=x;else if(digits(x).length>=8&&!phone&&!/[a-z]{3,}/i.test(x))phone=x;else if(!name)name=x});if(name||phone)out.push({name,phone,email})});
 return out;
}

/* ---------- lembretes de revisão ---------- */
function vehicleReminders(v){
 const out=[],today=todayISO(),horizon=state.settings.reminderDays||30,map={};
 const done=vehOrders(v.id).filter(o=>['Pronta','Entregue'].includes(o.status)).sort((a,b)=>String(a.finishedAt||a.openedAt).localeCompare(String(b.finishedAt||b.openedAt)));
 for(const o of done){const d=String(o.deliveredAt||o.finishedAt||o.openedAt).slice(0,10),km=o.kmOut||o.kmIn||0;
  for(const it of o.items||[]){if(it.type!=='service'||it.approved===false)continue;const kmI=Number(it.kmInt)||0,moI=Number(it.moInt)||0;if(!kmI&&!moI)continue;map[it.refId||norm(it.name)]={name:it.name,date:d,km,kmI,moI,orderCode:o.code}}}
 for(const [key,x] of Object.entries(map)){
  const dueDate=x.moI?addMonths(x.date,x.moI):'',dueKm=x.kmI&&x.km?x.km+x.kmI:0;
  let status='ok',reason=[];
  if(dueDate){const dd=diffDays(dueDate,today);if(dd<0){status='late';reason.push('venceu em '+brDate(dueDate))}else if(dd<=horizon){status='soon';reason.push('vence em '+brDate(dueDate))}else reason.push('próximo em '+brDate(dueDate))}
  if(dueKm&&v.km){const rest=dueKm-v.km;if(rest<=0){status='late';reason.push('passou de '+num(dueKm)+' km')}else if(rest<=1000&&status!=='late'){status='soon';reason.push('faltam ~'+num(rest)+' km')}else if(!dueDate)reason.push('próximo aos '+num(dueKm)+' km')}
  out.push({key:v.id+':'+key,vehicleId:v.id,customerId:v.customerId,service:x.name,dueDate,dueKm,lastDate:x.date,lastKm:x.km,status,reason:reason.join(' · '),orderCode:x.orderCode});
 }
 if(v.nextRevDate||v.nextRevKm){let status='ok',reason=[];if(v.nextRevDate){const dd=diffDays(v.nextRevDate,today);status=dd<0?'late':dd<=horizon?'soon':'ok';reason.push((dd<0?'venceu em ':'previsto para ')+brDate(v.nextRevDate))}if(v.nextRevKm&&v.km){const rest=v.nextRevKm-v.km;if(rest<=0)status='late';else if(rest<=1000&&status==='ok')status='soon';reason.push(num(v.nextRevKm)+' km')}out.push({key:v.id+':manual',vehicleId:v.id,customerId:v.customerId,service:'Revisão programada',dueDate:v.nextRevDate,dueKm:v.nextRevKm,lastDate:'',lastKm:0,status,reason:reason.join(' · ')})}
 const ord={late:0,soon:1,ok:2};return out.sort((a,b)=>ord[a.status]-ord[b.status]);
}
function allReminders(){
 const arr=[];for(const v of state.vehicles){if(v.active===false)continue;const c=getCustomer(v.customerId);if(!c||c.status==='Inativo')continue;for(const r of vehicleReminders(v)){const log=state.contactLog.filter(x=>x.refKey===r.key).sort((a,b)=>b.at.localeCompare(a.at))[0];r.contacted=log?log.at.slice(0,10):'';r.snoozed=(v.snooze||{})[r.key.split(':').slice(1).join(':')]||'';arr.push(r)}}
 return arr;
}
const reminderBadge=r=>r.status==='late'?badge('Vencida','red'):r.status==='soon'?badge('Vence em breve','warn'):badge('Em dia');

const lineTotal=it=>Math.round((Number(it.qty)||0)*(Number(it.price)||0))-(Number(it.discount)||0);
function docTotals(d){
 const items=(d.items||[]).filter(i=>i.approved!==false);
 const svc=sum(items.filter(i=>i.type==='service'),lineTotal),prt=sum(items.filter(i=>i.type==='part'),lineTotal),oth=sum(items.filter(i=>i.type==='other'),lineTotal);
 const sub=svc+prt+oth,dv=d.discount&&Number(d.discount.v)?Number(d.discount.v):0;
 const disc=dv?(d.discount.type==='percent'?Math.round(sub*Math.min(100,dv)/100):Math.min(sub,Math.round(dv))):0;
 const total=Math.max(0,sub-disc),cost=sum(items.filter(i=>i.type==='part'),i=>Math.round((Number(i.qty)||0)*(Number(i.cost)||0)));
 return {svc,prt,oth,sub,disc,total,cost,margin:total-cost,count:items.length};
}
const TYPE_LABEL={service:'Serviço',part:'Peça',other:'Outro'};
const typePill=t=>`<span class="type-pill ${t==='service'?'s':t==='part'?'p':'o'}" title="${TYPE_LABEL[t]||''}">${t==='service'?'MO':t==='part'?'PÇ':'OU'}</span>`;
function itemFromService(s,qty=1){return {id:uid('it'),type:'service',refId:s.id,name:s.name,description:'',qty,price:s.price,discount:0,approved:true,hours:s.hours||0,kmInt:s.kmInterval||0,moInt:s.monthsInterval||0,warrantyDays:s.warrantyDays??state.shop.warrantyDays}}
function itemFromPart(p,qty=1){return {id:uid('it'),type:'part',refId:p.id,name:p.name+(p.brand?' · '+p.brand:''),description:'',qty,price:p.price,cost:p.cost||0,discount:0,approved:true,unit:p.unit||'un'}}

function newOrderDraft(pre={}){
 return {id:uid('os'),code:'',customerId:pre.customerId||'',vehicleId:pre.vehicleId||'',openedAt:iso(),status:'Aguardando',quoteId:'',items:[],discount:{type:'value',v:0},mechId:pre.mechId||'',bayId:'',
  kmIn:0,kmOut:0,fuel:'1/2',complaint:'',diagnosis:'',checklist:{},damages:[],photos:[],signature:'',notes:'',promisedAt:'',finishedAt:'',deliveredAt:'',warrantyUntil:'',history:[],stockOut:{},authorized:false,createdAt:iso()};
}
const orderActive=o=>!['Entregue','Cancelada'].includes(o.status);

/* ---------- estoque, comissão e status ---------- */
function stockApply(o){
 let n=0;
 for(const it of o.items){
  if(it.type!=='part'||!it.refId||it.approved===false)continue;const p=getPart(it.refId);if(!p)continue;
  const want=Number(it.qty)||0,done=Number(o.stockOut[it.id])||0,diff=want-done;
  if(diff!==0){p.qty=Math.round((p.qty-diff)*1000)/1000;state.stockMoves.push({id:uid('mv'),partId:p.id,type:diff>0?'Saída':'Entrada',qty:Math.abs(diff),date:todayISO(),orderId:o.id,note:(diff>0?'Uso na ':'Ajuste na ')+o.code,cost:p.cost||0});o.stockOut[it.id]=want;n++}
 }
 return n;
}
function stockRevert(o){
 for(const [iid,q] of Object.entries(o.stockOut||{})){const it=o.items.find(i=>i.id===iid);const p=it&&getPart(it.refId);if(p&&q){p.qty=Math.round((p.qty+q)*1000)/1000;state.stockMoves.push({id:uid('mv'),partId:p.id,type:'Entrada',qty:q,date:todayISO(),orderId:o.id,note:'Estorno '+o.code,cost:p.cost||0})}}
 o.stockOut={};
}
function commissionFor(o){
 const m=getMech(o.mechId);if(!m||!m.commissionPct)return 0;
 const t=docTotals({items:o.items.filter(i=>i.type==='service'&&(getService(i.refId)?.commissionable!==false))});
 return Math.round(t.total*m.commissionPct/100);
}
async function setOrderStatus(o,st,silent){
 const prev=o.status;if(prev===st)return;
 if(['Pronta','Entregue'].includes(st)&&!o.items.some(i=>i.approved!==false))return toast('Adicione pelo menos um item aprovado antes de concluir a OS.','err'),false;
 if(st==='Em execução'&&!o.items.length)return toast('Adicione os serviços a executar antes de iniciar.','err'),false;
 o.status=st;o.history.push({at:iso(),t:'Situação: '+prev+' → '+st});
 const when=state.shop.stockDeductOn||'run';
 if(st==='Em execução'||(st==='Pronta'&&when!=='run')||(st==='Entregue'))stockApply(o);
 if(st==='Pronta')o.finishedAt=iso();
 if(st==='Entregue'){
  o.deliveredAt=iso();if(!o.finishedAt)o.finishedAt=iso();
  const days=Math.max(0,...o.items.filter(i=>i.type==='service'&&i.approved!==false).map(i=>Number(i.warrantyDays)||0));
  if(days)o.warrantyUntil=addDays(todayISO(),days);
  const cm=commissionFor(o);state.commissions=state.commissions.filter(c=>c.orderId!==o.id);
  if(cm>0)state.commissions.push({id:uid('cm'),orderId:o.id,mechId:o.mechId,value:cm,date:todayISO(),status:'Pendente'});
  const v=getVehicle(o.vehicleId);if(v){const k=o.kmOut||o.kmIn||0;if(k>(v.km||0)){v.km=k;v.kmDate=todayISO()}}
 }
 if(st==='Cancelada'){stockRevert(o);state.commissions=state.commissions.filter(c=>c.orderId!==o.id);for(const t of state.transactions)if(t.orderId===o.id&&t.status==='Pendente')t.status='Cancelado'}
 if(prev==='Cancelada'&&st!=='Cancelada'){}
 audit('Ordens de serviço','Situação '+st,o.code);await persist();if(!silent)toast('Situação: '+st,'ok');return true;
}

 const c=$('#sigc'),x=c.getContext('2d');x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#111';SIG={drawing:false,has:false};
 const pos=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]};
 const st=e=>{e.preventDefault();SIG.drawing=true;const [a,b]=pos(e);x.beginPath();x.moveTo(a,b)},mv=e=>{if(!SIG.drawing)return;e.preventDefault();const [a,b]=pos(e);x.lineTo(a,b);x.stroke();SIG.has=true},en=()=>{SIG.drawing=false};
 c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en);

let PAYD=null;
A['os-pay']=el=>{
 const o=getOrder(el.dataset.id),p=orderPay(o);
 if(!p.total)return toast('A OS ainda não tem valor. Inclua os serviços primeiro.','err');
 PAYD={orderId:o.id,total:p.unplanned||p.balance||p.total,entry:{on:false,value:0,method:'Pix',date:todayISO(),paid:true,account:'acc_pix'},n:1,first:addDays(todayISO(),30),method:'Pix',interestPct:0,monthly:true,account:'acc_banco',replace:false};
 PAYD.total=p.unplanned>0?p.unplanned:p.total;
 showModal('Forma de pagamento',`<div id="pay_body">${payBody()}</div>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="pay-confirm">Gerar cobranças</button>`,'wide');
};
function payBody(){
 const d=PAYD,o=getOrder(d.orderId),p=orderPay(o),plan=calcPlan(d.total,d),acc=state.accounts.filter(a=>a.active!==false).map(a=>({v:a.id,l:a.name}));
 const fee=(d.method==='Crédito'||d.method==='Débito')?cardFeePct(d.method,d.n):0;
 return `<div class="sumcards"><div><span>Total da OS</span><b>${money(p.total)}</b></div><div><span>Já recebido</span><b>${money(p.paid)}</b></div><div><span>A cobrar agora</span><b>${money(d.total)}</b></div></div>
 ${p.planned>0&&p.unplanned>0?`<div class="alert warn mt12">${ICON.alert}<div>Já existem cobranças que somam ${money(p.planned)}. Este plano cobre só o restante (${money(p.unplanned)}).</div></div>`:''}
 <div class="planbox"><div class="planhead">${Chk('pe_on','Combinar entrada / adiantamento',d.entry.on,'data-ch="pay-field" data-f="entry.on"')}</div>
 ${d.entry.on?`<div class="form-grid"><label>Valor da entrada<input id="pe_v" inputmode="decimal" data-mask="money" data-in="pay-field" data-f="entry.value" value="${d.entry.value?moneyIn(d.entry.value):''}" placeholder="0,00"></label>
 <label>Data<input type="date" id="pe_d" data-ch="pay-field" data-f="entry.date" value="${d.entry.date}"></label>
 <label>Forma<select id="pe_m" data-ch="pay-field" data-f="entry.method">${optHTML(state.lists.payMethods,d.entry.method)}</select></label>
 <label>Conta / caixa<select id="pe_a" data-ch="pay-field" data-f="entry.account">${optHTML(acc,d.entry.account)}</select></label>
 ${Chk('pe_p','Entrada já recebida',d.entry.paid,'data-ch="pay-field" data-f="entry.paid"')}</div>`:''}</div>
 <div class="planbox"><div class="planhead"><b>Parcelas do restante</b> <span class="muted small">${money(plan.rest)}</span></div>
 <div class="form-grid"><label>Quantidade de parcelas<input id="pp_n" type="number" min="1" max="24" value="${d.n}" data-in="pay-field" data-f="n"></label>
 <label>1º vencimento<input type="date" id="pp_d" data-ch="pay-field" data-f="first" value="${d.first}"></label>
 <label>Forma<select id="pp_m" data-ch="pay-field" data-f="method">${optHTML(state.lists.payMethods,d.method)}</select></label>
 <label>Conta / caixa<select id="pp_a" data-ch="pay-field" data-f="account">${optHTML(acc,d.account)}</select></label>
 <label>Juros do parcelamento (%)<input id="pp_i" value="${d.interestPct||''}" placeholder="0" data-in="pay-field" data-f="interestPct"></label>
 ${Chk('pp_mo','Vencimento todo mês (senão a cada 30 dias)',d.monthly,'data-ch="pay-field" data-f="monthly"')}</div>
 ${fee?`<div class="muted small mt12">Taxa da maquininha estimada: ${num(fee,2)}% (≈ ${money(Math.round(plan.base*fee/100))}) — será lançada como despesa quando o valor for recebido.</div>`:''}</div>
 <div class="planbox"><div class="planhead"><b>Resumo</b></div>${plan.entry?`<div class="prow"><span>Entrada — ${brDate(d.entry.date)} (${d.entry.paid?'recebida':'a receber'})</span><b>${money(plan.entry)}</b></div>`:''}
 ${plan.rows.map(r=>`<div class="prow"><span>Parcela ${r.n}/${plan.rows.length} — ${brDate(r.due)}</span><b>${money(r.value)}</b></div>`).join('')}
 ${plan.interest?`<div class="prow"><span>Juros</span><b>${money(plan.interest)}</b></div>`:''}<div class="prow tot"><span>Total do plano</span><b>${money(plan.total)}</b></div></div>`;
}
const payRefresh=()=>{const b=$('#pay_body');if(b){const sy=modalBody().scrollTop;b.innerHTML=payBody();modalBody().scrollTop=sy}};
function setPath(obj,path,val){const ks=path.split('.');let o=obj;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=val}
H['pay-field']=(el,e)=>{
 const f=el.dataset.f;let v=el.type==='checkbox'?el.checked:el.value;
 if(f==='entry.value')v=cents(v);else if(f==='n')v=Math.max(1,Math.min(24,Number(v)||1));else if(f==='interestPct')v=Number(String(v).replace(',','.'))||0;
 setPath(PAYD,f,v);
 if(el.dataset.in){ // digitando: atualiza só o resumo
  const act=document.activeElement,id=act&&act.id,pos=act&&act.selectionStart;payRefresh();const n=id&&document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}
 }else payRefresh();
};
A['pay-confirm']=async()=>{
 const d=PAYD,o=getOrder(d.orderId),plan=calcPlan(d.total,d);
 if(d.entry.on&&!d.entry.value)return bad('pe_v','Informe o valor da entrada ou desmarque “Combinar entrada”.');
 if(d.entry.on&&d.entry.value>d.total)return bad('pe_v','A entrada não pode ser maior que o valor a cobrar ('+money(d.total)+').');
 if(!d.first)return bad('pp_d','Informe o primeiro vencimento.');
 if(plan.rest>0&&d.first<todayISO().slice(0,10)&&false)return;
 const mk=(val,due,desc,method,account,paid)=>({id:uid('tx'),type:'Receita',status:paid?'Recebido':'Pendente',date:paid?todayISO():due,dueDate:due,paidAt:paid?todayISO():'',value:val,desc,category:'Serviço (mão de obra)',accountId:account,method,orderId:o.id,customerId:o.customerId,vehicleId:o.vehicleId,createdAt:iso()});
 const newTx=[];
 if(plan.entry)newTx.push(mk(plan.entry,d.entry.date,'Entrada · '+o.code,d.entry.method,d.entry.account,d.entry.paid));
 plan.rows.forEach(r=>newTx.push(mk(r.value,r.due,(plan.rows.length>1?`Parcela ${r.n}/${plan.rows.length}`:'Pagamento')+' · '+o.code,d.method,d.account,false)));
 if(plan.interest)newTx.forEach(t=>t.interestIncluded=true);
 state.transactions.push(...newTx);
 o.history.push({at:iso(),t:`Plano de pagamento: ${plan.entry?'entrada '+money(plan.entry)+' + ':''}${plan.rows.length}x`});
 audit('Ordens de serviço','Gerou cobranças',o.code);await persist();closeModal();toast('Cobranças geradas.','ok');render();
};
A['os-receive-all']=el=>{
 const o=getOrder(el.dataset.id),p=orderPay(o);
 showModal('Receber agora',`<p>Registrar o recebimento de <b>${money(p.unplanned||p.balance)}</b> da OS ${esc(o.code)}?</p><div class="form-grid">${F('rc_m','Forma',{opts:state.lists.payMethods,value:'Pix'})}${F('rc_a','Conta / caixa',{opts:state.accounts.filter(a=>a.active!==false).map(a=>({v:a.id,l:a.name})),value:'acc_pix'})}${F('rc_d','Data',{type:'date',value:todayISO()})}</div>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="os-receive-go" data-id="${o.id}">Confirmar recebimento</button>`,'sm');
};
A['os-receive-go']=async el=>{
 const o=getOrder(el.dataset.id),p=orderPay(o);
 const pend=p.tx.filter(t=>t.status==='Pendente');let val=p.unplanned;
 if(!V('rc_d'))return bad('rc_d','Informe a data.');
 if(pend.length&&val===0){ // quita as pendentes
  for(const t of pend){t.status='Recebido';t.paidAt=V('rc_d');t.date=V('rc_d');t.method=V('rc_m');t.accountId=V('rc_a');postCardFee(t)}
 }else if(val>0){const t={id:uid('tx'),type:'Receita',status:'Recebido',date:V('rc_d'),dueDate:V('rc_d'),paidAt:V('rc_d'),value:val,desc:'Pagamento · '+o.code,category:'Serviço (mão de obra)',accountId:V('rc_a'),method:V('rc_m'),orderId:o.id,customerId:o.customerId,vehicleId:o.vehicleId,createdAt:iso()};state.transactions.push(t);postCardFee(t)}
 o.history.push({at:iso(),t:'Pagamento recebido'});await persist();closeModal();toast('Pagamento registrado.','ok');render();
};
function postCardFee(t){
 if(!['Débito','Crédito'].includes(t.method))return;const pct=cardFeePct(t.method,1);if(!pct)return;
 const fee=Math.round(t.value*pct/100);if(fee<=0)return;
 state.transactions.push({id:uid('tx'),type:'Despesa',status:'Pago',date:t.paidAt||todayISO(),dueDate:t.paidAt||todayISO(),paidAt:t.paidAt||todayISO(),value:fee,desc:'Taxa de cartão · '+(t.desc||''),category:'Taxa de cartão',accountId:t.accountId,method:t.method,feeOf:t.id,createdAt:iso()});
}

 return table([{h:'Vencimento',f:t=>brDate(t.dueDate||t.date)},{h:'Descrição',f:t=>`<b>${esc(t.desc)}</b><div class="tiny muted">${esc(t.category||'')}${t.customerId?' · '+esc(custName(t.customerId)):''}${t.supplierId?' · '+esc(getSupplier(t.supplierId)?.name||''):''}</div>`},{h:'Conta',f:t=>esc(getAccount(t.accountId)?.name||'')},{h:'Valor',cls:'num',f:t=>`<b style="color:${t.type==='Receita'?'var(--green)':'var(--red)'}">${t.type==='Receita'?'':'− '}${money(t.value)}</b>`},{h:'Situação',f:t=>txChip(t)},{h:'',cls:'num',f:t=>`${t.status==='Pendente'?`<button class="btn xs accent" data-action="tx-receive" data-id="${t.id}">${t.type==='Receita'?'Receber':'Pagar'}</button> ${t.type==='Receita'&&t.customerId?`<button class="btn xs wa" data-action="tx-wa" data-id="${t.id}">${ICON.wa}</button> `:''}`:''}<button class="btn xs" data-action="edit-tx" data-id="${t.id}">${ICON.edit}</button>`}],pg.rows)+pg.html;

function monthSeries(n=6){
 const out=[];let m=monthKey(todayISO());
 for(let i=n-1;i>=0;i--){const k=monthKey(addMonths(m+'-01',-i));const tx=state.transactions.filter(t=>t.type!=='Transf'&&isDone(t)&&monthKey(t.date)===k);out.push({k,label:monthLabel(k).slice(0,3),rec:sum(tx.filter(t=>t.type==='Receita'),t=>t.value),des:sum(tx.filter(t=>t.type==='Despesa'),t=>t.value)})}
 return out;
}
function dreHTML(k){
 const tx=state.transactions.filter(t=>t.type!=='Transf'&&isDone(t)&&monthKey(t.date)===k);
 const rec=tx.filter(t=>t.type==='Receita'),des=tx.filter(t=>t.type==='Despesa');
 const byCat=(arr)=>Object.entries(arr.reduce((m,t)=>{m[t.category||'Sem categoria']=(m[t.category||'Sem categoria']||0)+t.value;return m},{})).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
 const R=sum(rec,t=>t.value),D=sum(des,t=>t.value);
 const orders=state.orders.filter(o=>o.status==='Entregue'&&monthKey(String(o.deliveredAt).slice(0,10))===k);
 const cost=sum(orders,o=>docTotals(o).cost);
 return `<div class="grid g3" style="margin-bottom:14px">${kpi('Entradas',money(R),monthLabel(k),{k:'k-green',icon:'wallet'})}${kpi('Saídas',money(D),'',{k:'k-red',icon:'wallet'})}${kpi('Resultado',money(R-D),R?num((R-D)/R*100,0)+'% de margem':'',{k:R-D>=0?'k-green':'k-red',icon:'chart'})}</div>
 <div class="grid g2"><div class="card"><h2>Receitas por categoria</h2>${hbars(byCat(rec),{color:'#2e9d5b'})||'<div class="muted small">Sem dados</div>'}</div><div class="card"><h2>Despesas por categoria</h2>${hbars(byCat(des),{color:'#d9534f'})||'<div class="muted small">Sem dados</div>'}</div></div>
 <div class="card"><h2>Ordens entregues no mês</h2><p class="muted small">${orders.length} OS · faturamento ${money(sum(orders,o=>docTotals(o).total))} · custo de peças ${money(cost)} · lucro bruto ${money(sum(orders,o=>docTotals(o).total)-cost)}</p></div>`;
}

 else if(f==='acc')body=`<div class="grid g3">${state.accounts.map(a=>`<div class="card"><div class="card-head"><h3>${esc(a.name)}</h3><button class="btn xs" data-action="edit-acc" data-id="${a.id}">${ICON.edit}</button></div><div class="muted small">${esc(a.type)}${a.active===false?' · inativa':''}</div><div style="font-size:24px;font-weight:800;margin-top:6px">${money(accBalance(a))}</div></div>`).join('')}</div><div class="mt12">${btn('Nova conta','new-acc',{icon:'plus'})}${btn('Transferir entre contas','transfer',{icon:'refresh'})}</div>`;
 else{const k=UI.f.dre||monthKey(today);const opts=[...Array(12)].map((_,i)=>{const mk=monthKey(addMonths(monthKey(today)+'-01',-i));return {v:mk,l:monthLabel(mk)}});body=`<div class="toolbar"><label style="max-width:240px">Mês<select data-ch="dre-month">${optHTML(opts,k)}</select></label></div>`+dreHTML(k)}

 state.settings.reminderDays=Number(V('s_rd'))||30;state.settings.quoteFollowDays=Number(V('s_qf'))||3;

let lockTimer=null,lastAct=Date.now();
function showLock(){
 const L=$('#lock');L.classList.add('on');L.innerHTML=`<div class="lockbox"><div class="brandmark">${ICON.tool}</div><h1>${esc(state.shop.name)}</h1><p>Digite o PIN para entrar</p><input id="lock_pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autofocus><div id="lock_err" class="modal-err" style="display:none">PIN incorreto.</div><button class="btn primary" data-action="unlock">Entrar</button></div>`;

A['unlock']=async()=>{const v=($('#lock_pin')||{}).value||'';if((await sha256(state.settings.pinSalt+v))===state.settings.pinHash){$('#lock').classList.remove('on');$('#lock').innerHTML='';lastAct=Date.now()}else{$('#lock_err').style.display='';$('#lock_pin').value='';$('#lock_pin').focus()}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#lock_pin')&&document.activeElement.id==='lock_pin')A.unlock()});
['click','keydown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));

function backupHTML(){
 const st=state.settings,last=st.lastBackup,days=last?diffDays(last.slice(0,10),todayISO()):null;
 return `<div class="card"><h2>Backup dos dados</h2><p class="muted small">Seus dados ficam neste computador. Salve cópias de segurança em outro lugar (pendrive, nuvem). Recomendamos um backup por semana.</p>
 ${last?`<div class="alert ${days>7?'warn':'ok'}">${ICON.shield}<div>Último backup: <b>${brDT(last)}</b> (${days===0?'hoje':'há '+days+' dia(s)'}).</div></div>`:`<div class="alert warn">${ICON.alert}<div><b>Você ainda não fez nenhum backup.</b></div></div>`}
 <div class="mt12" style="display:flex;gap:8px;flex-wrap:wrap">${btn('Baixar backup','bk-export',{cls:'accent',icon:'download'})}${btn('Baixar backup com senha','bk-export-enc',{icon:'lock',title:'Criptografa o arquivo com uma senha'})}${btn('Restaurar de um arquivo','bk-restore',{icon:'upload'})}</div></div>
 <div class="card"><h2>Pontos de restauração automáticos</h2><p class="muted small">O sistema guarda cópias diárias, semanais e mensais sozinho dentro do navegador.</p><div id="snaps"><div class="muted small">Carregando…</div></div></div>`;
}
async function loadSnaps(){
 const b=$('#snaps');if(!b||!db)return;const all=(await idbAll('snapshots')).sort((a,c)=>c.at.localeCompare(a.at));
 b.innerHTML=all.length?table([{h:'Data',f:s=>brDT(s.at)},{h:'Tipo',f:s=>({daily:'Diário',weekly:'Semanal',monthly:'Mensal',safety:'Segurança',manual:'Manual'})[s.type]+(s.label?' · '+esc(s.label):'')},{h:'Clientes / OS',f:s=>(s.data.customers||[]).length+' / '+(s.data.orders||[]).length},{h:'',cls:'num',f:s=>`<button class="btn xs" data-action="snap-restore" data-id="${esc(s.id)}">Restaurar</button>`}],all):'<div class="muted small">Ainda não há pontos de restauração.</div>';
}
A['snap-restore']=async el=>{const s=await idbGet('snapshots',el.dataset.id);if(!s)return toast('Ponto não encontrado.','err');confirmBox('Restaurar este ponto?',`O sistema voltará ao estado de <b>${brDT(s.at)}</b>. O estado atual será guardado como ponto de segurança.`,()=>applyRestore(s.data),{yes:'Restaurar',danger:true})};
async function applyRestore(data){
 await safetySnapshot('Antes de restaurar');const keepId=state.shopId;
 state=migrate(clone(data));state.rev=loadedRev;await persist({snapshot:false});toast('Dados restaurados.','ok');buildNav();go('home');
}
A['bk-export']=async()=>{
 const payload={app:APP.name,schema:APP.schema,exportedAt:iso(),checksum:checksum(state),data:state};
 download(`backup_meu_mecanico_${todayISO()}.json`,new Blob([JSON.stringify(payload)],{type:'application/json'}));
 state.settings.lastBackup=iso();state.settings.backupChangeCount=0;await persist({snapshot:false});toast('Backup baixado. Guarde em local seguro.','ok');render();
};
A['bk-export-enc']=()=>{
 if(!hasCrypto())return toast('Este navegador não permite criptografia. Use o backup comum.','err');
 showModal('Backup com senha',`<div class="form-grid">${F('bk_p1','Senha (mínimo 10 caracteres)',{type:'password',full:true})}${F('bk_p2','Repita a senha',{type:'password',full:true})}</div><p class="muted small mt12">Sem a senha não é possível abrir o arquivo. Anote em local seguro.</p>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="bk-enc-go">Gerar backup</button>`,'sm');
};
async function deriveKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
A['bk-enc-go']=async()=>{
 const p=V('bk_p1');if(p.length<10)return bad('bk_p1','A senha precisa ter pelo menos 10 caracteres.');if(p!==V('bk_p2'))return bad('bk_p2','As senhas não conferem.');
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(p,salt);
 const plain=new TextEncoder().encode(JSON.stringify({checksum:checksum(state),data:state}));const enc=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
 download(`backup_meu_mecanico_${todayISO()}.mecanico`,new Blob([JSON.stringify({app:APP.name,enc:true,salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(enc)})],{type:'application/json'}));
 state.settings.lastBackup=iso();await persist({snapshot:false});closeModal();toast('Backup criptografado baixado.','ok');render();
};
A['bk-restore']=()=>{const i=$('#restoreInput');i.value='';i.onchange=async()=>{const f=i.files[0];if(!f)return;let j;try{j=JSON.parse(await f.text())}catch{return toast('Arquivo inválido.','err')}
 if(j.enc){showModal('Senha do backup',`<div class="form-grid">${F('bk_pw','Senha',{type:'password',full:true})}</div>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="bk-dec-go">Abrir</button>`,'sm');window.__bkj=j;return}
 reviewRestore(j.data||j)};i.click()};
A['bk-dec-go']=async()=>{const j=window.__bkj;try{const key=await deriveKey(V('bk_pw'),b64ToBytes(j.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(j.iv)},key,b64ToBytes(j.data));const o=JSON.parse(new TextDecoder().decode(plain));closeModal();reviewRestore(o.data)}catch{bad('bk_pw','Senha incorreta ou arquivo danificado.')}};

function attentionItems(){
 const out=[],today=todayISO(),Q=commQueues();
 const ready=state.orders.filter(o=>o.status==='Pronta');
 if(ready.length)out.push({k:'ready',t:ready.length+' veículo(s) pronto(s) para retirada',s:'Avise o cliente e receba o pagamento.',r:['orders'],label:'Ver prontas',tab:['orders','ready']});
 const waitApr=state.orders.filter(o=>o.status==='Aguardando aprovação');
 if(waitApr.length)out.push({k:'apr',t:waitApr.length+' OS aguardando aprovação do cliente',s:'Cobre uma resposta pelo WhatsApp.',r:['orders'],label:'Abrir quadro',tab:['orders','board']});
 const late=state.transactions.filter(t=>t.type==='Receita'&&t.status==='Pendente'&&(t.dueDate||t.date)<today);
 if(late.length)out.push({k:'late',t:late.length+' cobrança(s) em atraso',s:money(sum(late,t=>t.value))+' a receber.',r:['finance'],label:'Cobrar agora',tab:['finance','rec']});
 const pLate=state.transactions.filter(t=>t.type==='Despesa'&&t.status==='Pendente'&&(t.dueDate||t.date)<today);
 if(pLate.length)out.push({k:'plate',t:pLate.length+' conta(s) a pagar vencida(s)',s:money(sum(pLate,t=>t.value)),r:['finance'],label:'Ver contas',tab:['finance','pay']});
 if(Q.quotes.length)out.push({k:'qs',t:Q.quotes.length+' orçamento(s) sem resposta',s:'Enviados há mais de '+(state.settings.quoteFollowDays||3)+' dias.',r:['comm'],label:'Cobrar resposta',tab:['comm','quotes']});
 if(Q.rem.length)out.push({k:'rem',t:Q.rem.length+' revisão(ões) para lembrar',s:'Clientes com serviços perto do prazo.',r:['comm'],label:'Enviar lembretes',tab:['comm','rem']});
 const low=state.parts.filter(partLow);if(low.length)out.push({k:'low',t:low.length+' peça(s) abaixo do estoque mínimo',s:'Faça a lista de compras.',r:['parts'],label:'Ver estoque',tab:['parts','low']});
 const docs=state.documents.filter(d=>d.expires&&d.expires<=addDays(today,30));if(docs.length)out.push({k:'docs',t:docs.length+' documento(s) da oficina vencendo',s:'Alvarás e licenças.',r:['documents'],label:'Ver documentos',tab:null});
 const lb=state.settings.lastBackup;if(state.customers.length+state.orders.length>3&&(!lb||diffDays(lb.slice(0,10),today)>7))out.push({k:'bk',t:lb?'Faz mais de 7 dias do último backup':'Você ainda não fez backup',s:'Proteja seus dados.',r:['settings'],label:'Fazer backup',tab:['settings','backup']});
 return out;
}

 const active=state.orders.filter(orderActive),ready=state.orders.filter(o=>o.status==='Pronta');
 const delM=state.orders.filter(o=>o.status==='Entregue'&&monthKey(String(o.deliveredAt).slice(0,10))===k);

 <div class="grid g2-1"><div>
  <div class="card"><div class="card-head"><h2>Pendências</h2></div>${att.length?att.slice(0,6).map(i=>`<div class="row"><div class="grow"><b>${esc(i.t)}</b><div class="small muted">${esc(i.s)}</div></div><button class="btn sm" data-action="att-go" data-k="${i.k}">${esc(i.label)}</button></div>`).join(''):empty('check','Tudo em dia','Nenhuma pendência.')}</div>
  <div class="card"><h2>Entradas e saídas</h2>${barChart(ms.map(m=>m.label),[{name:'Entradas',color:'#2e9d5b',values:ms.map(m=>m.rec)},{name:'Saídas',color:'#e0645f',values:ms.map(m=>m.des)}])}</div>
 </div><div>
  <div class="card"><div class="card-head"><h2>Agenda de hoje</h2>${btn('Agenda','x',{cls:'xs'}).replace('data-action="x"','data-route="agenda"')}</div>${ap.length?ap.map(a=>`<div class="row"><b style="min-width:48px">${a.time}</b><div class="grow small">${esc(custName(a.customerId))}<div class="muted tiny">${esc(a.service||'')}</div></div></div>`).join(''):'<div class="muted small">Nenhum horário marcado para hoje.</div>'}</div>
  <div class="card"><h2>Situação das OS</h2>${hbars(KCOLS.map(s=>({label:ORDER_CHIP[s][1],value:state.orders.filter(o=>o.status===s).length})),{fmt:v=>v})}</div>
  <div class="card"><h2>Acesso rápido</h2><div class="quickgrid">${[['Clientes','customers','users'],['Veículos','vehicles','car'],['Peças','parts','box'],['Comunicação','comm','msg']].map(([l,r,i])=>`<button class="quick" data-route="${r}">${ICON[i]}<span>${l}</span></button>`).join('')}</div></div>
 </div></div>`;
}

function tourShow(){
 $$('.tour-card,.tour-hl').forEach(x=>x.classList.contains('tour-hl')?x.classList.remove('tour-hl'):x.remove());
 if(!TOUR)return;const s=TOUR.l.steps[TOUR.i];
 if(modOf(s[0])&&R.name!==s[0]){location.hash='#/'+s[0]}
 setTimeout(()=>{
  let target=null;try{target=s[0].startsWith('[')||s[0].startsWith('#')?document.querySelector(s[0]):document.querySelector(`#sideNav [data-route="${s[0]}"]`)||document.querySelector('.head-actions .btn.accent')}catch{}
  if(target)target.classList.add('tour-hl');
  document.body.insertAdjacentHTML('beforeend',`<div class="tour-card"><div class="tiny muted">${esc(TOUR.l.t)} · passo ${TOUR.i+1} de ${TOUR.l.steps.length}</div><b>${esc(s[1])}</b><p class="small">${esc(s[2])}</p><div class="row" style="border:0;padding:0"><button class="btn sm" data-action="tour-end">Sair</button><span class="grow"></span>${TOUR.i>0?'<button class="btn sm" data-action="tour-prev">Voltar</button>':''}<button class="btn sm primary" data-action="tour-next">${TOUR.i<TOUR.l.steps.length-1?'Próximo':'Concluir'}</button></div></div>`);
 },250);
}

A['tour-prev']=()=>{TOUR.i--;tourShow()};
A['tour-end']=()=>{TOUR=null;$$('.tour-hl').forEach(x=>x.classList.remove('tour-hl'));$$('.tour-card').forEach(x=>x.remove())};
