<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10283F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AttimoDrive">
<title>AttimoDrive — Gestão & Aceleração Automotiva</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* ── Identidade AttimoDrive (guia visual v2.0 — 22/09/2026) ── */
  --brand-copper:#A63F16; --brand-orange:#E56A20; --brand-amber:#F7A044; --brand-navy:#10283F;
  --canvas:#F5F7FA; --text-primary:#10283F; --text-secondary:#566575; --border-subtle:#DCE3EA;
  --control-border:#64748B; --orange-soft:#FFF1E8; --action-start:#9A3412; --action-end:#C2410C;
  --info:#1D4ED8;
  /* Degradês sempre puxando pra um tom bem mais claro no final (nunca cor chapada) */
  --gradient-brand:linear-gradient(135deg,#A63F16 0%,#E56A20 50%,#FFD9AE 100%);
  --gradient-action:linear-gradient(135deg,#9A3412 0%,#E56A20 55%,#FFD9AE 100%);
  --gradient-navy:linear-gradient(135deg,#10283F 0%,#17466B 60%,#3E7DA8 100%);
  /* Degradês de apoio — usados em selos/etiquetas/pílulas no lugar de cor chapada */
  --gradient-amber:linear-gradient(135deg,#B45309 0%,#F7A044 55%,#FFE8C7 100%);
  --gradient-success:linear-gradient(135deg,#166534 0%,#34A366 55%,#BBF7D0 100%);
  --gradient-violet:linear-gradient(135deg,#6D28D9 0%,#A78BFA 55%,#EDE9FE 100%);
  --gradient-danger:linear-gradient(135deg,#7F1D1D 0%,#DC2626 55%,#FCA5A5 100%);
  --gradient-gray:linear-gradient(135deg,#475569 0%,#94A3B8 55%,#E4E9EF 100%);
  --gradient-blue:linear-gradient(135deg,#075985 0%,#38BDF8 55%,#DFF3FE 100%);
  --gradient-whatsapp:linear-gradient(135deg,#0E7C3F 0%,#25D366 55%,#BEF5D3 100%);
  --gradient-pink:linear-gradient(135deg,#9D174D 0%,#EC4899 55%,#FBD3E8 100%);
  --font-ui:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-control:.75rem; --radius-card:1rem; --shadow-card:0 4px 16px rgba(16,40,63,.06);
  /* ── Tokens usados no restante do app, remapeados para a marca ── */
  --primary:#C2410C; --dark:#10283F; --accent:#15803D;
  --bg:#F5F7FA; --surface:#FFFFFF; --text:#10283F; --muted:#566575;
  --border:#DCE3EA; --line:#DCE3EA; --success:#15803D; --warning:#B45309; --danger:#B91C1C;
  --pblue:#FFF1E8; --pgreen:#E7F5EC; --pred:#FCEBEA;
  --shadow:0 4px 16px rgba(16,40,63,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;background:var(--surface);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.hidden{display:none!important}
.ic{display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;--ic-accent:currentColor}
.ic.duo{--ic-accent:#E56A20}
/* ícones two-tone sobre fundos claros: traço navy + acento laranja */
.cat-circle .ic.duo,.ptile-icon .ic.duo,.q .c:not([style]) .ic.duo{color:var(--dark)}
.filein{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---- splash / lock ---- */
#splash,#lockScreen,#setupScreen{position:fixed;inset:0;background:var(--gradient-navy);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px calc(32px + env(safe-area-inset-bottom));text-align:center;overflow-y:auto}
#splash::before{content:"";position:absolute;inset:0;background-image:var(--splash-wm);background-size:cover;background-position:center 22%;opacity:.24;z-index:0}
#splash::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center 42%,rgba(16,40,63,.55) 0%,rgba(16,40,63,.88) 62%,#0B1F33 100%);z-index:0}
#splash>*{position:relative;z-index:1}
#splash .mark,#lockScreen .mark,#setupScreen .mark{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.brandlogo{width:132px;height:132px;border-radius:28px;object-fit:cover;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.28);margin-bottom:20px}
.brandlogo.sm{width:96px;height:96px;border-radius:22px;margin-bottom:16px}
.brandlogo.full{width:auto;max-width:280px;height:auto;border-radius:20px;object-fit:contain;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.28);padding:18px 22px;margin-bottom:20px}
#splash .wm{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.5px}
#splash .wm span{color:#F7A044}
.splash-logo{width:auto;max-width:78vw;height:auto;object-fit:contain;filter:drop-shadow(0 10px 26px rgba(0,0,0,.35))}
.auth-box{width:100%;max-width:320px}
.auth-title{color:#fff;font-size:19px;font-weight:800;margin-top:4px}
.auth-sub{color:rgba(255,255,255,.75);font-size:13px;margin-top:6px;line-height:1.5;margin-bottom:20px}
.auth-box input{text-align:left;padding:14px 44px 14px 16px}
.pwwrap{position:relative}
.pwwrap .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)}
.auth-box .btn{margin-top:14px}
.pw-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:12px 0 4px;text-align:left}
.pw-rule{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.55);font-weight:600}
.pw-rule .rc{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);flex-shrink:0}
.pw-rule.ok{color:#8FE0B5}
.pw-rule.ok .rc{background:#1FAE6B;border-color:#1FAE6B}
.auth-err{color:#FFB3AC;font-size:12.5px;font-weight:700;margin-top:12px;min-height:16px}
.auth-link{margin-top:18px;background:none;color:rgba(255,255,255,.6);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.auth-note{font-size:11px;color:rgba(255,255,255,.55);margin-top:12px;line-height:1.6}

/* ---- tela de acesso: foto do carro + logo + login ---- */
#lockScreen,#setupScreen{justify-content:flex-start;padding:0;text-align:left;background:#0B1F33;display:block;overflow-y:auto}
.auth-photo{position:relative;width:100%;aspect-ratio:863/690;max-height:38vh;background-size:cover;background-position:center 24%}
.auth-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,31,51,.58) 0%,rgba(11,31,51,.1) 26%,rgba(11,31,51,.1) 55%,rgba(11,31,51,.75) 82%,#0B1F33 100%)}
.auth-brand2{position:absolute;z-index:2;top:18px;right:20px;display:flex;align-items:center;gap:7px}
.auth-brand2 img{display:block;height:27px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.auth-brand2 span{font-family:var(--font-ui);font-weight:800;font-size:16.5px;letter-spacing:.1px;color:#fff;text-shadow:0 2px 7px rgba(0,0,0,.65)}
.auth-brand2 span b{color:var(--brand-orange);font-weight:800}
.auth-wrap{position:relative;z-index:2;margin-top:-20px;padding:0 24px calc(26px + env(safe-area-inset-bottom))}
.auth-h1{color:#fff;font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.auth-h1 span{color:#F7A044}
.auth-p{color:rgba(255,255,255,.62);font-size:13px;margin-top:7px;line-height:1.45}
.auth-seg{display:flex;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:15px;padding:4px;gap:4px;margin:15px 0 4px}
.auth-seg button{flex:1;padding:12px 6px;border-radius:11px;font-size:13.5px;font-weight:800;color:rgba(255,255,255,.66);transition:background .18s ease,color .18s ease}
.auth-seg button.on{background:var(--gradient-action);color:#fff;box-shadow:0 8px 18px -6px rgba(154,52,18,.95);text-shadow:0 1px 2px rgba(0,0,0,.28)}
.auth-lb{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.72);margin:11px 0 5px}
.auth-fld{position:relative}
.auth-fld input{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.17);color:#fff;padding:13px 44px;border-radius:14px;font-size:15px}
.auth-fld input::placeholder{color:rgba(255,255,255,.4)}
.auth-fld input:focus{border-color:#E56A20;background:rgba(255,255,255,.1)}
.auth-fld .fic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.55);display:flex;pointer-events:none}
.auth-fld .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;background:none;line-height:1}
#lockScreen .btn,#setupScreen .btn{margin-top:12px}
#lockScreen .btn:disabled,#setupScreen .btn:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.42);text-shadow:none}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;text-shadow:none}
.auth-note{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:rgba(255,255,255,.52);margin-top:13px;line-height:1.5}
.auth-note .ic{flex:none;margin-top:1px}
#lockScreen .auth-link,#setupScreen .auth-link{display:block;width:100%;text-align:center}
#lockScreen .auth-err,#setupScreen .auth-err{text-align:center}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;font-weight:700;font-size:14.5px;background:var(--gradient-action);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.32);transition:transform .1s ease,filter .1s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#C7CDDB;color:#8890a0;cursor:not-allowed}
.btn.gray{background:var(--surface);color:var(--text);border:1.5px solid var(--border);text-shadow:none}
.btn.green{background:var(--gradient-success)}
.btn.danger{background:var(--gradient-danger)}
.btn.outline-danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);text-shadow:none}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dtile{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-align:left;width:100%}
.dtile .dtile-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.dtile .dtile-ic svg{width:17px;height:17px}
.dtile span{font-size:11.5px;font-weight:700;color:var(--text);line-height:1.25}

/* ---- header / topbar ---- */
header.topbar{padding:18px 18px 6px;position:sticky;top:0;background:var(--bg);z-index:10}
.greet{display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);font-weight:700}
.bell{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:14px;color:var(--muted);font-size:13.5px;box-shadow:var(--shadow)}
main{padding:6px 18px 10px}

/* ---- action cards ---- */
.action-card{position:relative;border-radius:20px;overflow:hidden;padding:18px;margin-bottom:12px;width:100%;text-align:left;box-shadow:0 12px 22px -14px rgba(21,27,46,.3)}
.action-card.vender{background:var(--gradient-action);color:#fff}
.action-card.comprar{background:var(--surface);color:var(--text);border:1.5px dashed var(--border);box-shadow:none;opacity:.75}
.ac-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.action-card.vender .ac-icon{background:rgba(255,255,255,.18)}
.action-card.comprar .ac-icon{background:var(--pblue);color:var(--primary)}
.ac-title{font-weight:800;font-size:16px;margin-top:12px}
.ac-sub{font-size:12px;margin-top:3px;opacity:.85;max-width:85%}
.badge-soon{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--pblue);color:var(--primary);padding:3px 8px;border-radius:100px;font-weight:700;float:right}

/* ---- categories ---- */
.cat-row{display:flex;gap:15px;overflow-x:auto;padding:2px 0 6px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
.cat-circle{width:52px;height:52px;border-radius:50%;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center}
.cat-item.disabled{opacity:.4}
.cat-label{font-size:11px;font-weight:700}

/* ---- lists / cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.stitle{font-weight:800;font-size:15px;margin:18px 0 10px}
.ptile{display:flex;align-items:center;gap:13px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.ptile.disabled{opacity:.5}
.ptile-icon{width:42px;height:42px;border-radius:12px;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ptile-icon img{width:100%;height:100%;object-fit:cover}
.ptile-title{font-weight:700;font-size:14px}
.ptile-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.ptile-chev{margin-left:auto;color:var(--muted);flex-shrink:0}
/* ── Cards de veículo (estoque) com foto, status em degradê e preço ── */
.vptile{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px;text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.vptile-photo{width:58px;height:58px;border-radius:12px;background:var(--orange-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.vptile-photo img{width:100%;height:100%;object-fit:cover}
.vptile-photo svg{width:24px;height:24px}
.vptile-info{min-width:0;flex:1}
.vptile-title{font-weight:700;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vptile-sub{font-size:11px;color:var(--muted);margin-top:2px}
.vptile-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.vptile-price{font-size:12.5px;font-weight:800;color:var(--text)}
.statuspill{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.05em;color:var(--muted);background:#EEF0F5;padding:3px 7px;border-radius:100px;text-transform:uppercase;font-weight:700}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px}

/* ---- wizard ---- */
.progress-wrap{padding:14px 18px 4px}
.step-back{display:inline-flex;align-items:center;gap:5px;background:var(--pblue);border:none;color:var(--primary);font-size:13.5px;font-weight:800;padding:9px 15px 9px 11px;border-radius:100px;margin-bottom:11px;cursor:pointer;line-height:1}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em}
.progress-name{font-size:12.5px;font-weight:700;color:var(--primary)}
.progress-track{height:5px;background:var(--pblue);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:100px;transition:width .25s ease}
.wtabs{display:flex;gap:3px;overflow-x:auto;margin-top:9px;padding-bottom:1px;-webkit-overflow-scrolling:touch}
.wtabs::-webkit-scrollbar{height:0}
.wtab{flex:none;font-size:11px;font-weight:600;padding:6px 11px;border:1px solid var(--border);border-bottom:2px solid transparent;border-radius:9px 9px 0 0;background:var(--pblue);color:var(--primary);white-space:nowrap;cursor:pointer;line-height:1}
.wtab.on{background:var(--surface);color:var(--text);border-bottom-color:var(--primary)}
.section-title{font-weight:800;font-size:16px;margin:6px 0 14px}

.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip-cor{display:inline-flex;align-items:center;gap:6px}
.chip-cor .sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(16,40,63,.25);flex:none}
.hscrollwrap{position:relative}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:7px}
.chiprow,.wtabs,.weekstrip,.pills,.quick,.cat-row{scrollbar-width:thin;scrollbar-color:var(--primary) var(--border)}
.chiprow::-webkit-scrollbar,.wtabs::-webkit-scrollbar,.weekstrip::-webkit-scrollbar,.pills::-webkit-scrollbar,.quick::-webkit-scrollbar,.cat-row::-webkit-scrollbar{height:5px}
.chiprow::-webkit-scrollbar-thumb,.wtabs::-webkit-scrollbar-thumb,.weekstrip::-webkit-scrollbar-thumb,.pills::-webkit-scrollbar-thumb,.quick::-webkit-scrollbar-thumb,.cat-row::-webkit-scrollbar-thumb{background:var(--primary);border-radius:6px}
.chiprow::-webkit-scrollbar-track,.wtabs::-webkit-scrollbar-track,.weekstrip::-webkit-scrollbar-track,.pills::-webkit-scrollbar-track,.quick::-webkit-scrollbar-track,.cat-row::-webkit-scrollbar-track{background:var(--border);border-radius:6px}
.chipfade{position:absolute;top:0;bottom:8px;width:34px;pointer-events:none;display:flex;align-items:center;z-index:3}
.chipfade-r{right:0;justify-content:flex-end;background:linear-gradient(to right, rgba(244,246,252,0), var(--bg) 60%)}
.chipfade-l{left:0;justify-content:flex-start;background:linear-gradient(to left, rgba(244,246,252,0), var(--bg) 60%);display:none}
.chipfade b{color:var(--primary);font-size:19px;line-height:1;font-weight:900}
.chipfade-r b{animation:chipnud 1.1s ease-in-out infinite}
.chipfade-l b{animation:chipnudL 1.1s ease-in-out infinite}
@keyframes chipnud{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(3px);opacity:1}}
@keyframes chipnudL{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(-3px);opacity:1}}
.chip{padding:9px 14px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;user-select:none}
.chip.selected{background:var(--gradient-action);border-color:var(--primary);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
fieldset{border:none;padding:0;margin:0 0 15px}
legend{padding:0;margin-bottom:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
.field{margin-bottom:14px}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.charcount{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .lbl{font-size:13.5px;font-weight:600}
.toggle-row .lbl .d{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}
.switch{width:42px;height:25px;border-radius:100px;background:#E4E7EF;border:1.5px solid var(--border);position:relative;cursor:pointer;flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s ease}
.switch.on{background:var(--gradient-action);border-color:var(--primary)}
.switch.on::after{transform:translateX(17px)}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
.photo-slot{aspect-ratio:1/1;border-radius:16px;border:1.5px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;overflow:hidden;color:var(--primary)}
.photo-slot span{font-size:10px;color:var(--muted);font-weight:600}
.photo-slot.filled{border-style:solid;border-color:var(--primary)}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot .badge{position:absolute;top:5px;left:5px;background:rgba(21,27,46,.75);color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:100px;z-index:2;font-family:'IBM Plex Mono',monospace}

.public-note{font-size:11.5px;color:var(--dark);background:var(--pblue);border-radius:14px;padding:10px 12px;margin:8px 0 16px;line-height:1.5;font-weight:500}

.review-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.review-item:last-child{border-bottom:none}
.review-item .k{color:var(--muted);width:44%;flex-shrink:0}
.review-item .v{font-weight:700;text-align:right}
.review-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.review-block-title{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);padding-top:11px;font-weight:700}
.wizfooter{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);z-index:20}

/* ---- ferramentas (Início) + catálogo ---- */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.ttile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow)}
.ttile .tb{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px -6px rgba(16,40,63,.45)}
.ttile .tl{font-size:11px;font-weight:800;color:var(--text);line-height:1.1;text-align:center}
.ttile .tbadge{position:absolute;top:6px;right:8px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--gradient-danger);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:none}
.cat-v{display:flex;align-items:center;gap:11px;margin-bottom:9px;cursor:pointer;border:1.5px solid var(--border);transition:border-color .15s}
.cat-v.on{border-color:var(--primary);background:var(--orange-soft)}
.cat-ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;background:var(--surface)}
.cat-v.on .cat-ck{background:var(--gradient-action);border-color:transparent}
.cat-th{width:62px;height:48px;border-radius:10px;background:var(--pblue);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;color:var(--dark)}
.cat-th img{width:100%;height:100%;object-fit:cover}

/* ---- fichas e documentos ---- */
.fc-sec{margin-bottom:12px}
.fc-sec-t{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--primary);font-weight:700;margin-bottom:10px}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-f{min-width:0}.fc-f.w1{grid-column:1/-1}
.fc-f label{margin:0 0 5px}
.fc-f textarea{resize:vertical}
.fc-scale-row{margin-bottom:10px}
.fc-scale-l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.fc-scale{display:flex;gap:5px}
.fc-scale button{flex:1;min-width:0;padding:9px 2px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-size:10.5px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-scale button.on{background:var(--gradient-action);color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.fc-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fc-opt{display:flex;align-items:center;gap:7px;padding:9px 9px;border:1.5px solid var(--border);border-radius:11px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--text);text-align:left;line-height:1.2}
.fc-opt .bx{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:none}
.fc-opt.on{border-color:var(--primary);background:var(--pblue);color:var(--primary)}
.fc-opt.on .bx{background:var(--gradient-action);border-color:transparent;color:#fff}

/* ---- bottom nav ---- */
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:50;overflow:visible}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;color:var(--muted);font-size:9px;font-weight:700;padding:4px 1px 0;height:52px;position:relative}
nav button .nic{width:30px;height:26px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:transform .28s cubic-bezier(.34,1.56,.64,1),background .28s ease,box-shadow .28s ease,color .28s ease}
nav button .lbl{transition:opacity .2s ease,transform .2s ease}
nav button.on{color:var(--primary)}

nav button{color:#41576D}
nav button.on .lbl{opacity:0;transform:translateY(6px);position:absolute}

nav button.on:active .nic{transform:translateY(-20px) scale(.94)}

/* ---- sheet / confirm ---- */
.modal{position:fixed;inset:0;background:rgba(15,20,40,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal.ov{z-index:400}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:sheetup .2s ease}
@keyframes sheetup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.sheet .mh h2{font-size:16.5px}
.sheet .mh .x{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:14px}
.sheet .mb{padding:8px 18px 4px;overflow-y:auto}
.sheet .mf{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:500;box-shadow:0 10px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

/* ── Agenda ── */
.ag-search{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px;color:var(--muted);box-shadow:var(--shadow)}

.day.active .dw{color:rgba(255,255,255,.85)}
.day.active .dd{background:#fff}
.cal-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-top:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.cal-head .nav{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:var(--pblue);color:var(--primary);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cal-head .lbl{flex:1;text-align:center;font-size:14.5px;font-weight:800;cursor:pointer;padding:6px 4px;border-radius:10px}
.cal-head .lbl:active{background:var(--pblue)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.cal-day{position:relative;aspect-ratio:1;border-radius:12px;background:var(--bg);border:1.5px solid transparent;font-size:12.5px;font-weight:700;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day.today{border-color:var(--primary);color:var(--dark)}
.cal-day.sel{background:var(--gradient-action);border-color:var(--primary);color:#fff;box-shadow:0 10px 18px -8px rgba(93,95,239,.55);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cal-day .dots{display:flex;gap:2px;height:5px}

.pills{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.pill{flex-shrink:0;padding:9px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.quick{display:flex;gap:16px;margin:18px 0 2px;overflow-x:auto;padding-bottom:2px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0;cursor:pointer}

// ===== Acessibilidade: zoom da interface (amplia o app inteiro) =====
const ZOOM_KEY='ad_zoom', ZOOM_MIN=0.8, ZOOM_MAX=1.7;
function getZoom(){ const v=parseFloat(localStorage.getItem(ZOOM_KEY)); return (v && v>=ZOOM_MIN && v<=ZOOM_MAX)?v:1; }
function aplicarZoom(f){ f=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,Math.round((f||1)*100)/100)); try{ document.documentElement.style.zoom=f; }catch(e){} try{ localStorage.setItem(ZOOM_KEY,String(f)); }catch(e){} return f; }
function mudarZoom(delta){ const f=aplicarZoom(getZoom()+delta); const el=document.getElementById('zoomPct'); if(el) el.textContent=Math.round(f*100)+'%'; }
function resetZoom(){ aplicarZoom(1); const el=document.getElementById('zoomPct'); if(el) el.textContent='100%'; }
try{ document.documentElement.style.zoom=getZoom(); }catch(e){}
const val = id => document.getElementById(id)?.value.trim() || '';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2,10)+Date.now().toString(36));
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function fmtBRL(v){
  const n = parseFloat(v)||0;
  const neg = n < 0;
  let [int,dec] = Math.abs(n).toFixed(2).split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.');   // 12980 -> 12.980
  return (neg?'- ':'') + 'R$ ' + int + ',' + dec;
}
// Hora das visitas exibida por extenso: "as 03:10 hs"
function fmtHora(h){ return h ? ('as '+h+' hs') : '--:--'; }
function fmtDataBR(iso){ if(!iso) return '—'; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }

// ═══ Máscaras ═══
// Telefone (99)99999.9999
function maskTelefone(input){
  let d = input.value.replace(/\D/g,'').slice(0,11);
  let out = '';
  if(d.length>0) out = '(' + d.slice(0,2);
  if(d.length>=2) out += ')';
  out += d.slice(2,7);
  if(d.length>7) out += '.' + d.slice(7,11);
  input.value = out;
  return out;
}
// CEP 99999-999
// CPF: máscara 000.000.000-00 e validação dos dígitos verificadores
function maskCPF(input){
  let d = input.value.replace(/\D/g,'').slice(0,11);
  let out = d;
  if(d.length>9) out = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  else if(d.length>6) out = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  else if(d.length>3) out = `${d.slice(0,3)}.${d.slice(3)}`;
  input.value = out;
  const hint = document.getElementById('cpfHint');
  if(hint){
    if(d.length===0){ hint.textContent=''; hint.style.color='var(--muted)'; }
    else if(d.length<11){ hint.textContent='Faltam dígitos…'; hint.style.color='var(--muted)'; }
    else if(validarCPF(d)){ hint.textContent='✓ CPF válido'; hint.style.color='var(--success)'; }
    else { hint.textContent='✗ CPF inválido'; hint.style.color='var(--danger)'; }
  }
  return out;
}
function validarCPF(cpf){
  cpf = (cpf||'').replace(/\D/g,'');
  if(cpf.length!==11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let soma=0;
  for(let i=0;i<9;i++) soma += parseInt(cpf[i])*(10-i);
  let d1 = 11 - (soma%11); if(d1>=10) d1=0;
  if(d1!==parseInt(cpf[9])) return false;
  soma=0;
  for(let i=0;i<10;i++) soma += parseInt(cpf[i])*(11-i);
  let d2 = 11 - (soma%11); if(d2>=10) d2=0;
  return d2===parseInt(cpf[10]);
}
function maskCEP(input){
  let d = input.value.replace(/\D/g,'').slice(0,8);
  input.value = d.length>5 ? d.slice(0,5)+'-'+d.slice(5) : d;
  return input.value;
}
// Moeda 99.999,99 (máx 99.999,99)
function maskMoeda(input){
  let d = input.value.replace(/\D/g,'').slice(0,7); // até 7 dígitos => 99999,99
  if(!d){ input.value=''; return ''; }
  let n = parseInt(d,10);
  let s = (n/100).toFixed(2);                 // "1234.56"
  let [int,dec] = s.split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); // milhar
  input.value = int + ',' + dec;
  return input.value;
}
// Valores maiores (veículo): até 9 dígitos => 9.999.999,99
function maskMoedaG(input){
  let d = input.value.replace(/\D/g,'').slice(0,11);
  if(!d){ input.value=''; return ''; }
  let s = (parseInt(d,10)/100).toFixed(2);
  let [int,dec] = s.split('.');

}

// ═══ Busca de CEP (ViaCEP) ═══
// CEP é opcional. Se preenchido (8 dígitos), busca o endereço e preenche
// o campo Endereço, permitindo complementar. Requer internet no momento do uso.
async function buscarCEP(cepRaw, alvoIds, force){
  // Ao editar um veículo já cadastrado, não refaz a busca nem sobrescreve os dados existentes
  // (a não ser que o vendedor peça explicitamente, via botão "Buscar endereço pelo CEP").
  if(W && W._editando && !force) return;
  const cep = (cepRaw||'').replace(/\D/g,'');
  if(cep.length!==8) return;
  const hint = document.getElementById('cepHint');
  if(hint) hint.textContent = 'Buscando endereço…';
  try{
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const j = await r.json();
    if(j.erro){ if(hint) hint.textContent='CEP não encontrado — preencha manualmente.'; return; }
    // preenche endereço, cidade e UF (sempre gravando o estado)
    if(j.logradouro){ W.endereco = j.logradouro; }
    if(j.localidade){ W.cidade = j.localidade; }
    if(j.uf){ W.estado = String(j.uf).toUpperCase().slice(0,2); }
    if(j.bairro){ W.bairro = j.bairro; }
    renderWizard();
    toast(`Endereço preenchido — ${j.localidade||''}/${(j.uf||'').toUpperCase()}`);
  }catch(e){
    if(hint) hint.textContent = 'Sem conexão para buscar o CEP — preencha manualmente.';
  }
}

// ── Seletor de arquivo no método do VetFlowCare ──
// O input precisa estar REALMENTE no DOM (não só criado em memória) para o
// seletor nativo de câmera abrir de forma confiável no WebView do celular
// (Android/TWA e iOS). Por isso ele é anexado ao body, escondido fora da tela,
// e só é removido depois que o arquivo já foi escolhido.
// SEM fechar a folha durante o gesto (fechar/alterar o DOM no meio do toque
// cancela a câmera no celular) — a folha é fechada só no callback, já com o arquivo em mãos.
function pegarArquivo(accept, captureVal, cb){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  if(captureVal){ inp.setAttribute('capture', captureVal); }
  inp.style.position = 'fixed';
  inp.style.left = '-9999px';
  inp.style.top = '0';
  document.body.appendChild(inp);
  inp.onchange = function(e){
    var f = e.target.files && e.target.files[0];
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(f && cb){ cb(f); }
  };
  inp.click();
}

// ═══ IndexedDB — mídia (fotos/vídeo) separada do banco principal ═══
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const r = indexedDB.open('attimodrive_midia', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('midia');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbPut(key, value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    tx.objectStore('midia').put(value, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readonly');
    const rq = tx.objectStore('midia').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    tx.objectStore('midia').delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbAll(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const out = {};
    const tx = db.transaction('midia','readonly');
    const st = tx.objectStore('midia');
    const rq = st.openCursor();
    rq.onsuccess = e => { const c = e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPutAll(obj){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    const st = tx.objectStore('midia');
    Object.entries(obj||{}).forEach(([k,v])=>st.put(v,k));
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}

// ═══ Banco de dados principal — criptografado em repouso (AES-256-GCM) ═══
// A senha nunca é gravada. Deriva-se uma chave (PBKDF2) e o JSON do banco
// é criptografado com ela antes de ir para o localStorage. Sem a senha
// certa, o conteúdo do banco não pode ser lido — mesmo com acesso ao
// aparelho. É o mesmo padrão usado no app de referência (VetFlowCare).
const LS_KEY = 'attimodrive_db';
const LS_AUTH = 'attimodrive_auth';
let DB = null;
let _cryptoKey = null;

function defaultDB(){ return { veiculos: [], consignantes: [], agendamentos: [], propostas: [], feiroes: [], financeiro:{ despesas:[], receitas:[] }, interessados: [], fichas: [], retornos: [], contadores:{veic:0,consig:0}, vendedor: { nome:'', whatsapp:'', cidade:'', empresa:'', email:'', temFoto:false } }; }
function getAuth(){ try{ return JSON.parse(localStorage.getItem(LS_AUTH)||'null'); }catch(e){ return null; } }

async function deriveKey(pass, saltU8){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations:150000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function makeCheck(key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode('attimodrive-ok'));
  return {iv:b64e(iv), ct:b64e(new Uint8Array(ct))};
}
async function verifyKey(key, check){
  try{
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(check.iv)}, key, b64d(check.ct));
    return new TextDecoder().decode(pt) === 'attimodrive-ok';
  }catch(e){ return false; }
}
let _saveTimer=null;
function save(){ clearTimeout(_saveTimer); _saveTimer=setTimeout(persistDB, 150); }
async function persistDB(){
  const raw = JSON.stringify(DB);
  if(_cryptoKey){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, _cryptoKey, new TextEncoder().encode(raw));
    localStorage.setItem(LS_KEY, JSON.stringify({iv:b64e(iv), ct:b64e(new Uint8Array(ct))}));
  } else {
    localStorage.setItem(LS_KEY, raw);
  }
}

function renderAuth(modo){
  document.getElementById('lockScreen')?.remove();
  document.getElementById('setupScreen')?.remove();
  const temConta = !!getAuth();
  modo = modo || (temConta ? 'entrar' : 'criar');
  const emailSalvo = localStorage.getItem('ad_email') || (DB && DB.vendedor && DB.vendedor.email) || '';
  const div = document.createElement('div');
  div.id = (modo === 'entrar') ? 'lockScreen' : 'setupScreen';
  let form;
  if(modo === 'entrar'){
    form = `
      <div class="auth-lb">E-mail</div>
      <div class="auth-fld"><span class="fic">${ic('mail',18)}</span>
        <input id="lockEmail" type="email" autocomplete="email" placeholder="Seu e-mail" value="${esc(emailSalvo)}"></div>
      <div class="auth-lb">Senha</div>
      <div class="auth-fld"><span class="fic">${ic('lock',18)}</span>
        <input id="lockPass" type="password" maxlength="64" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')unlockApp()">
        <button type="button" class="eye" onclick="togglePw('lockPass',this)">&#128065;</button></div>
      <button class="btn" onclick="unlockApp()">Entrar ${ic('arrow',16)}</button>
      <div class="auth-err" id="lockErr"></div>
      <button class="auth-link" onclick="lockForgot()">Esqueci minha senha</button>`;
  } else if(temConta){
    form = `
      <div class="auth-p" style="margin-top:14px">Este aparelho já tem um acesso criado. Entre com sua senha — dá para trocá-la depois em <b>Ajustes</b>.</div>
      <button class="btn" onclick="renderAuth('entrar')">Entrar com minha senha ${ic('arrow',16)}</button>`;
  } else {
    form = `
      <div class="auth-lb">E-mail</div>
      <div class="auth-fld"><span class="fic">${ic('mail',18)}</span>
        <input id="setupEmail" type="email" autocomplete="email" placeholder="Seu e-mail" value="${esc(emailSalvo)}" oninput="conferirSenhas()"></div>
      <div class="auth-lb">Senha</div>
      <div class="auth-fld"><span class="fic">${ic('lock',18)}</span>
        <input id="setupPass" type="password" maxlength="64" placeholder="Crie sua senha" oninput="conferirSenhas()">
        <button type="button" class="eye" onclick="togglePw('setupPass',this)">&#128065;</button></div>
      <div class="auth-lb">Confirmar senha</div>
      <div class="auth-fld"><span class="fic">${ic('lock',18)}</span>
        <input id="setupPass2" type="password" maxlength="64" placeholder="Repita sua senha" oninput="conferirSenhas()">
        <button type="button" class="eye" onclick="togglePw('setupPass2',this)">&#128065;</button></div>
      <div id="setupMatch" style="font-size:11.5px;font-weight:700;min-height:15px;margin-top:6px"></div>
      <button class="btn" id="setupBtn" disabled onclick="doPrimeiroAcesso()">Criar acesso e entrar ${ic('arrow',16)}</button>
      <button class="btn ghost" onclick="pularSenhaPrimeiroAcesso()">Continuar sem senha (teste grátis)</button>
      <div class="auth-err" id="setupErr"></div>
      <div class="auth-note">${ic('lock',15)}<span>Guarde sua senha. Ela não fica salva em servidor nenhum — sem ela, os dados não podem ser recuperados.</span></div>`;
  }
  div.innerHTML = `
    <div class="auth-photo" style="background-image:url('${AUTH_CAR}')">
      <div class="auth-brand2"><span>Attimo<b>Drive</b></span></div>
    </div>
    <div class="auth-wrap">
      <div class="auth-h1">Seu negócio.<br>Na <span>palma da mão.</span></div>
      <div class="auth-p">Organize seus veículos, contatos e negociações.</div>
      <div class="auth-seg">
        <button class="${modo==='criar'?'on':''}" onclick="renderAuth('criar')">Criar acesso</button>
        <button class="${modo==='entrar'?'on':''}" onclick="renderAuth('entrar')">Entrar</button>
      </div>
      ${form}
    </div>`;
  document.body.appendChild(div);
  if(modo === 'entrar') setTimeout(()=>document.getElementById('lockPass')?.focus(), 200);
}
function togglePw(id, btn){
  const el = document.getElementById(id);
  el.type = el.type==='password' ? 'text' : 'password';
  btn.textContent = el.type==='password' ? '👁' : '🙈';
}

/* ============ BECAPE (backup / restauração) ============ */
async function idbAllEntries(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    try{
      const tx = db.transaction('midia','readonly'), st = tx.objectStore('midia');
      const kq = st.getAllKeys(), vq = st.getAll(); let ks=null, vs=null;
      kq.onsuccess = ()=>{ ks = kq.result; if(vs) done(); };
      vq.onsuccess = ()=>{ vs = vq.result; if(ks) done(); };
      kq.onerror = ()=>rej(kq.error); vq.onerror = ()=>rej(vq.error);
      function done(){ const o={}; ks.forEach((k,i)=>o[k]=vs[i]); res(o); }
    }catch(e){ rej(e); }
  });
}
function diasDesdeBackup(){
  const d = localStorage.getItem('ad_last_backup'); if(!d) return null;
  const a = new Date(d+'T00:00:00'); return Math.floor((Date.now()-a.getTime())/86400000);
}
async function exportarBackup(){
  toast('Preparando backup…');
  let midia = {}; try{ midia = await idbAllEntries(); }catch(e){ midia = {}; }
  const pacote = { app:'attimodrive', formato:'backup', versao:APP_VERSION, exportadoEm:new Date().toISOString(), dados:DB, midia:midia };
  let blob; try{ blob = new Blob([JSON.stringify(pacote)], {type:'application/json'}); }catch(e){ toast('Não foi possível gerar o backup.'); return; }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'attimodrive-backup-'+isoDate(new Date())+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 1500);
  }catch(e){ toast('Não foi possível salvar o arquivo.'); return; }
  try{ localStorage.setItem('ad_last_backup', isoDate(new Date())); }catch(e){}
  toast('Backup salvo! Guarde o arquivo em local seguro (nuvem ou e-mail).');
  if(currentTab==='config') renderConfig();
}
function importarBackup(input){
  const f = input.files && input.files[0]; if(!f){ return; }
  input.value = '';
  const r = new FileReader();
  r.onload = e=>{
    let pkg; try{ pkg = JSON.parse(e.target.result); }catch(err){ toast('Arquivo inválido.'); return; }
    if(!pkg || !pkg.dados || !Array.isArray(pkg.dados.veiculos)){ toast('Este arquivo não é um backup do app.'); return; }
    window._pendBackup = pkg;
    const qtd = (pkg.dados.veiculos||[]).length;
    const dt = pkg.exportadoEm ? fmtDataBR(String(pkg.exportadoEm).slice(0,10)) : '—';
    confirmar({ icon: ic('warning',30), title:'Restaurar este backup?',
      msg:'Backup de <b>'+dt+'</b> com <b>'+qtd+' veículo(is)</b>.<br>Os dados atuais deste aparelho serão <b>substituídos</b> — veículos, consignantes, agenda, financeiro e fotos.',
      noLabel:'Cancelar', yesLabel:'Restaurar', yesBg:'var(--primary)', yes:'doRestaurarBackup()' });
  };
  r.readAsText(f);
}
async function doRestaurarBackup(){
  const pkg = window._pendBackup; if(!pkg) return;
  toast('Restaurando backup…');
  try{
    let atuais = {}; try{ atuais = await idbAllEntries(); }catch(e){ atuais = {}; }
    for(const k of Object.keys(atuais)){ try{ await idbDel(k); }catch(e){} }
    if(pkg.midia){ for(const k of Object.keys(pkg.midia)){ try{ await idbPut(k, pkg.midia[k]); }catch(e){} } }
    DB = pkg.dados;
    await persistDB();
    toast('Backup restaurado com sucesso!');
    setTimeout(()=>location.reload(), 800);
  }catch(e){ toast('Falha ao restaurar o backup.'); }
}

/* Portão de convite (fase de testes): DESLIGADO por padrão. */

function todayISO(){ return new Date().toISOString().slice(0,10); }
function addMonths(iso, m){ const d = new Date((iso||todayISO())+'T00:00:00'); d.setMonth(d.getMonth() + (m||0)); return d.toISOString().slice(0,10); }
function makeDevId(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  try{ if(window.crypto && crypto.getRandomValues){ const r = crypto.getRandomValues(new Uint8Array(4)); out = [].slice.call(r).map(function(b){ return A[b % A.length]; }).join(''); } }catch(e){}
  if(!/^[A-Z0-9]{4}$/.test(out)){ out=''; for(let i=0;i<4;i++) out += A[Math.floor(Math.random()*A.length)]; }
  return out;
}
function myDevId(){
  if(!DB) return '';
  if(!/^[A-Z0-9]{4}$/.test(DB.devId||'')){ DB.devId = makeDevId(); try{ save(); }catch(e){} }
  return DB.devId;
}
function corChecksum(devId, planIdx){
  let h = 7; const s = (devId||'') + '|' + planIdx + '|CORRETORIMOVEISPRO';
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 99991;
  return String(100 + (h % 900));
}
function corCheck(code){
  const m = /^COR-([A-Z0-9]{4})-([123])(\d{3})$/.exec((code||'').toUpperCase().trim());
  if(!m) return { ok:false, motivo:'formato' };
  const dev = m[1], idx = +m[2], chk = m[3];
  if(dev !== myDevId()) return { ok:false, motivo:'aparelho' };
  if(corChecksum(dev, idx) !== chk) return { ok:false, motivo:'invalido' };
  return { ok:true, meses: PLAN_BY_IDX[idx] };
}
/* Convite (fase de testes) — mesmo cálculo usado na Central de Envio, se ligar o portão */
function inviteChecksum(seed){ let h=7; const s=(seed||'')+'CONVITECORRETOR'; for(let i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))%99991; return String(1000 + (h%9000)); }
function inviteCheck(code){ const m=/^CNM-([A-Z0-9]{4})-(\d{4})$/.exec((code||'').toUpperCase().trim()); return !!m && inviteChecksum(m[1])===m[2]; }
function isProReal(){ const l = DB && DB.license; if(!l || !l.pro) return false; if(l.expiresAt && l.expiresAt < todayISO()) return false; return true; }

function diasRestantesPro(){ const l = DB && DB.license; if(!l || !l.expiresAt) return null; const a = new Date(l.expiresAt+'T00:00:00'); return Math.ceil((a.getTime()-Date.now())/86400000); }

}

const TRIAL_LEITURA_DIAS = 7;   // janela de consulta a contar do bloqueio

const TRIAL_DIAS = 30;

function addDays(iso, n){ const d = new Date((iso||todayISO())+'T00:00:00'); d.setDate(d.getDate()+(n||0)); return d.toISOString().slice(0,10); }
// Marca "este aparelho já usou o trial" em várias chaves + espelho no IndexedDB (sobrevive a reinstalação)
const TRIAL_MARKS = ['ad_trial_used', 'ad_tu2', 'adtrial'];
const TRIAL_IDB_KEY = '__ad_trial_flag__';
function marcarTrialUsado(){
  try{ TRIAL_MARKS.forEach(k => localStorage.setItem(k, '1')); }catch(e){}
  try{ idbPut(TRIAL_IDB_KEY, {used:1, at:new Date().toISOString()}); }catch(e){}
}
function trialJaUsado(){
  for(const k of TRIAL_MARKS){ try{ if(localStorage.getItem(k)) return true; }catch(e){} }
  return false;
}
async function trialJaUsadoForte(){
  const ls = trialJaUsado();
  let idb = false;
  try{ const v = await idbGet(TRIAL_IDB_KEY); idb = !!(v && v.used); }catch(e){}
  if(ls && !idb){ try{ idbPut(TRIAL_IDB_KEY, {used:1, at:new Date().toISOString()}); }catch(e){} }
  if(idb && !ls){ try{ TRIAL_MARKS.forEach(k => localStorage.setItem(k,'1')); }catch(e){} }
  return ls || idb;
}
// Inicia o trial de 30 dias (chamado uma única vez, no primeiro uso do aparelho)
function iniciarTrial(){
  const hoje = todayISO();
  DB.trial = { active:true, startedAt:hoje, expiresAt:addDays(hoje, TRIAL_DIAS) };
  marcarTrialUsado();
  try{ save(); }catch(e){}
}
function trialAtivo(){ const T=DB.trial; if(!T||!T.active||!T.expiresAt) return false; return todayISO() <= T.expiresAt; }
function trialExpirado(){ const T=DB.trial; return !!(T && T.startedAt && T.expiresAt && todayISO() > T.expiresAt); }
function trialDiasRestantes(){
  const T=DB.trial; if(!T||!T.expiresAt) return 0;
  const hoje=new Date(todayISO()+'T00:00:00'), fim=new Date(T.expiresAt+'T00:00:00');
  const dias=Math.ceil((fim-hoje)/86400000); return dias>0?dias:0;
}

// Cria a senha SEM apagar nada: passa a criptografar o banco que já existe.
async function criarSenhaParaDBAtual(pass){
  if(!crypto.subtle) return 'A senha só funciona com o app aberto por HTTPS (https://app.corsyncveiculos.com.br) ou instalado na tela inicial. Neste contexto a criptografia não está disponível.';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt);
  const check = await makeCheck(key);
  localStorage.setItem(LS_AUTH, JSON.stringify({salt:b64e(salt), check, createdAt:Date.now()}));
  _cryptoKey = key;
  if(DB && DB.settings) DB.settings.senhaDispensada = false;
  await persistDB();
  sessionStorage.setItem('unlocked','1');
  return '';
}

function renderLock(){ renderAuth('entrar'); }
async function unlockApp(){
  const auth = getAuth();
  const pass = val('lockPass');
  const err = document.getElementById('lockErr');
  const until = parseInt(localStorage.getItem('ad_lock_until')||'0');
  if(Date.now() < until){ err.textContent = `Muitas tentativas — aguarde ${Math.ceil((until-Date.now())/1000)}s`; return; }
  if(!pass){ err.textContent = 'Digite a senha'; return; }
  err.textContent = 'Verificando…';
  const key = await deriveKey(pass, b64d(auth.salt));
  if(!(await verifyKey(key, auth.check))){
    const tries = parseInt(localStorage.getItem('ad_bad')||'0') + 1;
    localStorage.setItem('ad_bad', tries);
    if(tries>=5){
      localStorage.setItem('ad_lock_until', Date.now()+30000);
      localStorage.setItem('ad_bad','0');
      err.textContent = '5 tentativas erradas — aguarde 30 segundos';
    } else {
      err.textContent = `Senha incorreta (${tries}/5)`;
    }
    return;
  }
  localStorage.removeItem('ad_bad'); localStorage.removeItem('ad_lock_until');
  _cryptoKey = key;
  try{
    const blob = JSON.parse(localStorage.getItem(LS_KEY));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(blob.iv)}, key, b64d(blob.ct));
    DB = JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ DB = defaultDB(); }
  sessionStorage.setItem('unlocked','1');
  document.getElementById('lockScreen')?.remove();
  document.getElementById('setupScreen')?.remove();
  enterApp();
}

// ═══ SINO DE AVISOS (Agenda/Alertas) — mesmo padrão do VetFlowCare ═══
// Quais dias de antecedência estão ativos nos Ajustes (7/3/1). Sempre pelo menos 1 dia.
function activeAlertDays(){
  const s = DB.settings||{}; const d=[];
  if(s.aviso7) d.push(7); if(s.aviso3) d.push(3); if(s.aviso1) d.push(1);
  return d.length ? d : [1];
}
function diasAte(iso){
  const hoje = new Date(isoDate(new Date())+'T00:00:00');
  const alvo = new Date((iso||'')+'T00:00:00');
  return Math.round((alvo-hoje)/86400000);
}
// Junta os compromissos (visitas) relevantes para avisos: vencidos, de hoje e os
// próximos dentro da antecedência configurada — cada grupo respeita seu toggle em Ajustes.
function compromissosAviso(){
  const s = DB.settings||{};
  const dias = activeAlertDays();
  return (DB.agendamentos||[]).filter(a=>a.data).map(a=>({a, d:diasAte(a.data)}))
    .filter(({d})=>{
      if(d<0) return !!s.avisoAtrasado;
      if(d===0) return !!s.avisoHoje;
      return dias.includes(d);
    })
    .sort((x,y)=>x.d-y.d);
}
// Conta só o que exige atenção AGORA (vencido ou de hoje) — é o número do sino.
function contarAvisosPendentes(){
  return compromissosAviso().filter(({d})=>d<=0).length + ((typeof retornosVencidos==='function' && DB.settings && DB.settings.avisoHoje!==false) ? retornosVencidos().length : 0);
}
function abrirAvisos(){
  const itens = compromissosAviso();
  const rts = (typeof retornosVencidos==='function') ? retornosVencidos() : [];
  if(!itens.length && !rts.length){
    showSheet('🔔 Avisos', `<div class="empty"><div class="big">${ic('calendar',40)}</div>Nenhum aviso no momento.<br><span style="font-size:12px">Compromissos vencidos, de hoje ou próximos aparecem aqui.</span></div>`,
      `<button class="btn gray" onclick="closeSheet()">Fechar</button><button class="btn" onclick="closeSheet();goTab('config')">Ajustar avisos</button>`);
    return;
  }
  const linhas = itens.map(({a,d})=>{

function notify(title, body){

// Roda no máximo 1x por dia: notifica os compromissos vencidos/hoje/próximos (conforme Ajustes)
function checarLembretesVisita(){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    let fired=[]; try{ fired=JSON.parse(localStorage.getItem('ad_lembretes_fired')||'[]'); }catch(e){}
    const now=Date.now(); let changed=false;
    (DB.agendamentos||[]).forEach(a=>{
      const mins=parseInt(a.lembrete||0)||0; if(!mins||!a.data||!a.hora) return;
      const vt=new Date(a.data+'T'+a.hora+':00').getTime(); if(isNaN(vt)) return;
      const rt=vt-mins*60000; const k=a.id+'@'+a.data+'T'+a.hora;
      if(now>=rt && now<vt+3600000 && fired.indexOf(k)<0){
        const im=DB.veiculos.find(x=>x.id===a.veiculoId);
        const end=im?((im.marca||'')+' '+(im.modelo||'')).trim():'';
        notify('🔔 Compromisso em breve', `${a.compradorNome||'Interessado'} às ${a.hora}${end?' · '+end:''}`);
        fired.push(k); changed=true;
      }
    });
    if(changed) localStorage.setItem('ad_lembretes_fired', JSON.stringify(fired.slice(-300)));
  }catch(e){}
}

}

function quandoLabel(dataISO){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const [a,m,d] = (dataISO||'').split('-').map(Number);
  if(!a) return '';
  const dt = new Date(a,m-1,d); dt.setHours(0,0,0,0);
  const diff = Math.round((dt-hoje)/86400000);
  if(diff===0) return 'Hoje';
  if(diff===1) return 'Amanhã';
  if(diff===-1) return 'Ontem';
  return fmtDataBR(dataISO).slice(0,5);
}
// ── Financeiro em aberto na tela Início ──────────────────────────────────────
// "Em aberto" segue exatamente a mesma regra da tela Financeiro: é todo
// lançamento (receita ou despesa) que ainda NÃO tem "Data realizada" preenchida.
//  • Atrasados  → data anterior a hoje (a pagar vencido / a receber não recebido).
//                 Mostra TODOS, sem limite.
//  • A vencer   → de hoje até hoje + 3 dias (janela dos próximos 3 dias).
// As cores são as mesmas do Financeiro: receita verde (+), despesa vermelha (-).
function diasAteData(iso){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const [a,m,d] = (iso||'').split('-').map(Number);
  if(!a) return null;
  const dt = new Date(a,m-1,d); dt.setHours(0,0,0,0);
  return Math.round((dt-hoje)/86400000);
}
function titulosEmAberto(){
  const hoje = isoDate(new Date());
  const lim = new Date(); lim.setHours(0,0,0,0); lim.setDate(lim.getDate()+3);
  const limISO = isoDate(lim);
  const fin = DB.financeiro || {};
  const abertos = [
    ...(fin.receitas||[]).filter(e=>!e.dataRealizada && e.data).map(e=>({...e,_tipo:'rec'})),
    ...(fin.despesas||[]).filter(e=>!e.dataRealizada && e.data).map(e=>({...e,_tipo:'desp'}))
  ];
  const porData = (a,b)=>(a.data||'').localeCompare(b.data||'');
  return {
    atrasados: abertos.filter(e=>e.data <  hoje).sort(porData),
    proximos:  abertos.filter(e=>e.data >= hoje && e.data <= limISO).sort(porData)
  };
}
function totaisTitulos(lista){
  return {
    receber: lista.filter(e=>e._tipo==='rec').reduce((s,e)=>s+(e.valor||0),0),
    pagar:   lista.filter(e=>e._tipo==='desp').reduce((s,e)=>s+(e.valor||0),0)
  };
}

function excluirConsignante(id){
  if(bloqueioTrial('excluir o consignante')) return;
  const p = DB.consignantes.find(x=>x.id===id);
  const nome = p ? (p.nome||'este consignante') : 'este consignante';
  const vinculados = veiculosDoConsignante(id);

  // Com veículo cadastrado, a exclusão é BLOQUEADA — o veículo ficaria sem dono.
  if(vinculados.length){
    const lista = vinculados.map(im=>
      `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
         <span>${esc((im.marca||'')+' '+(im.modelo||''))}</span>
         <b class="mono" style="color:var(--primary)">${esc((im.codigo||'').toUpperCase())}</b>
       </div>`).join('');
    confirmar({icon:'⛔', title:'Não é possível excluir',
      msg:`<b>Tem veículo deste consignante.</b><br>
        <span style="font-size:12.5px">${esc(nome)} está em <b>${vinculados.length} veículo(is)</b>. Exclua ou troque o consignante desses veículos antes de apagar o cadastro.</span>
        <div style="margin-top:10px;text-align:left;font-size:12.5px">${lista}</div>`,
      single:true, yesLabel:'Entendi', yesBg:'var(--primary)', yes:''});
    return;
  }

  confirmar({icon:'🗑️', title:'Excluir consignante?',
    msg:`Deseja realmente excluir <b>${esc(nome)}</b>? Esta ação não pode ser desfeita.`,
    noLabel:'Cancelar', yesLabel:'Excluir', yes:`doExcluirConsignante('${id}')`});

  else if(!P.codigo){ P.codigo = DB.consignantes[idx].codigo || pad6(maiorSeqConsig()+1); }
  P.updatedAt = Date.now();

  save();

// Comissão: até 2 dígitos inteiros e 1 casa decimal (0.0 – 99.9)
function sanitizarComissao(input){
  let v = input.value.replace(',', '.').replace(/[^0-9.]/g,'');
  const parts = v.split('.');
  let intp = (parts[0]||'').slice(0,2);
  let dec = parts.length>1 ? '.' + (parts[1]||'').slice(0,1) : (v.endsWith('.') ? '.' : '');
  v = intp + dec;
  input.value = v;
  return v;
}
function comissaoConsignTxt(p){
  if(!p) return '—';
  const v = parseFloat((p.comissaoValor||'').toString().replace(',','.'))||0;
  if(!v) return '—';
  return p.comissaoTipo==='fixo' ? fmtBRL(parseMoeda(p.comissaoValor||'')) : v.toString().replace('.',',')+'%';
}

async function editarVeiculo(id){
  if(bloqueioTrial('editar o veículo')) return;
  const im = DB.veiculos.find(x=>x.id===id);
  if(!im) return;
  W = JSON.parse(JSON.stringify(im));
  W._editando = true;
  if(!Array.isArray(W.opcionais)) W.opcionais = [];
  if(!W.codigo) W.codigo = im.codigo || proximoCodigoVeiculo();
  if(!Array.isArray(W.fotosPublicas) || W.fotosPublicas.length<6){ const f=[false,false,false,false,false,false]; (W.fotosPublicas||[]).forEach((v,i)=>{ if(i<6) f[i]=!!v; }); W.fotosPublicas=f; }
  // valores numéricos gravados viram texto mascarado para edição
  const centavos = n => (n===''||n===undefined||n===null) ? '' : maskMoedaFromNumber(n||0);
  W.valorFipe = centavos(im.valorFipe);
  W.valorVenda = centavos(im.valorVenda);
  W.valorCusto = centavos(im.valorCusto);
  W.km = (im.km===''||im.km===undefined||im.km===null) ? '' : String(im.km);
  wStep = 0; wCache = {};
  document.getElementById('mainNav').classList.remove('hidden');
  renderWizard();
}

  ['Vinho','#7F1D1D'],['Dourado','#C9A227']];
function opcTipo(t){
  t = t||'carro';
  const moto = t==='moto', cam = t==='caminhao', pick = t==='caminhonete';
  return {
    carroceria: moto ? ['Street','Naked','Esportiva','Trail','Big trail','Custom','Scooter','Touring','Off-road']
              : cam ? ['3/4','Toco','Truck','Bitruck','Cavalo mecânico']
              : pick ? ['Cabine simples','Cabine estendida','Cabine dupla','Furgão','Utilitário']
              : ['Hatch','Sedã','SUV','Picape','Minivan','Perua/SW','Cupê','Conversível'],
    implemento: cam ? ['Baú','Sider','Graneleiro','Basculante','Tanque','Prancha','Frigorífico','Só chassi'] : null,
    combustivel: moto ? ['Gasolina','Flex','Elétrica'] : cam ? ['Diesel','GNV','Elétrico'] : ['Flex','Gasolina','Etanol','Diesel','GNV','Elétrico','Híbrido'],
    cambio: moto ? ['Manual','Automática'] : cam ? ['Manual','Automatizado'] : ['Manual','Automático','Automatizado','CVT'],
    portas: (moto||cam) ? null : ['2','3','4','5'],
    direcao: moto ? null : ['Hidráulica','Elétrica','Eletro-hidráulica','Mecânica'],
    tracao: moto ? null : cam ? ['4x2','6x2','6x4','8x2','8x4'] : ['4x2','4x4','AWD'],
    motorLabel: moto ? 'Cilindrada' : cam ? 'Potência' : 'Motor',
    motorPh: moto ? 'Ex.: 160 cc' : cam ? 'Ex.: 440 cv' : 'Ex.: 1.0 Turbo',
    blindagem: !(moto||cam),
    opcionais: moto
      ? ['ABS','Partida elétrica','Injeção eletrônica','Painel digital','Farol de LED','Controle de tração','Baú/bauleto','Protetor de motor','Alarme','Chave reserva','Manual do proprietário']
      : cam
      ? ['Ar-condicionado','Freio motor','Suspensão a ar','Cabine leito','Tacógrafo','Rastreador','Defletor','Piloto automático','Multimídia','Chave reserva','Manual do proprietário']
      : ['Ar-condicionado','Vidro elétrico','Trava elétrica','Retrovisor elétrico','Air bag','ABS','Multimídia','Câmera de ré',
         'Sensor de estacionamento','Bancos de couro','Rodas de liga','Teto solar','Piloto automático','Faróis de LED',
         'Partida por botão','Carregador por indução','Alarme','Chave reserva','Manual do proprietário']
  };
}
function chipM(campo, v, label){ // múltipla escolha
  const on = (W[campo]||[]).includes(v);
  return `<div class="chip ${on?'selected':''}" onclick="toggleMulti('${campo}','${v.replace(/'/g,"\\'")}')">${on?'✓ ':''}${esc(label||v)}</div>`;
}
function toggleMulti(campo, v){
  W[campo] = W[campo]||[];
  const i = W[campo].indexOf(v);
  if(i>=0) W[campo].splice(i,1); else W[campo].push(v);
  renderWizard();
}
function chipCor(nome, hex){
  return `<div class="chip chip-cor ${W.cor===nome?'selected':''}" onclick="setChip('cor','${nome}')"><span class="sw" style="background:${hex}"></span>${esc(nome)}</div>`;
}
function chipsDe(campo, lista){ return lista.map(v=>chip(campo, v, v)).join(''); }
function simNao(campo){ return `<div class="chip-group">${chipBool(campo)}</div>`; }
function ajustarAoTipo(){
  const o = opcTipo(W.tipo);
  if(!o.combustivel.includes(W.combustivel)) W.combustivel = o.combustivel[0];
  if(!o.cambio.includes(W.cambio)) W.cambio = o.cambio[0];
  if(W.carroceria && !o.carroceria.includes(W.carroceria)) W.carroceria = '';
  if(!o.portas) W.portas = ''; if(!o.direcao) W.direcao = ''; if(!o.tracao || (W.tracao && !o.tracao.includes(W.tracao))) W.tracao = '';
  if(!o.implemento) W.implemento = '';
  if(!o.blindagem){ W.blindado = false; W.blindagemNivel = ''; }
  W.opcionais = (W.opcionais||[]).filter(x=>o.opcionais.includes(x));
}

function renderWizard(){
  const tabs = stepNames.map((n,i)=>`<div class="wtab ${i===wStep?'on':''}" onclick="irStep(${i})">${i+1}. ${n}</div>`).join('');
  appHdr().innerHTML = `
    <div class="progress-wrap" style="padding:0">
      <div class="progress-top"><span class="progress-label">ETAPA ${wStep+1} DE ${TOTAL_STEPS}</span><span class="progress-name">${tipoVeiculoLabel(W.tipo)} · ${stepNames[wStep]}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${((wStep+1)/TOTAL_STEPS)*100}%"></div></div>
      <div class="wtabs">${tabs}</div>
    </div>`;
  const ultima = TOTAL_STEPS-1;
  const editando = DB.veiculos.some(x=>x.id===W.id);
  document.getElementById('mainContent').innerHTML = `<div style="padding-bottom:150px">${stepPaneHTML(wStep)}</div>
    <div class="wizfooter"><div class="btnrow">
      <button class="btn gray" onclick="${wStep===0?'sairWizardSemSalvar()':'irStep(wStep-1)'}">Voltar</button>
      ${editando && wStep!==ultima ? `<button class="btn green" onclick="salvarVeiculo()">Gravar</button>` : ''}
      <button class="btn ${wStep===ultima?'green':''}" onclick="${wStep===ultima?'salvarVeiculo()':'irStep(wStep+1)'}">${wStep===ultima?'Salvar veículo':'Avançar'}</button>
    </div></div>`;
  if(wStep===4) hydratarFotos();
}
function validarStep(s){
  if(s===0 && !((W.marca||'').trim() && (W.modelo||'').trim())){ toast('Informe a marca e o modelo do veículo.'); return false; }
  if(s===2 && W.origem==='Consignado' && !W.consignanteId){ toast('Selecione o consignante deste veículo.'); return false; }
  if(s===3 && !parseMoeda(W.valorVenda||'')){ toast('Informe o valor de venda.'); return false; }
  return true;
}
function irStep(i){
  if(i > wStep && !validarStep(wStep)) return;
  wStep = Math.max(0, Math.min(i,TOTAL_STEPS-1)); renderWizard(); window.scrollTo(0,0);
}

function chip(group,valv,label){ return `<div class="chip ${W[group]===valv?'selected':''}" onclick="setChip('${group}','${valv.replace(/'/g,"\\'")}')">${esc(label)}</div>`; }
function chipBool(campo){ return `<div class="chip ${W[campo]?'selected':''}" onclick="W.${campo}=true;renderWizard()">Sim</div><div class="chip ${!W[campo]?'selected':''}" onclick="W.${campo}=false;renderWizard()">Não</div>`; }
function setChip(group,v){
  W[group]=v;

function downscaleImage(dataUrl, maxDim, quality, done){
  try{
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      done(c.toDataURL('image/jpeg', quality || 0.82));
    };
    img.onerror = function(){ done(dataUrl); };
    img.src = dataUrl;
  }catch(e){ done(dataUrl); }
}
async function hydratarFotos(){
  const els = document.querySelectorAll('[data-needload]');
  if(!els.length) return;
  let changed = false;
  for(const el of els){
    const key = el.dataset.needload;
    if(wCache[key]) continue;
    const data = await idbGet(key).catch(()=>null);
    if(data){ wCache[key]=data; changed=true; }
  }
  if(changed) renderWizard();
}
async function onFotoSelected(kind, i, input){

  reader.readAsDataURL(file);
}

function montarTextoVeiculo(im){
  const cor = DB.vendedor || {};
  let t = `🚗 ${(im.marca||'')} ${(im.modelo||'')}`.trim();
  if(im.versao) t += ` ${im.versao}`;
  t += ` à venda\n`;
  const l2 = [];
  if(im.anoFab||im.anoModelo) l2.push(`${im.anoFab||'?'}/${im.anoModelo||'?'}`);
  if(im.cor) l2.push(im.cor);
  if(im.km) l2.push(`${Number(im.km).toLocaleString('pt-BR')} km`);
  if(l2.length) t += l2.join(' · ')+'\n';
  const l3 = [];
  if(im.combustivel) l3.push(im.combustivel);
  if(im.cambio) l3.push(im.cambio);
  if(im.carroceria) l3.push(im.carroceria);
  if(im.motor) l3.push(im.motor);
  if(im.portas) l3.push(im.portas+' portas');
  if(l3.length) t += l3.join(' · ')+'\n';
  const opc = [...(im.opcionais||[]), im.opcionaisOutros].filter(Boolean);
  if(opc.length) t += `\n✅ ${opc.join(', ')}\n`;
  const extras = [];
  if(im.conservacao) extras.push('Estado: '+im.conservacao);
  if(im.revisoes && /em dia/i.test(im.revisoes)) extras.push('Revisões '+im.revisoes.toLowerCase());
  if(im.laudo==='Aprovado') extras.push('Laudo cautelar aprovado');
  if(im.unicoDono) extras.push('Único dono');
  if(im.garantia) extras.push('Na garantia'+(im.garantiaAte?' até '+im.garantiaAte:''));
  if(im.blindado) extras.push('Blindado'+(im.blindagemNivel?' '+im.blindagemNivel:''));
  if(im.aceitaTroca) extras.push('Aceita troca');
  if(im.aceitaFinanc) extras.push('Aceita financiamento');
  if(extras.length) t += extras.map(x=>'• '+x).join('\n')+'\n';
  if(im.descricao) t += `\n${im.descricao}\n`;
  if(im.placaVisivel && im.placa) t += `Placa: ${im.placa.toUpperCase()}\n`;
  t += `\n`;
  if(im.valorVenda>0) t += `💰 ${fmtBRL(im.valorVenda)}\n`;
  if(cor.nome || cor.whatsapp || cor.empresa){
    t += `\n————————\n`;
    if(cor.nome) t += `${cor.nome}\n`;
    if(cor.empresa) t += `${cor.empresa}\n`;
    if(cor.whatsapp) t += `WhatsApp: ${cor.whatsapp}\n`;
    t = t.replace(/\n$/,'');
  }
  return t.trim();
}

async function fazerCompartilhamento(){
  const d = _shareData; if(!d){ closeSheet(); return; }
  const files = (d.files || []).slice();
  if(files.length && navigator.canShare){
    let ok = false; try{ ok = navigator.canShare({ files }); }catch(e){ ok = false; }
    if(ok){
      try{ await navigator.share({ files, text: d.texto }); closeSheet(); return; }
      catch(e){ if(e && e.name==='AbortError'){ return; } }
    }
  }
  if(navigator.share){
    try{ await navigator.share({ text: d.texto }); closeSheet(); return; }
    catch(e){ if(e && e.name==='AbortError'){ return; } }
  }
  window.open('https://wa.me/?text='+encodeURIComponent(d.texto),'_blank');
}

        <div style="font-size:10.5px;color:${acc>=0?'var(--success)':'var(--danger)'}">saldo ${fmtBRL(acc)}</div>

// ═══ Consulta ideal (busca cruzada) ═══
(function(){
  function updFade(row){
    var wrap=row.closest('.hscrollwrap'); if(!wrap) return;
    var l=wrap.querySelector('.chipfade-l'), r=wrap.querySelector('.chipfade-r');
    var over=row.scrollWidth-row.clientWidth;
    if(l) l.style.display=(row.scrollLeft>2)?'flex':'none';
    if(r) r.style.display=(over>2 && row.scrollLeft<over-2)?'flex':'none';
  }
  var SEL='.chiprow,.wtabs,.weekstrip,.pills,.quick,.cat-row', MO=null;
  function decorate(){
    document.querySelectorAll(SEL).forEach(function(row){
      if(!row.closest('.hscrollwrap')){
        var wrap=document.createElement('div'); wrap.className='hscrollwrap';
        row.parentNode.insertBefore(wrap,row); wrap.appendChild(row);
        var l=document.createElement('div'); l.className='chipfade chipfade-l'; l.innerHTML='<b>‹</b>'; wrap.appendChild(l);
        var r=document.createElement('div'); r.className='chipfade chipfade-r'; r.innerHTML='<b>›</b>'; wrap.appendChild(r);
      }
      if(!row.__wired){ row.__wired=true; row.addEventListener('scroll',function(){updFade(row);},{passive:true}); }
      updFade(row);
    });
  }
  function schedule(){ if(MO)MO.disconnect(); requestAnimationFrame(function(){ try{decorate();}catch(e){} if(MO){ var mc=document.getElementById('mainContent'); if(mc)MO.observe(mc,{childList:true,subtree:true}); var md=document.getElementById('modals'); if(md)MO.observe(md,{childList:true,subtree:true}); } }); }
  function start(){ MO=new MutationObserver(schedule); schedule(); window.addEventListener('resize',function(){ document.querySelectorAll(SEL).forEach(updFade); }); }
  if(document.readyState!=='loading') start(); else document.addEventListener('DOMContentLoaded',start);
})();

function buscarConsultaIdeal(){
  const g=id=>document.getElementById(id);
  const tipo=g('ciTipo').value;
  const marca=(g('ciMarca').value||'').trim().toLowerCase();
  const anoMin=parseInt(g('ciAnoMin').value||'0')||0;
  const vmin=parseMoeda(g('ciValorMin').value||'')||0;
  const vmaxR=parseMoeda(g('ciValorMax').value||'')||0;
  const vmax=vmaxR>0?vmaxR:Infinity;
  const items=(DB.veiculos||[]).filter(im=>{
    if(tipo!=='todos' && im.tipo!==tipo) return false;
    if(marca && !((im.marca||'').toLowerCase().includes(marca))) return false;
    const val=im.valorVenda||0;
    if(val>0){ if(val<vmin||val>vmax) return false; } else if(vmin>0){ return false; }
    const ano=parseInt(im.anoModelo||im.anoFab||'0')||0;
    if(anoMin>0 && ano && ano<anoMin) return false;
    return true;
  }).sort((a,b)=>((a.valorVenda||0)-(b.valorVenda||0)));
  const cont=g('ciResultados');
  if(!items.length){ cont.innerHTML=`<div class="empty"><div class="big">🔍</div>Nenhum veículo da sua carteira combina com esses critérios.<br><span style="font-size:12px">Ajuste os filtros e tente de novo.</span></div>`; return; }
  cont.innerHTML=`<div class="sec">${items.length} veículo(is) combinam</div>`+items.map(im=>{
    return `<div class="card" style="cursor:pointer;margin-bottom:10px" onclick="abrirDetalhe('${im.id}')">
      <div style="font-weight:800;color:var(--text)">${esc((im.marca||'')+' '+(im.modelo||''))}</div>
      <div style="font-size:12px;color:var(--primary);font-weight:700;font-family:monospace">${esc((im.codigo||'').toUpperCase())}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(im.anoFab||'')}/${esc(im.anoModelo||'')}${im.km?` · ${Number(im.km).toLocaleString('pt-BR')} km`:''}${im.cor?` · ${esc(im.cor)}`:''}</div>
      <div style="font-weight:800;color:var(--success);margin-top:4px">${im.valorVenda>0?fmtBRL(im.valorVenda):'Valor a combinar'}</div>
    </div>`;
  }).join('');
}

function criarVeiculoDaTroca(proposta){
  const t = proposta.troca||{};
  const prox = maiorSeqVeiculo()+1;
  DB.contadores.veic = prox;
  const veiculo = {
    id: uid(), tipo:'carro', codigo:'cn'+pad5(prox),
    status:'Disponível', dataInclusao:isoDate(new Date()), createdAt:Date.now(), updatedAt:Date.now(),
    marca:t.marca||'', modelo:t.modelo||'', versao:'', anoFab:t.ano||'', anoModelo:t.ano||'',
    cor:t.cor||'', km:parseInt(t.km)||0, combustivel:'', cambio:'',
    placa:'', placaVisivel:false, chassi:'',
    origem:'Recebido em troca', consignanteId:'',
    valorFipe:0, valorVenda:parseMoeda(t.valorAvaliacao||''), valorCusto:parseMoeda(t.valorAvaliacao||''),
    ipvaEmDia:false, semMultas:false, semDebitos:false, licenciado:false, unicoDono:false, semSinistro:false,
    observacoes: t.condicao ? ('Recebido em troca — '+t.condicao) : 'Recebido em troca',
    fotosPublicas:[false,false,false,false,false,false],
    propostaOrigemId: proposta.id
  };
  DB.veiculos.push(veiculo);

function salvarProposta(){
  if(bloqueioTrial('salvar a proposta')) return;
  if(!(PR.compradorNome||'').trim()){ toast('Informe o nome do comprador.'); return; }
  if(!PR.veiculoId){ toast('Escolha o veículo de interesse.'); return; }
  const idxAntes = DB.propostas.findIndex(x=>x.id===PR.id);
  const statusAntes = idxAntes>=0 ? DB.propostas[idxAntes].status : null;
  PR.updatedAt = Date.now();
  const dados = JSON.parse(JSON.stringify(PR));
  const idx = DB.propostas.findIndex(x=>x.id===PR.id);
  if(idx>=0) DB.propostas[idx]=dados; else DB.propostas.push(dados);

  // conclusão da venda: gera veículo da troca (se marcado) e atualiza status do veículo vendido
  if(dados.status==='Concluída' && statusAntes!=='Concluída'){
    if(dados.troca && dados.troca.autoRegistrar){
      const jaExiste = DB.veiculos.some(v=>v.propostaOrigemId===dados.id);
      if(!jaExiste) criarVeiculoDaTroca(dados);
    }
    const vendido = DB.veiculos.find(v=>v.id===dados.veiculoId);
    if(vendido){ vendido.status='Vendido'; vendido.updatedAt=Date.now(); }
    if(_propostaFeiraoId){
      const fr = DB.feiroes.find(f=>f.id===_propostaFeiraoId);
      if(fr){ fr.vendaIds = fr.vendaIds||[]; if(!fr.vendaIds.includes(dados.id)) fr.vendaIds.push(dados.id); fr.updatedAt=Date.now(); }
    }
  }
  save();
  toast(idx>=0?'Proposta regravada.':'Proposta salva.');
  const feiraoId = _propostaFeiraoId;
  PR = null; _propostaFeiraoId = null;
  if(feiraoId){ abrirFeiraoDetalhe(feiraoId); } else { abrirPropostas(); }
}

function doExcluirProposta(id){

  DB.propostas = DB.propostas.filter(x=>x.id!==id);

  save(); toast('Proposta excluída.'); PR=null; abrirPropostas();
}

function agCalGridHTML(){

function salvarVisita(){
  if(bloqueioTrial('salvar o test-drive')) return;
  if(!V.veiculoId){ toast('Escolha o veículo do test-drive.'); return; }
  if(!V.compradorNome.trim()){ toast('Informe o nome do comprador.'); return; }
  V.updatedAt = Date.now();
  const novo = V._novo;
  const dados = JSON.parse(JSON.stringify(V));
  delete dados._novo;

  const idx = DB.agendamentos.findIndex(a=>a.id===V.id);
  if(idx>=0) DB.agendamentos[idx] = dados; else DB.agendamentos.push(dados);

  DB.financeiro.despesas = DB.financeiro.despesas.filter(d=>d.agendamentoId!==V.id);
  const im = DB.veiculos.find(x=>x.id===V.veiculoId);
  const reg = (im?.codigo||'').toUpperCase();
  const cats = { transporte:'Transporte', refeicao:'Refeição', gasolina:'Gasolina' };
  Object.keys(cats).forEach(k=>{
    const valor = parseMoeda(V.despesas[k]||'');
    if(valor>0){
      DB.financeiro.despesas.push({
        id: uid(), categoria: cats[k], valor, data: V.data,
        origem:'agenda', agendamentoId: V.id, veiculoId: V.veiculoId, veiculoCodigo: reg,
        descricao: `Test-drive ${reg} — ${V.compradorNome}`.trim(), createdAt: Date.now()
      });
    }
  });
  (V.despesas.outrosLista||[]).forEach(o=>{
    const valor = parseMoeda(o.valor||'');
    if(valor>0){
      const nome = (o.desc||'').trim();
      DB.financeiro.despesas.push({
        id: uid(), categoria:'Outros', valor, data: V.data,
        origem:'agenda', agendamentoId: V.id, veiculoId: V.veiculoId, veiculoCodigo: reg,
        descricao: `Test-drive ${reg} — ${V.compradorNome}${nome?' — '+nome:''}`.trim(), createdAt: Date.now()
      });
    }
  });
  save();
  toast(novo?'Test-drive agendado e despesas lançadas.':'Test-drive regravado e despesas atualizadas.');
  V = null;
  goTab('agenda');
}
